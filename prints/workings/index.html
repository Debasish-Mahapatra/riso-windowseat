<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>workings — riso prints</title>
<style>
  /* The harness screenshots the whole viewport, so the canvas sits at the
     origin with nothing above or beside it and the caption lives below it. */
  html, body { margin: 0; background: #14141a; color: #b9b4c8;
               font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; }
  canvas { display: block; width: 720px; height: 720px; }
  #cap { width: 720px; padding: 10px 0 24px; display: flex; gap: 10px; align-items: baseline; }
  #cap b { color: #ffd2ec; font-weight: 600; }
  #cap span { color: #6f6a80; }
  #load { position: fixed; top: 320px; left: 0; width: 720px; text-align: center;
          color: #d8d4e4; font-size: 13px; }
</style>

<canvas id="c"></canvas>
<div id="cap"><b id="cap-name">—</b><span id="cap-note"></span><span style="flex:1"></span><span>← → to step</span></div>
<div id="load">baking plates…</div>

<script>
'use strict';

/* ─────────────────────────────────────────────────────────────────────────────
   workings — a series of riso prints.

   Stills, not a film, so every mark is on a baked plate and nothing is live.
   That is the whole reason this file exists: shade() is a baked-plate operation,
   so a print can carry real coverage ramps everywhere a film has to settle for
   one flat inkPass coverage or a stepped bandPass.

   The engine and craft kit below are copied from studies/composition.html. The
   film-only machinery is deliberately absent — ripples, the centre dot, plate
   swaps, the cyanotype drain, inkPass and the motion kit all need a t, and a
   print has none. Improve the engine in a film and re-copy; do not fork it here.

   Read docs/drawing.md (drawing and composition craft) for what
   each print is spending, and .claude/rules/riso-plates.md for plate order.
     node shoot.mjs ../prints/workings/index.html --times 0 --out ../out/workings
     node verify.mjs ../prints/workings/index.html --times 0
   ───────────────────────────────────────────────────────────────────────── */

const CSS = 720;             // styled size
const W   = 1080;            // drawing space; every scene draws in 1080 units

/* Bake size. The screen pitch is defined in device pixels, so a bigger print
   has to scale the pitch with it or the dots get finer instead of the picture
   getting larger. Both move together here: OUT = 2160 is the same picture at
   2x, print-ready at about 7 inches, not a differently-screened one. */
const OUT   = 1080;
const K     = OUT / W;
const PITCH = 4.6 * K;       // device px between dot centres

const PAPER = '#F2EDE3';
const INK = {
  blue:   '#0078BF',
  pink:   '#FF48B0',
  yellow: '#FFE800',
  green:  '#00A95C',
  orange: '#FF6C2F',
  violet: '#765BA7',
  indigo: '#2E3192',
};

/* Screen angles as rational tangents (b/a). A rotated dot grid only repeats
   seamlessly on a rational tangent, so these are the real angles rather than
   the nominal 15/45/75 — any other value leaves a visible seam where the
   pattern tile wraps. */
const SCREEN = {
  blue:   { a: 4, b: 1 },   // 14.0°
  pink:   { a: 1, b: 4 },   // 76.0°
  yellow: { a: 1, b: 0 },   //  0.0°
  green:  { a: 1, b: 1 },   // 45.0°
  orange: { a: 2, b: 1 },   // 26.6°
  violet: { a: 1, b: 2 },   // 63.4°
  indigo: { a: 1, b: 1 },   // 45.0°
};

/* Registration: each plate misses by a fixed amount, in device px. */
const REG = {
  blue:   [ 1.5, -1.0], pink:   [-2.5,  2.0], yellow: [ 2.0,  1.5],
  green:  [-1.5, -1.5], orange: [ 1.0,  2.0], violet: [-2.0, -1.0],
  indigo: [ 0.0,  0.0],
};

const CX = W / 2, CY = W / 2;

/* ── deterministic randomness ─────────────────────────────────────────────── */

function mulberry32(a) {
  return function () {
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hash(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
const rngFor = (key) => mulberry32(hash(key));

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, u) => a + (b - a) * u;

function cv(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}

/* ── halftone screens ─────────────────────────────────────────────────────────
   For screen angle tanθ = b/a the dot lattice is generated by the orthogonal
   vectors P/√(a²+b²)·(a,b) and P/√(a²+b²)·(−b,a). That lattice contains
   (P√(a²+b²), 0), so a square tile of side S = P√(a²+b²) repeats seamlessly and
   holds exactly a²+b² dots.

   Screens are anchored to canvas space, never to the object being drawn. A
   screen that rides along with its subject makes the texture crawl, which is
   the single most recognisable way this look goes wrong.                     */

const screens = {};

function buildScreen(name) {
  const { a, b } = SCREEN[name];
  const n = a * a + b * b;
  const S = Math.max(2, Math.round(PITCH * Math.sqrt(n)));
  const P = S / Math.sqrt(n);              // effective pitch after rounding
  const u = P / Math.sqrt(n);
  const v1 = [u * a, u * b], v2 = [-u * b, u * a];

  // Lattice points reduced into the tile, plus wrapped neighbours so dots that
  // straddle an edge are drawn on both sides.
  const pts = [];
  for (let m = -n; m <= n; m++) {
    for (let k = -n; k <= n; k++) {
      const x = m * v1[0] + k * v2[0], y = m * v1[1] + k * v2[1];
      const wx = ((x % S) + S) % S, wy = ((y % S) + S) % S;
      if (!pts.some(p => Math.abs(p[0] - wx) < 0.01 && Math.abs(p[1] - wy) < 0.01)) pts.push([wx, wy]);
    }
  }
  const wrapped = [];
  for (const [x, y] of pts) for (const dx of [-S, 0, S]) for (const dy of [-S, 0, S]) wrapped.push([x + dx, y + dy]);

  // Threshold tile: a pixel takes ink when coverage exceeds π·d²/P², which is
  // the coverage at which a dot of radius d would reach that pixel.
  const th = new Float32Array(S * S);
  for (let y = 0; y < S; y++) {
    for (let x = 0; x < S; x++) {
      let d2 = Infinity;
      for (const [px, py] of wrapped) {
        const dx = x + 0.5 - px, dy = y + 0.5 - py, q = dx * dx + dy * dy;
        if (q < d2) d2 = q;
      }
      th[y * S + x] = clamp(Math.PI * d2 / (P * P), 0, 1);
    }
  }
  return { S, P, pts, wrapped, th, patterns: new Map() };
}

function screenOf(name) {
  return screens[name] || (screens[name] = buildScreen(name));
}

/** Screen a greyscale coverage canvas into hard dots. Bake-time only. */
function screenCoverage(covCanvas, name) {
  const sc = screenOf(name);
  const w = covCanvas.width, h = covCanvas.height;
  const src = covCanvas.getContext('2d').getImageData(0, 0, w, h);
  const s = src.data;
  for (let y = 0; y < h; y++) {
    const row = (y % sc.S) * sc.S;
    for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4;
      const cover = s[i + 3] / 255;
      s[i + 3] = cover > sc.th[row + (x % sc.S)] ? 255 : 0;
    }
  }
  const out = cv(w, h);
  out.getContext('2d').putImageData(src, 0, 0);
  return out;
}

/* ── paper ────────────────────────────────────────────────────────────────────
   Cloudy mottling rather than fine grain: the reference shows blotches a few
   hundred px across at low contrast. Baked once, never recomputed, because any
   per-frame regeneration flickers.                                           */

let paper = null;

function bakePaper() {
  const c = cv(OUT, OUT), x = c.getContext('2d');
  x.setTransform(K, 0, 0, K, 0, 0);
  x.fillStyle = PAPER; x.fillRect(0, 0, W, W);

  const r = rngFor('paper');

  // Mottling is a warm wash with noisy alpha, not a neutral multiply: greyscale
  // noise multiplied over cream desaturates it and reads as smoke rather than
  // paper. Keep it subtle at full size and only obvious when zoomed.
  for (const [res, maxA] of [[30, 0.10], [72, 0.075], [165, 0.05]]) {
    const n = cv(res, res), nx = n.getContext('2d');
    const img = nx.createImageData(res, res);
    for (let i = 0; i < res * res; i++) {
      img.data[i * 4] = 0xB4; img.data[i * 4 + 1] = 0xA6; img.data[i * 4 + 2] = 0x8C;
      img.data[i * 4 + 3] = Math.pow(r(), 1.8) * 255 * maxA;
    }
    nx.putImageData(img, 0, 0);
    x.save();
    x.imageSmoothingEnabled = true;
    x.imageSmoothingQuality = 'high';
    x.drawImage(n, 0, 0, W, W);
    x.restore();
  }

  x.save();                                  // fibres
  x.strokeStyle = '#8a7f6a';
  for (let i = 0; i < 420; i++) {
    const px = r() * W, py = r() * W, len = 5 + r() * 22, ang = r() * Math.PI;
    x.globalAlpha = 0.008 + r() * 0.016;
    x.lineWidth = 0.5 + r() * 0.7;
    x.beginPath();
    x.moveTo(px, py);
    x.quadraticCurveTo(px + Math.cos(ang) * len * 0.5 + (r() - 0.5) * 5,
                       py + Math.sin(ang) * len * 0.5 + (r() - 0.5) * 5,
                       px + Math.cos(ang) * len, py + Math.sin(ang) * len);
    x.stroke();
  }
  x.restore();

  x.save();                                  // flecks
  for (let i = 0; i < 2200; i++) {
    x.globalAlpha = 0.012 + r() * 0.03;
    x.fillStyle = r() < 0.55 ? '#7d7362' : '#ffffff';
    x.beginPath();
    x.arc(r() * W, r() * W, 0.4 + r() * 1.0, 0, Math.PI * 2);
    x.fill();
  }
  x.restore();
  return c;
}

/* ── scene drawing helpers ────────────────────────────────────────────────────
   Scenes draw coverage in 1080-space and alpha is tone, so 0.4 means a 40%
   dot screen. Shape helpers carry hand wobble; nothing here is a true circle
   or a straight line.                                                        */

function makeWob(rng, harmonics = 3) {
  const h = [];
  for (let i = 0; i < harmonics; i++) h.push([2 + i, rng() * 2 - 1, rng() * Math.PI * 2]);
  return (th) => h.reduce((s, [k, a, p]) => s + a * Math.sin(k * th + p), 0) / harmonics;
}

const tone = (g, a) => { g.globalAlpha = clamp(a, 0, 1); };


/* ── scene registry ───────────────────────────────────────────────────────── */

const SCENES = {};
const scene = (id, def) => { SCENES[id] = Object.assign({ id, live: null }, def); };

const baked = new Map();

/**
 * Bake a scene to one opaque bitmap: every plate screened, tinted, offset and
 * multiplied onto white, ready to multiply over paper.
 *
 * Baked at its display size, never scaled afterwards. Resampling a halftoned
 * bitmap beats the dot grid against the pixel grid and moirés; real print
 * screens at final size too.
 */
function bakeScene(id, size) {
  const key = id + '@' + size;
  if (baked.has(key)) return baked.get(key);
  const sc = SCENES[id];
  const k = size / W;
  const out = cv(size, size), o = out.getContext('2d');
  o.fillStyle = '#fff';
  o.fillRect(0, 0, size, size);

  const cover = cv(size, size), g = cover.getContext('2d');
  for (const ink of sc.inks) {
    const plate = ink;
    g.setTransform(k, 0, 0, k, 0, 0);
    g.clearRect(0, 0, W, W);
    g.globalAlpha = 1;
    g.globalCompositeOperation = 'source-over';
    g.fillStyle = g.strokeStyle = '#000';
    g.lineCap = 'round';
    g.lineJoin = 'round';
    g.save();
    sc.plates(g, ink, rngFor(id + ':' + ink), rngFor(id + ':shape'));
    g.restore();
    starve(g, rngFor(id + ':' + ink + ':void'));

    const dots = screenCoverage(cover, plate);
    const tin = cv(size, size), tx = tin.getContext('2d');
    tx.drawImage(dots, 0, 0);
    tx.globalCompositeOperation = 'source-in';
    tx.fillStyle = INK[plate];
    tx.fillRect(0, 0, size, size);

    const [rx, ry] = REG[plate];
    o.save();
    o.globalCompositeOperation = 'multiply';
    o.drawImage(tin, rx, ry);
    o.restore();
  }
  baked.set(key, out);
  return out;
}

/** Ink starvation: evenly filled solids read as laser print, so drop flecks. */
function starve(g, rng) {
  g.save();
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalCompositeOperation = 'destination-out';
  const w = g.canvas.width, n = Math.round(w * 1.1);
  for (let i = 0; i < n; i++) {
    g.globalAlpha = 0.2 + rng() * 0.55;
    g.beginPath();
    g.arc(rng() * w, rng() * w, (0.5 + rng() * 2.0) * K, 0, Math.PI * 2);
    g.fill();
  }
  g.restore();
}

/* ── craft kit ────────────────────────────────────────────────────────────────
   Drawing vocabulary for scene plates. Copy this whole block into a new film,
   between starve() and the scenes.

   Shapes are Path2D values rather than marks on the context, so one shape can
   be filled on one plate, knocked out of another and hatched on a third. That
   is what plate discipline needs, and it removes the usual trap of rebuilding
   a shape per ink and having the knockout miss.

   Everything draws coverage in 1080-space: fill style is already '#000' and
   globalAlpha is tone, so 0.4 means a 40% dot screen.                        */

const TAU = Math.PI * 2;

/* — shape builders ——————————————————————————————————————————————— */

/** Catmull-Rom through pts, as a dense polyline. */
function curve(pts, closed, per) {
  per = per || 12;
  const n = pts.length, out = [];
  const at = (i) => pts[closed ? (i + n * 2) % n : clamp(i, 0, n - 1)];
  const last = closed ? n : n - 1;
  for (let i = 0; i < last; i++) {
    const p0 = at(i - 1), p1 = at(i), p2 = at(i + 1), p3 = at(i + 2);
    for (let k = 0; k < per; k++) {
      const u = k / per, u2 = u * u, u3 = u2 * u;
      out.push([
        0.5 * (2 * p1[0] + (p2[0] - p0[0]) * u + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * u2
               + (3 * p1[0] - p0[0] - 3 * p2[0] + p3[0]) * u3),
        0.5 * (2 * p1[1] + (p2[1] - p0[1]) * u + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * u2
               + (3 * p1[1] - p0[1] - 3 * p2[1] + p3[1]) * u3),
      ]);
    }
  }
  if (!closed) out.push(pts[n - 1].slice());
  return out;
}

/** Points around an ellipse, for feeding cut(). */
function ringPts(x, y, rx, ry, n, rot) {
  const out = [], c = Math.cos(rot || 0), s = Math.sin(rot || 0);
  for (let i = 0; i < n; i++) {
    const th = i / n * TAU, px = Math.cos(th) * rx, py = Math.sin(th) * ry;
    out.push([x + px * c - py * s, y + px * s + py * c]);
  }
  return out;
}

/**
 * Closed hand-cut contour through control points: the silhouette builder.
 * A shape made of arcs and ellipses reads as clip art however good the screen
 * is, because every edge has the same machine curvature.
 *   o.amp   edge waver in px — 2 is a drawn line, 8 is torn stock
 *   o.tear  0..1 chance per sample of a deeper bite inward
 */
function cut(pts, rng, o) {
  o = o || {};
  const amp = o.amp === undefined ? 3 : o.amp, tear = o.tear || 0;
  const c = curve(pts, true, o.per || 10), n = c.length;
  let area = 0;
  for (let i = 0; i < n; i++) {
    const a = c[i], b = c[(i + 1) % n];
    area += a[0] * b[1] - b[0] * a[1];
  }
  const sgn = area > 0 ? 1 : -1;            // keep the normal pointing outward

  /* Displace along the normal, then smooth: an unsmoothed tear lands on one
     sample and reads as damage rather than as a bay in the edge. */
  const w1 = makeWob(rng, 4), w2 = makeWob(rng, 9), d = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const th = i / n * TAU;
    d[i] = (w1(th) + w2(th * 3) * 0.3) * amp;
    if (tear && rng() < tear) d[i] -= amp * (1.4 + rng() * 1.6);
  }
  for (let pass = 0; pass < 2; pass++) {
    const s = Float32Array.from(d);
    for (let i = 0; i < n; i++) d[i] = (s[(i - 1 + n) % n] + s[i] * 2 + s[(i + 1) % n]) * 0.25;
  }

  const p = new Path2D();
  for (let i = 0; i < n; i++) {
    const a = c[(i - 1 + n) % n], b = c[(i + 1) % n];
    let tx = b[0] - a[0], ty = b[1] - a[1];
    const m = Math.hypot(tx, ty) || 1; tx /= m; ty /= m;
    const x = c[i][0] + sgn * ty * d[i], y = c[i][1] - sgn * tx * d[i];
    i ? p.lineTo(x, y) : p.moveTo(x, y);
  }
  p.closePath();
  return p;
}

/**
 * Variable-width ribbon along a path, as a fillable shape. Canvas has no
 * pressure, so a constant lineWidth is the default and it is what makes stems,
 * branches, whiskers and rigging read as wire. wfn(u) returns half-width.
 */
function nib(pts, wfn, o) {
  o = o || {};
  const c = o.raw ? pts : curve(pts, false, o.per || 10);
  const n = c.length, L = [], R = [];
  for (let i = 0; i < n; i++) {
    const a = c[Math.max(0, i - 1)], b = c[Math.min(n - 1, i + 1)];
    let tx = b[0] - a[0], ty = b[1] - a[1];
    const m = Math.hypot(tx, ty) || 1; tx /= m; ty /= m;
    const w = Math.max(0.01, wfn(i / (n - 1)));
    L.push([c[i][0] - ty * w, c[i][1] + tx * w]);
    R.push([c[i][0] + ty * w, c[i][1] - tx * w]);
  }
  const p = new Path2D();
  p.moveTo(L[0][0], L[0][1]);
  for (let i = 1; i < n; i++) p.lineTo(L[i][0], L[i][1]);
  for (let i = n - 1; i >= 0; i--) p.lineTo(R[i][0], R[i][1]);
  p.closePath();
  return p;
}

/** Width profiles for nib(). */
const wTip = (w) => (u) => w * (1 - u * u);                       // full, lifting to a point
const wSwell = (w, at, k) => (u) => w * Math.exp(-Math.pow((u - at) / (k || 0.35), 2));
const wLeaf = (w, skew) => (u) => w * Math.pow(Math.sin(Math.PI * Math.pow(u, skew || 0.55)), 1.15);

/**
 * Calligraphic width from a held nib: widest where the path runs across the
 * nib's axis, thinnest where it runs along it. This is where hand-drawn line
 * weight comes from, and it is what makes a contour read as drawn rather than
 * traced. Pass the same polyline you give nib(), with raw: true.
 */
function wNib(c, w0, ang, floor) {
  const n = c.length, f = floor === undefined ? 0.22 : floor;
  return (u) => {
    const i = clamp(Math.round(u * (n - 1)), 0, n - 1);
    const a = c[Math.max(0, i - 1)], b = c[Math.min(n - 1, i + 1)];
    const th = Math.atan2(b[1] - a[1], b[0] - a[0]);
    return w0 * (f + (1 - f) * Math.abs(Math.sin(th - ang)));
  };
}

/**
 * A horizon band closed to the bottom of the frame: hills, treeline, roofline,
 * wave. Stack several at falling tone and the air between them reads as depth.
 *   o.amp  height of the undulation   o.freq  how many bumps across the frame
 *   o.tilt fraction of W the far end drops   o.teeth adds a jagged octave
 */
function ridgeAt(y, o) {
  const amp = o.amp === undefined ? 60 : o.amp;
  const w = makeWob(o.rng, o.harm || 5), t = o.teeth ? makeWob(o.rng, 7) : null;
  return (u) => y + w(u * (o.freq || 5)) * amp + (o.tilt || 0) * (u - 0.5) * W
                + (t ? t(u * 37) * amp * 0.22 : 0);
}

/**
 * Mountain profile: overlapping triangular peaks with a jagged octave on top,
 * because a skyline built from smooth harmonics always reads as hills however
 * tall it is. Same u -> y contract as ridgeAt, so ridge() takes either.
 */
function peaksAt(y, o) {
  const amp = o.amp === undefined ? 90 : o.amp, n = o.n || 5, ps = [];
  for (let i = 0; i < n; i++) {
    ps.push({ c: (i + 0.5) / n + (o.rng() - 0.5) * 0.7 / n,
              h: amp * (0.4 + o.rng() * 0.6), w: (0.55 + o.rng() * 0.9) / n,
              lean: (o.rng() - 0.5) * 0.7 });
  }
  const jag = makeWob(o.rng, 8);
  return (u) => {
    let top = y;
    for (const p of ps) {
      const d = (u - p.c) / p.w;
      const yy = y - p.h * Math.max(0, 1 - Math.abs(d)) * (1 + p.lean * (d > 0 ? 1 : -1));
      if (yy < top) top = yy;
    }
    return top + jag(u * 26) * amp * 0.06;
  };
}

/** x across the frame -> the u that ridgeAt takes, for planting on a skyline. */
const ridgeU = (x) => (x + 60) / (W + 120);

function ridge(y, o) {
  o = o || {};
  const f = typeof y === 'function' ? y : ridgeAt(y, o);
  const n = o.n || 120, p = new Path2D();
  p.moveTo(-60, W + 60);
  for (let i = 0; i <= n; i++) p.lineTo(-60 + i / n * (W + 120), f(i / n));
  p.lineTo(W + 60, W + 60);
  p.closePath();
  return p;
}

/* — paint operations ————————————————————————————————————————————— */

/** Fill a shape at a tone. */
function print(g, path, a) { tone(g, a === undefined ? 1 : a); g.fill(path); }

/** Knock a shape out of the plate underneath it, at full coverage.
    A knockout drawn at a tone leaves the screen's gaps behind, so the plate
    below shows through the holes — always clear solid. */
function carve(g, path) {
  g.save();
  g.globalAlpha = 1;
  g.globalCompositeOperation = 'destination-out';
  g.fill(path);
  g.restore();
}

/**
 * Print a shape at an exact tone, clearing whatever the plate already holds
 * beneath it. Tones on one plate add where they overlap, so a stack of ridges
 * drawn back to front ends up solid at the bottom of the frame — which looks
 * like a colour band rather than land. Every plane in a depth stack goes
 * through here.
 */
function plane(g, path, a) { carve(g, path); print(g, path, a); }

/** Outline a shape. Line work fades on width and alpha, never on coverage. */
function keyline(g, path, w, a) {
  tone(g, a === undefined ? 1 : a);
  g.lineWidth = w === undefined ? 3 : w;
  g.stroke(path);
}

/**
 * Tone ramp inside a shape — a coverage gradient, which the screen turns into
 * a dot-size ramp. This is the signature riso gesture and neither film uses it.
 * Baked plates only: a live inkPass screens at one flat coverage, so a gradient
 * there prints smooth, which is the thing the brief forbids.
 *   o.stops  [[at, tone], ...]      o.x0,y0,x1,y1  linear
 *   o.x,y,r0,r  radial
 */
function shade(g, path, o) {
  g.save();
  if (path) g.clip(path);
  const grd = o.r !== undefined
    ? g.createRadialGradient(o.x, o.y, o.r0 || 0, o.x, o.y, o.r)
    : g.createLinearGradient(o.x0, o.y0, o.x1, o.y1);
  for (const [at, a] of o.stops) grd.addColorStop(clamp(at, 0, 1), 'rgba(0,0,0,' + clamp(a, 0, 1) + ')');
  if (o.cut) g.globalCompositeOperation = 'destination-out';
  g.globalAlpha = 1;
  g.fillStyle = grd;
  g.fillRect(-W, -W, W * 3, W * 3);
  g.restore();
}

/**
 * Parallel hatching clipped to a shape: tone made of line rather than dot.
 * Next to the screen it reads as engraving, and it is how a mid-value stops
 * being flat without adding another ink.
 *   o.gap px between lines   o.w width   o.ang radians   o.a tone
 *   o.fade(u) 0..1 thins across the run, for a shaded edge
 *   o.cut hatches into the knockout instead, which is dry-brush at gap 3-5
 */
function hatch(g, path, rng, o) {
  o = o || {};
  const gap = o.gap || 10, span = W * 1.6;
  const w = o.w || 2.2, a = o.a === undefined ? 1 : o.a;
  g.save();
  if (path) g.clip(path);
  if (o.cut) g.globalCompositeOperation = 'destination-out';
  g.translate(CX, CY); g.rotate(o.ang === undefined ? -0.5 : o.ang); g.translate(-CX, -CY);
  g.lineCap = 'round';
  const n = Math.ceil(span * 2 / gap);
  for (let i = 0; i < n; i++) {
    const u = i / (n - 1), f = o.fade ? clamp(o.fade(u), 0, 1) : 1;
    if (f <= 0.02) continue;
    g.globalAlpha = a * f;
    g.lineWidth = w * (0.72 + rng() * 0.5) * clamp(f, 0.3, 1);
    const y = CY - span + i * gap + (rng() - 0.5) * gap * 0.3;
    g.beginPath();
    for (let k = 0; k <= 7; k++) {
      const x = CX - span + span * 2 * k / 7, yy = y + (rng() - 0.5) * 2.4;
      k ? g.lineTo(x, yy) : g.moveTo(x, yy);
    }
    g.stroke();
  }
  g.restore();
}

/**
 * Stipple inside a shape — a gradient made of grain instead of dots, for
 * spray, mist, sand, snow, and the bloom where ink feathers at an edge.
 * o.density(x, y) returns 0..1 and is the whole point: without it this is noise.
 */
function spray(g, path, rng, o) {
  o = o || {};
  const n = o.n || 900, r0 = o.r0 || 0.8, r1 = o.r1 || 3.0;
  const b = o.box || [0, 0, W, W], a = o.a === undefined ? 1 : o.a;
  g.save();
  if (o.cut) g.globalCompositeOperation = 'destination-out';
  for (let i = 0; i < n; i++) {
    const x = b[0] + rng() * b[2], y = b[1] + rng() * b[3];
    const d = o.density ? o.density(x, y) : 1;
    const keep = rng() < d, rr = r0 + rng() * (r1 - r0), av = 0.45 + rng() * 0.55;
    if (!keep || (path && !g.isPointInPath(path, x, y))) continue;
    g.globalAlpha = a * av;
    g.beginPath();
    g.arc(x, y, rr, 0, TAU);
    g.fill();
  }
  g.restore();
}

/* There is no model() helper here on purpose. Shading a form by laying a second
   ink across its shade side is the obvious move and it is wrong: study 3 in that
   form printed an orange ball olive-brown. Model with shade(…, {cut: true}) on
   the subject's own plate instead, and spend a second ink only on the smallest
   darkest accent. */

/** Contact shadow. A subject that does not touch its ground reads as a decal. */
function bed(g, x, y, rx, ry, rng, a) {
  const t = a === undefined ? 0.55 : a;
  shade(g, cut(ringPts(x, y, rx, ry, 10), rng, { amp: rx * 0.06 }),
        { x: x, y: y, r0: 0, r: rx, stops: [[0, t], [0.5, t * 0.5], [1, 0]] });
}

/* ── prints ───────────────────────────────────────────────────────────────── */

/**
 * gather — the instant the pipe clears the furnace mouth.
 *
 * The dark is the fire's own ink. Orange over indigo is the darkest overprint
 * this palette reaches (luminance 7, measured in studies/index.html), so one
 * warm plate carries both the heat and the shop's blackness, and the frame
 * never needs a third structural ink to find a value. Both plates run near
 * solid: at 0.6 and 0.8 the same pair prints dusty rose, not black.
 *
 * Forms are modelled by taking ink away toward the light — one ramp per source,
 * and deliberately tight, so the shop keeps a dark to be lit against. Yellow is
 * the earned hue and stays inside the two openings and the spill they throw.
 * The hottest point of each is bare paper, not a paler ink.
 *
 * Plate order is the whole mechanism. Brick courses print after the light ramp,
 * so the lit face keeps them, but before the aperture is carved, so they cannot
 * stripe across the hole. Everything drawn after a knockout survives it, which
 * is why the figure goes down last and the courses go down before the reveal.
 *
 * Detail is banked in one place — the aperture, its reveal and its courses. The
 * shop, the floor and the blower stay flat on purpose: three areas of equal
 * detail would compete and none of them would be the subject.
 */
scene('gather', {
  inks: ['indigo', 'orange', 'yellow'],
  plates(g, ink, rng, sr) {
    const MX = 762, MY = 432;                  // the aperture, high and right
    const GX = 358, GY = 640;                  // the gather, low and left
    const FLOOR = 850;

    /* Shapes more than one plate touches come off sr, before the ink branch.
       sr is re-seeded identically per plate and has to be consumed in the same
       order every time, or a knockout lands somewhere other than the shape it
       was built to clear. */
    const full = new Path2D();
    full.rect(-80, -80, W + 160, W + 160);

    /* The furnace is a built object, not a wall: it stops short of the ceiling
       and stands on a plinth, and those two edges are most of what says the
       frame is a room rather than a field with a light in it. */
    const face = cut([[470, 150], [508, 214], [486, 520], [516, 742], [502, FLOOR + 4],
                      [W + 140, FLOOR + 10], [W + 140, 142]], sr, { amp: 7 });
    const plinth = cut([[430, 828], [W + 140, 840], [W + 140, 930], [442, 918]], sr, { amp: 5 });
    const floor = ridge((u) => FLOOR + Math.sin(u * 4.3 + 1.1) * 9, { n: 60 });

    // A round aperture reads as a hole; the arched one read as a lamp.
    const fire = cut(ringPts(MX, MY, 106, 100, 12), sr, { amp: 6, tear: 0.05 });
    // Molten glass sags: the blob is heavier below its own centre.
    const gather = cut([[GX + 2, GY - 46], [GX + 39, GY - 24], [GX + 46, GY + 16],
                        [GX + 21, GY + 53], [GX - 15, GY + 58], [GX - 42, GY + 27],
                        [GX - 45, GY - 15], [GX - 23, GY - 41]], sr, { amp: 2.6 });

    /* One silhouette assembled from overlapping solids rather than one
       re-entrant contour: curve() fills a notch back in, and at full coverage
       the overlaps are invisible, so the neck and the arms come for free. */
    const pipeLine = curve([[-90, 1052], [120, 916], [250, 786], [GX - 12, GY + 22]], false, 14);
    const mass = new Path2D();
    mass.addPath(cut([[-140, 742], [28, 668], [150, 620], [250, 678], [300, 806],
                      [330, W + 140], [-140, W + 140]], sr, { amp: 5.5 }));
    mass.addPath(cut(ringPts(196, 596, 54, 62, 10, -0.24), sr, { amp: 3 }));
    mass.addPath(nib(curve([[236, 684], [278, 730], [300, 776]], false, 10),
                     wSwell(27, 0.1, 0.9), { raw: true }));
    mass.addPath(nib(curve([[196, 742], [264, 782], [306, 826]], false, 10),
                     wSwell(21, 0.1, 0.95), { raw: true }));
    mass.addPath(nib(pipeLine, (u) => 13.5 - 6.4 * u, { raw: true }));

    if (ink === 'indigo') {
      print(g, full, 0.97);                    // the shop, near solid
      plane(g, face, 1);                       // each plane owns its value
      plane(g, floor, 0.94);
      plane(g, plinth, 1);

      // Light subtracted, one ramp per source, and tight: a wide soft ramp
      // leaves no dark anywhere and the frame stops having an anchor.
      shade(g, null, { cut: true, x: MX, y: MY + 20, r0: 30, r: 372,
                       stops: [[0, 0.74], [0.34, 0.50], [0.70, 0.17], [1, 0]] });
      shade(g, floor, { cut: true, x: MX + 40, y: 1016, r0: 90, r: 720,
                        stops: [[0, 0.46], [0.34, 0.34], [0.78, 0.11], [1, 0]] });
      shade(g, null, { cut: true, x: GX, y: GY, r0: 8, r: 212,
                       stops: [[0, 0.80], [0.36, 0.46], [0.74, 0.14], [1, 0]] });

      // Brick catches the light, so the recessed joint is what stays dark.
      // After the ramp, so the lit face keeps them; before the carve, so they
      // cannot stripe across the opening. Full coverage: a thin stroke faded on
      // coverage comes back from the screen as dashes, not as a lighter line.
      hatch(g, face, rng, { gap: 78, w: 3.6, ang: 0.035, a: 1 });

      // The plinth reads by its own edge taking a little light, not by a carved
      // highlight: a full-coverage carve along it printed as a neon bar.
      shade(g, plinth, { cut: true, x0: 700, y0: 826, x1: 700, y1: 890,
                         stops: [[0, 0.55], [0.4, 0.16], [1, 0]] });

      keyline(g, fire, 21, 1);                 // the reveal, in its own shadow
      carve(g, fire);
      carve(g, gather);

      // Heat above the mouth: the dark thinning upward into nothing. A
      // dissipation is dots, so it is sprayed away rather than hatched away.
      spray(g, null, rng, { cut: true, n: 2600, r0: 1.0, r1: 3.4, a: 0.62,
                            box: [MX - 210, 20, 420, MY - 140],
                            density: (x, y) => Math.pow(clamp((y - 30) / (MY - 200), 0, 1), 1.5)
                                             * clamp(1 - Math.abs(x - MX) / 190, 0, 1) });

      // Weight gathering at the foot of the frame: a deepening is line, and it
      // thickens inward, the opposite direction from the heat above.
      hatch(g, floor, rng, { gap: 10, w: 2.8, ang: 0.14, a: 1,
                             fade: (u) => clamp((u - 0.80) * 5.0, 0, 1) });

      bed(g, 250, FLOOR + 6, 210, 34, rng, 0.8);   // or the blower is a decal
      print(g, mass, 1);                       // nearest, darkest, no interior detail
      // The gather is a point light an arm's length off, so what faces it lifts
      // and what turns away stays solid. A linear rim lit the wrong side of the
      // head, because the axis it runs along is not the direction of the light.
      shade(g, mass, { cut: true, x: GX, y: GY, r0: 30, r: 300,
                       stops: [[0, 0.92], [0.30, 0.52], [0.72, 0.13], [1, 0]] });
    }

    if (ink === 'orange') {
      print(g, full, 0.90);                    // with indigo this is the shop's black
      shade(g, null, { cut: true, x: MX, y: MY + 20, r0: 30, r: 400,
                       stops: [[0, 0.62], [0.34, 0.44], [0.72, 0.16], [1, 0]] });
      shade(g, floor, { cut: true, x: MX + 40, y: 1016, r0: 90, r: 760,
                        stops: [[0, 0.40], [0.34, 0.30], [0.80, 0.10], [1, 0]] });
      shade(g, null, { cut: true, x: GX, y: GY, r0: 8, r: 232,
                       stops: [[0, 0.70], [0.36, 0.42], [0.76, 0.13], [1, 0]] });

      // The same rising column the indigo plate opened, taking colour as it goes.
      spray(g, null, rng, { n: 2200, r0: 0.9, r1: 3.0, a: 0.5,
                            box: [MX - 200, 40, 400, MY - 160],
                            density: (x, y) => Math.pow(clamp((y - 50) / (MY - 220), 0, 1), 1.7)
                                             * clamp(1 - Math.abs(x - MX) / 175, 0, 1) });

      plane(g, fire, 1);
      plane(g, gather, 1);
      shade(g, fire, { cut: true, x: MX + 4, y: MY + 26, r0: 0, r: 96,
                       stops: [[0, 1], [0.52, 0.56], [1, 0]] });
      shade(g, gather, { cut: true, x: GX - 9, y: GY - 10, r0: 0, r: 40,
                         stops: [[0, 1], [0.52, 0.56], [1, 0]] });

      bed(g, 250, FLOOR + 6, 210, 34, rng, 0.8);
      print(g, mass, 1);
      shade(g, mass, { cut: true, x: GX, y: GY, r0: 30, r: 300,
                       stops: [[0, 0.92], [0.30, 0.52], [0.72, 0.13], [1, 0]] });
    }

    if (ink === 'yellow') {
      /* Spill lands on ground both dark plates have already opened. Yellow on
         an unopened dark prints olive; yellow on opened paper prints as light. */
      shade(g, null, { x: MX, y: MY + 20, r0: 40, r: 250, stops: [[0, 0.52], [0.44, 0.22], [1, 0]] });
      shade(g, null, { x: GX, y: GY, r0: 16, r: 150, stops: [[0, 0.60], [0.42, 0.24], [1, 0]] });
      carve(g, mass);                          // no light prints across the silhouette

      plane(g, fire, 1);
      plane(g, gather, 1);
      // The hottest point of a light is bare paper, not a paler ink.
      shade(g, fire, { cut: true, x: MX + 4, y: MY + 26, r0: 0, r: 114,
                       stops: [[0, 1], [0.46, 0.70], [1, 0]] });
      shade(g, gather, { cut: true, x: GX - 9, y: GY - 10, r0: 0, r: 48,
                         stops: [[0, 1], [0.50, 0.64], [1, 0]] });
    }
  },
});

/**
 * A lattice suspension tower, face-on, as one fillable path.
 *
 * Steel is machine-made, so the members keep a constant width — the hand is in
 * the endpoint jitter and in what the screen does to a 3 px bar, not in a taper
 * that real angle iron does not have. Everything is proportional to h, so the
 * same builder draws the tower at 790 px and at 104 px without a second set of
 * numbers, which is what lets the four towers in one frame be the same tower.
 *
 * Geometry is a standard suspension design: battered legs to a waist, a
 * parallel mast above it, three cross-arms getting shorter as they rise, and an
 * earth peak. Panel count falls with height so the bracing holds roughly 45°
 * all the way up, which is what makes a lattice read as structure and not as a
 * grid drawn on a triangle.
 */
function towerPath(x, base, h, rng, detail) {
  const B = h * 0.170, b = h * 0.050;        // half-width at footing and waist
  const waist = base - h * 0.56, top = base - h;
  const wLeg = Math.max(1.1, h * 0.0082), wBr = Math.max(0.7, h * 0.0044);
  const j = () => (rng() - 0.5) * h * 0.005;

  const p = new Path2D();
  const bar = (x1, y1, x2, y2, w) => p.addPath(
    nib([[x1 + j(), y1 + j()], [x2 + j(), y2 + j()]], () => w * (0.85 + rng() * 0.3), { raw: true }));
  const halfAt = (y) => y >= waist ? lerp(b, B, (y - waist) / (base - waist)) : b;

  const ys = [];
  for (let i = 0; i <= 7; i++) ys.push(lerp(base, waist, Math.pow(i / 7, 0.88)));
  for (let i = 1; i <= 4; i++) ys.push(lerp(waist, top, i / 4));

  for (let i = 0; i < ys.length - 1; i++) {
    const y0 = ys[i], y1 = ys[i + 1], h0 = halfAt(y0), h1 = halfAt(y1);
    bar(x - h0, y0, x - h1, y1, wLeg);        // legs
    bar(x + h0, y0, x + h1, y1, wLeg);
    bar(x - h1, y1, x + h1, y1, wBr * 1.3);   // strut closing the panel
    bar(x - h0, y0, x + h1, y1, wBr);         // X bracing
    bar(x + h0, y0, x - h1, y1, wBr);
  }

  // Cross-arms, longest at the bottom, each braced back up to the mast.
  const arms = [];
  for (const [fy, fl] of [[0.38, 0.235], [0.24, 0.200], [0.10, 0.160]]) {
    const y = top + h * fy, L = h * fl, up = y - h * 0.062;
    arms.push([y, L]);
    for (const s of [-1, 1]) {
      bar(x + s * b, y, x + s * L, y, wBr * 1.25);
      bar(x + s * L, y, x + s * b * 0.9, up, wBr);
      bar(x + s * L * 0.55, y, x + s * b * 0.95, up, wBr * 0.85);
      bar(x + s * b, up, x + s * L * 0.55, y, wBr * 0.8);
    }
    bar(x - b, up, x + b, up, wBr);
  }
  const peak = top - h * 0.055;
  bar(x - b, top, x, peak, wBr * 1.2);
  bar(x + b, top, x, peak, wBr * 1.2);

  /* Insulator strings only on the tower close enough to have them: a chain of
     discs at 100 px reads as detail, at 12 px it reads as a smudge that costs
     the arm its silhouette. */
  if (detail) {
    for (const [y, L] of arms) {
      for (const s of [-1, 1]) {
        const ax = x + s * L * 0.94;
        bar(ax, y, ax, y + h * 0.020, wBr);
        for (let d = 0; d < 11; d++) {
          const dy = y + h * 0.020 + d * h * 0.0062;
          p.addPath(nib([[ax - h * 0.0075, dy], [ax + h * 0.0075, dy]],
                        () => h * 0.0024, { raw: true }));
        }
      }
    }
  }
  return { path: p, arms, peak, b };
}

/** Where a conductor hangs: the arm tip, dropped by its insulator string. */
function hangPoints(t, h) {
  const out = [];
  for (const [y, L] of t.arms) for (const s of [-1, 1]) out.push([y + h * 0.09, s * L * 0.94]);
  return out;
}

/** A span of conductor between two points, sagging under its own weight. */
const spanAt = (a, c, sag, u) =>
  [lerp(a[0], c[0], u), lerp(a[1], c[1], u) + sag * 4 * u * (1 - u)];

function span(a, c, sag, w) {
  const pts = [];
  for (let i = 0; i <= 34; i++) pts.push(spanAt(a, c, sag, i / 34));
  return nib(pts, () => w, { raw: true });
}

/**
 * lines — wind slack in the conductors, four towers into falling snow.
 *
 * The print is the decay rule from docs/drawing.md drawn literally: one
 * event at four distances, the nearest at full coverage and the furthest nearly
 * paper. Only the near tower keeps a second plate, so the recession is depth
 * rather than a fade — the far towers lose their dark before their coverage.
 *
 * Low mass on purpose, and the opposite of `gather`: open sky, snow at nearly
 * bare stock, and the frame's whole value spent on one structure. Snow is a
 * knockout, not a white ink, so every flake is the paper itself. Each tower
 * goes down with plane(), which both fixes its value and clears what stands
 * behind it, so the fence passes behind the legs instead of adding tone to them.
 *
 * The aviation lamp is the one earned hue in the frame, and the only warm mark
 * in it, which is what lets 11 px of orange hold against a 790 px tower.
 */
scene('lines', {
  inks: ['blue', 'indigo', 'orange'],
  plates(g, ink, rng, sr) {
    const HZ = 782;                            // horizon
    const LAMP = [330, 55];

    /* Shapes more than one plate touches come off sr, before the ink branch.
       sr is re-seeded identically per plate and has to be consumed in the same
       order every time, or a knockout lands somewhere other than the shape it
       was built to clear. */
    const snow = ridge((u) => HZ + Math.sin(u * 3.1 + 0.6) * 7 + Math.sin(u * 9.4) * 3, { n: 90 });

    // Near to far. Coverage falls, and only the nearest keeps a second plate.
    const SPEC = [
      { x: 330, base: 905, h: 790, cov: 1.00, detail: true },
      { x: 742, base: 836, h: 296, cov: 0.52, detail: false },
      { x: 898, base: 806, h: 168, cov: 0.28, detail: false },
      { x: 986, base: 792, h: 104, cov: 0.15, detail: false },
    ];
    const towers = SPEC.map(s => Object.assign({}, s, towerPath(s.x, s.base, s.h, sr, s.detail)));

    // Conductors: off the left edge, then tower to tower, sagging less as the
    // spans foreshorten. Three levels a side, hung below each arm.
    const wires = [];
    for (let i = 0; i < towers.length; i++) {
      const t = towers[i], hp = hangPoints(t, t.h);
      for (let k = 0; k < hp.length; k++) {
        const a = [t.x + hp[k][1], hp[k][0]];
        if (i === 0) {
          const off = [-140, a[1] - 46], sag = t.h * 0.105;
          wires.push({ p: span(off, a, sag, 2.6), cov: t.cov, k, a: off, c: a, sag });
        }
        const n = towers[i + 1];
        if (!n) continue;
        const nhp = hangPoints(n, n.h)[k];
        if (!nhp) continue;
        const c = [n.x + nhp[1], nhp[0]], sag = Math.min(t.h, n.h) * 0.105;
        wires.push({ p: span(a, c, sag, lerp(2.6, 0.9, i / 2)),
                     cov: lerp(t.cov, n.cov, 0.55), k, a, c, sag });
      }
    }

    /* A fence going away across the field. It is the only thing in frame whose
       real size a viewer already knows, so it is what gives the tower its
       height — and it runs behind the legs, which is what makes the snow a
       field with depth rather than a flat band. */
    const posts = [], fence = [];
    for (let i = 0; i <= 13; i++) {
      const u = i / 13;
      const px = lerp(28, 700, Math.pow(u, 0.80));
      const py = lerp(1030, HZ + 12, Math.pow(u, 0.92));
      const ph = lerp(96, 9, Math.pow(u, 0.78));
      const cov = lerp(0.95, 0.14, Math.pow(u, 0.85));
      posts.push({ p: nib([[px + (sr() - 0.5) * 5, py], [px + (sr() - 0.5) * 5, py - ph]],
                          () => lerp(6.0, 0.8, u), { raw: true }), x: px, y: py, h: ph, cov });
      if (i) {
        const q = posts[i - 1];
        for (const f of [0.34, 0.72]) {         // two strands, each with its own sag
          fence.push({ p: span([q.x, q.y - q.h * f], [px, py - ph * f], q.h * 0.10,
                               lerp(2.4, 0.5, u)), cov: cov * 0.85 });
        }
      }
    }

    /* Grass the snow has not buried, in the nearest strip only. Fine marks at
       the bottom edge are what stop bare stock reading as unprinted paper. */
    const tufts = [];
    for (let i = 0; i < 26; i++) {
      const tx = sr() * (W + 120) - 60, ty = 930 + sr() * 170;
      if (tx > 150 && tx < 520 && ty < 960) continue;   // clear of the near footings
      const n = 3 + Math.floor(sr() * 4), s = 16 + sr() * 30;
      const t = new Path2D();
      for (let k = 0; k < n; k++) {
        const lean = (sr() - 0.5) * 1.5, len = s * (0.55 + sr() * 0.65);
        t.addPath(nib(curve([[tx, ty], [tx + lean * len * 0.35, ty - len * 0.6],
                             [tx + lean * len, ty - len]], false, 7),
                      wTip(2.2 + sr() * 1.1), { raw: true }));
      }
      tufts.push(t);
    }

    /* Five birds on one span, decaying away from the viewer. Repeats of a
       single event are the one case the composition craft allows a row of the same
       thing, and only if they decay: equal repeats read as five subjects. */
    const perch = wires.filter(w => w.k === 5)[1] || wires[0];
    const birds = [];
    for (let i = 0; i < 4; i++) {
      // Spacing has to clear a bird's own width or the row prints as one mass,
      // and the jitter is there because an even row reads as beads on a string.
      const u = 0.20 + i * 0.147 + (sr() - 0.5) * 0.03;
      const [bx, by] = spanAt(perch.a, perch.c, perch.sag, u);
      const s = 32 - i * 3.1, ty = by - s * 0.46;
      /* Assembled from overlapping solids, not one cut() contour. At 30 px a
         contour's head notch is averaged away by the Catmull-Rom and the edge
         wobble both, and what comes back is a dart; a head that is its own
         circle survives, and the head is most of what says bird. */
      const b = cut(ringPts(bx, ty, s * 0.76, s * 0.45, 10, -0.16), sr, { amp: s * 0.05 });
      b.addPath(cut(ringPts(bx - s * 0.74, ty - s * 0.42, s * 0.31, s * 0.30, 8), sr,
                    { amp: s * 0.045 }));                                      // head
      b.addPath(nib(curve([[bx + s * 0.48, ty + s * 0.02], [bx + s * 0.92, ty + s * 0.20],
                           [bx + s * 1.30, ty + s * 0.40]], false, 8),
                    (u) => s * (0.21 - u * 0.15), { raw: true }));             // tail
      for (const lx of [-0.16, 0.18]) {
        b.addPath(nib([[bx + s * lx, ty + s * 0.30], [bx + s * lx * 0.6, by + 1]],
                      () => s * 0.055, { raw: true }));                        // legs
      }
      birds.push(b);
    }

    if (ink === 'blue') {
      // Cold sky, deepest overhead, opening out to haze at the horizon.
      shade(g, null, { x0: 0, y0: -30, x1: 0, y1: HZ,
                       stops: [[0, 0.30], [0.55, 0.15], [1, 0.035]] });
      // Snow takes the sky back as it recedes; underfoot it is bare stock.
      plane(g, snow, 0.001);
      shade(g, snow, { x0: 0, y0: HZ - 14, x1: 0, y1: W + 40,
                       stops: [[0, 0.20], [0.14, 0.15], [0.45, 0.06], [1, 0.010]] });

      /* Falling snow is the paper, not a white ink: flakes are punched out of
         the air rather than laid over it, and they thin toward the horizon
         because there is less air between it and the viewer. */
      spray(g, null, rng, { cut: true, n: 5200, r0: 1.1, r1: 3.6, a: 1,
                            box: [-40, -40, W + 80, W + 80],
                            density: (x, y) => 0.22 + 0.5 * clamp((y + 120) / W, 0, 1) });

      // Only the near tower takes a second plate. That is the whole recession:
      // the far ones lose their dark before they lose their coverage.
      for (const w of wires) if (w.cov > 0.9) print(g, w.p, 0.78);
      for (const b of birds) plane(g, b, 0.8);
      plane(g, towers[0].path, 0.86);
    }

    if (ink === 'indigo') {
      // Haze under the far towers, so their feet sink into the horizon rather
      // than standing on it. Drawn before them: they print over it.
      shade(g, null, { x0: 0, y0: HZ - 130, x1: 0, y1: HZ + 26,
                       stops: [[0, 0], [0.7, 0.05], [1, 0.11]] });

      for (const t of tufts) print(g, t, 0.82);
      for (const f of fence) print(g, f.p, f.cov * 0.8);
      for (const p of posts) {
        bed(g, p.x, p.y + 2, p.h * 0.30, p.h * 0.065, rng, p.cov * 0.55);
        plane(g, p.p, p.cov);
      }

      // Far to near, each plane clearing what stands behind it.
      for (let i = towers.length - 1; i >= 1; i--) plane(g, towers[i].path, towers[i].cov);
      for (const w of wires) plane(g, w.p, w.cov * 0.92);
      for (const b of birds) plane(g, b, b === birds[0] ? 1 : 0.92);

      // The near tower's four footings, or 790 px of steel rests on nothing.
      const B0 = towers[0].h * 0.170;
      for (const s of [-1, 1]) bed(g, towers[0].x + s * B0, 908, 74, 15, rng, 0.75);
      plane(g, towers[0].path, towers[0].cov);

      // Weight at the very foot of the frame: a deepening is line, thickening
      // inward, and it is the only place in this print that carries any.
      hatch(g, snow, rng, { gap: 11, w: 2.4, ang: 0.06, a: 1,
                            fade: (u) => clamp((u - 0.88) * 7.0, 0, 1) });

      carve(g, cut(ringPts(LAMP[0], LAMP[1], 21, 21, 9), sr, { amp: 2 }));
    }

    if (ink === 'orange') {
      // One earned hue, 11 px of it. The knockout under it on the indigo plate
      // is what keeps it from printing brown over the steel.
      const halo = cut(ringPts(LAMP[0], LAMP[1], 19, 19, 9), sr, { amp: 2 });
      shade(g, halo, { x: LAMP[0], y: LAMP[1], r0: 0, r: 19,
                       stops: [[0, 0.85], [0.45, 0.3], [1, 0]] });
      print(g, cut(ringPts(LAMP[0], LAMP[1], 5.5, 5.5, 8), sr, { amp: 0.8 }), 1);
    }
  },
});

/* ── sheet ────────────────────────────────────────────────────────────────── */

const PRINTS = [
  ['gather', 'the instant the pipe clears the mouth — the dark is the fire it came from'],
  ['lines', 'wind slack in the conductors — one event at four distances'],
];

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
canvas.width = canvas.height = OUT;
canvas.style.width = canvas.style.height = CSS + 'px';

const capName = document.getElementById('cap-name');
const capNote = document.getElementById('cap-note');

function render(t) {
  const i = clamp(Math.floor(t + 1e-6), 0, PRINTS.length - 1);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(paper, 0, 0);
  ctx.globalCompositeOperation = 'multiply';
  ctx.drawImage(bakeScene(PRINTS[i][0], OUT), 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  capName.textContent = i + '  ' + PRINTS[i][0];
  capNote.textContent = PRINTS[i][1];
}

let at = 0;
addEventListener('keydown', (e) => {
  if (e.code === 'ArrowRight') render(at = clamp(at + 1, 0, PRINTS.length - 1));
  if (e.code === 'ArrowLeft') render(at = clamp(at - 1, 0, PRINTS.length - 1));
});

paper = bakePaper();
for (const name of Object.keys(INK)) screenOf(name);

window.__riso = { duration: PRINTS.length, ready: false, seek: render };

(async function boot() {
  const el = document.getElementById('load');
  for (let i = 0; i < PRINTS.length; i++) {
    el.textContent = 'baking plates… ' + (i + 1) + '/' + PRINTS.length;
    await new Promise(r => setTimeout(r, 0));
    bakeScene(PRINTS[i][0], OUT);
  }
  el.remove();
  render(at = Number(new URLSearchParams(location.search).get('t')) || 0);
  window.__riso.ready = true;
})();
</script>
</html>
