/* ── sprites for the living aerial ─────────────────────────────────────── */
/* A cumulus as a sprite: paper-white body, its shade, a faint painted-around sky rim.
   Stages share one seed, so the cloud grows rather than changes; two boils per stage. */
function cloudSprite(key, w, h, variant = 0, sh = .85, rimOn = true) {
  const pad = 30, PWc = Math.ceil(w * 1.35 + pad * 2), PHc = Math.ceil(h * 1.25 + pad * 2 + 30), base = PHc - pad - 20;
  const c = { key, base, mass: cumulusM(PWc / 2, base, w, h, key), lost: Math.max(8, h * .3), sh, bump: 1 };
  const K = buildCloud(c, PWc, PHc); if (!K) return null;
  const P = plate(PWc, PHc);
  paintCloud(P, Object.assign({}, K, { c: Object.assign({}, c, { key: key + 'v' + variant }) }));
  const alpha = new Float32Array(PWc * PHc), sil = new Float32Array(PWc * PHc);
  for (let y = 0; y < K.bb.h; y++) for (let x = 0; x < K.bb.w; x++) { const gi = (K.bb.y0 + y) * PWc + K.bb.x0 + x; sil[gi] = K.rv[y * K.bb.w + x]; }
  const halo = blur(sil, PWc, PHc, 3, 1), img = P.ctx.getImageData(0, 0, PWc, PHc), d = img.data;
  for (let i = 0; i < alpha.length; i++) {
    const s = sil[i], rim = rimOn ? Math.max(0, halo[i] - s) * 1.6 * (1 - smooth(base - h * .45, base, Math.floor(i / PWc))) : 0;
    if (s < .98 && rim > s * .5) { const j = i * 4, u = clamp(rim) * .9; d[j] = lerp(d[j], 98, u); d[j + 1] = lerp(d[j + 1], 150, u); d[j + 2] = lerp(d[j + 2], 190, u); }
    alpha[i] = Math.max(s, clamp(rim) * .32);
  }
  P.ctx.putImageData(img, 0, 0);
  return { cv: spriteOf(P, alpha), w: PWc, h: PHc, ax: PWc / 2, ay: base };
}
function growingCloud(key, w, h, stages = 5, rimOn = true) {
  const S = [];
  for (let s = 0; s < stages; s++) { const g = (s + 1) / stages, v = []; for (let b = 0; b < 2; b++) v.push(cloudSprite(key, w * (.45 + .55 * g), h * g, b, .85, rimOn)); S.push(v); }

}
/* Draw a growing cloud: growth 0..1 picks and cross-fades stages; the boil alternates on twos. */
function drawGrowing(ctx, c, S, x, y, g, d, alpha = 1) {
  if (g <= 0) return;
  g = clamp(g);
  const n = S.length, i = Math.min(n - 1, Math.floor(g * n)), stageG = (i + 1) / n, spr = S[i][d % 2];

/* Flow streaks: short dry-brush marks and lifted lights that ride the ribbon. */
function streakSprites(n, key) {

/* ══ 6 · FLYING — the forest aerial alive; the flying river ══════════════ */
SHOT.flying = (() => {

  // the drop: up from the canopy into the river, two hops (each a small shower and a rise), on west
  const H1 = [1935, 700], H2 = [1455, 690];
  const PATH = () => [[SH.flying.start, 2150, 1210], [CUES.join, 2080, 592], [CUES.hop1, 1968, 603],
    [CUES.hop1 + .35, 1948, 648], [CUES.hop1 + .6, H1[0], H1[1]], [CUES.hop1 + .95, 1870, 650], [CUES.hop1 + 1.3, 1800, 610],

    [SH.flying.end, 900, 634, { m: 1 }]];

/* ══ 7 · ANDES — the wall turns the flow south ══════════════════════════
   Closer to the range. The low-level flow arrives from the east (right), piles against the
   slopes (clouds build: orographic lift) and turns south (left), running along the range. */
SHOT.andes = (() => {
  const PW = 3500, PH = 1300, HRZ = 800, S = {};
  // the ribbon's centreline: in from the right, against the wall, then south along the foothills
  const RIB = curve([[3700, 610], [3300, 640], [2950, 668], [2700, 690], [2450, 704], [2050, 712], [1500, 716], [900, 720], [300, 722], [-200, 724]], false, 18);

    const P = S.P = plate(PW, PH), full = fullBB(P);

    // raymarched column by column (near to far), then painted as washes from the fields it yields
    const TFL = 4200, TCX = PW / 2, CAMH = .5, rn = gnoise('terr'), rn2 = gnoise('terr2');

      let s2 = 0, a = 1, fq = 1 / 7, w = 1;
      for (let o = 0; o < oct; o++) { let v = 1 - Math.abs(rn(X * fq + o * 13.1, Z * fq - o * 7.7)); v *= v; s2 += v * a * w; w = clamp(v * 1.7); a *= .5; fq *= 2.1; }
      return s2;
    };
    const H = (X, Z) => {                                  // km. range crest ~ Z = 58 km, foothills ~ 36 km
      const env = smooth(44, 54, Z) * (1 - smooth(78, 95, Z)) * (.8 + .2 * rn2(X / 60, 3)), foot = smooth(24, 32, Z) * (1 - smooth(50, 58, Z));
      return .2 + foot * 1.0 * ridgedH(X * 1.3, Z * 1.3, 3) + env * 5.2 * ridgedH(X * .7, Z * .7, 3) * (.85 + .3 * rn2(X / 25, 8));
    };
    const TW = PW, TH = PH, alt = new Float32Array(TW * TH).fill(-1), shade = new Float32Array(TW * TH), dist = new Float32Array(TW * TH), slopeA = new Float32Array(TW * TH);
    const SUN = (() => { const v = [.45, .75, .5]; const l = Math.hypot(...v); return v.map(q => q / l); })();
    for (let xs = 0; xs < TW; xs++) {
      let yMin = TH;
      for (let Z = 1.5; Z < 150; Z += Math.max(.015, Z * .004)) {
        const X = (xs - TCX) * Z / TFL, h = H(X, Z), ys = Math.floor(HRZ - TFL * (h - CAMH) / Z);
        if (ys < yMin) {
          const e = Math.max(.02, Z * .001), hx = (H(X + e, Z) - H(X - e, Z)) / (2 * e), hz = (H(X, Z + e) - H(X, Z - e)) / (2 * e);
