/* SNOWMAN — a 70-second linocut film.
   Every winter a boy builds a snowman in front of his house in the hills. Every
   winter he is a little bigger and the snowman a little smaller. In 2025 there
   is no snow at all, and he builds his daughter one out of the freezer's frost.

   The look is a two-block linocut: black and red printed on cream paper. Each
   plate is an alpha mask where 'ink' adds and 'cut' removes, as a carver leaves
