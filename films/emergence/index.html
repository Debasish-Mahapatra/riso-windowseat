<header><b>EMERGENCE</b><span>MANY SMALL THINGS LEARNING TO LISTEN · 28 SECONDS</span></header>
<div id="stage"><canvas id="c" aria-label="Emergence, a procedural animated film"></canvas><div id="load">warming the plates…</div></div>
<div id="ui"><div id="scrub" role="slider" tabindex="0" aria-label="Film position" aria-valuemin="0" aria-valuemax="28"><div id="play-head"></div></div><div id="bar"><button id="btn-play">play</button><button id="btn-replay">replay</button><span id="t">0.00 / 28.00</span><span style="flex:1"></span><button id="btn-audio">sound: off</button><button id="btn-rec">record</button></div><div id="score-row"><label for="score-choice">score</label><select id="score-choice"><option value="warm">A · Gravity</option><option value="pulse">B · Orbit</option></select></div></div>
<footer>A QUESTION, AND WHAT LISTENED</footer>
<script>
'use strict';

const CSS  = 720;            // styled size
const W    = 1080;           // backing store; halftone pitch is defined here
const DUR  = 28.0;
const BEAT = 0.5;            // 120 BPM

const PAPER = '#F2EDE3';
const INK = {
  blue:   '#0078BF',
  pink:   '#FF48B0',
  yellow: '#FFE800',
  green:  '#00A95C',
  orange: '#FF6C2F',
  violet: '#765BA7',
  indigo: '#2E3192',
};

/* Screen angles as rational tangents (b/a). A rotated dot grid only repeats
   seamlessly on a rational tangent, so these are the real angles rather than
   the nominal 15/45/75 — any other value leaves a visible seam where the
   pattern tile wraps. A non-reduced pair (3/3, 2/0) keeps the angle but
   tiles a 3x3 or 2x1 supercell: the dot centres then fall at different
   sub-pixel phases, so a coverage ramp gets many more threshold levels. The
   reduced 1/1 tile held two dots in 49 pixels and banded a slow ramp into
   three plateaus. */
const SCREEN = {
  blue:   { a: 4, b: 1 },   // 14.0°
  pink:   { a: 1, b: 4 },   // 76.0°
  yellow: { a: 2, b: 0 },   //  0.0°
  green:  { a: 3, b: 3 },   // 45.0°
  orange: { a: 2, b: 1 },   // 26.6°
  violet: { a: 1, b: 2 },   // 63.4°
  indigo: { a: 3, b: 3 },   // 45.0°
};
const PITCH = 4.6;           // device px between dot centres

/* Registration: each plate misses by a fixed amount, in device px. */
const REG = {
  blue:   [ 1.5, -1.0], pink:   [-2.5,  2.0], yellow: [ 2.0,  1.5],
  green:  [-1.5, -1.5], orange: [ 1.0,  2.0], violet: [-2.0, -1.0],
  indigo: [ 0.0,  0.0],
};

/* Alternate colourways for the reprise and recollection: a swap remaps which
   physical plate a logical ink prints on, so a scene replays in different inks
   without being redrawn. */
const SWAPS = {
  dusk:  { blue: 'violet', violet: 'indigo', indigo: 'indigo', orange: 'yellow',
           yellow: 'orange', green: 'blue', pink: 'violet' },
  ember: { blue: 'violet', violet: 'blue', indigo: 'indigo', orange: 'blue',
           yellow: 'yellow', green: 'orange', pink: 'orange' },
};

const DOT_R = W * 0.011;     // 2.2% of frame width, diameter
const CX = W / 2, CY = W / 2;
const CORNER = Math.hypot(CX, CY);

/* ── deterministic randomness ─────────────────────────────────────────────── */

function mulberry32(a) {
  return function () {
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hash(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
const rngFor = (key) => mulberry32(hash(key));

/** Smooth periodic wobble in θ, so a ring closes on itself without a seam. */
function wobbler(key, harmonics = 3) {
  const r = rngFor(key), h = [];
  for (let i = 0; i < harmonics; i++) h.push([2 + i, r() * 2 - 1, r() * Math.PI * 2]);
  return (th) => h.reduce((s, [k, amp, ph]) => s + amp * Math.sin(k * th + ph), 0) / harmonics;
}

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, u) => a + (b - a) * u;
const easeOutCubic = (u) => 1 - Math.pow(1 - u, 3);
const easeInOutCubic = (u) => u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
const easeOutBack = (u, s = 1.70158) => 1 + (s + 1) * Math.pow(u - 1, 3) + s * Math.pow(u - 1, 2);
const easeInQuad = (u) => u * u;

function cv(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}

/* ── halftone screens ─────────────────────────────────────────────────────────
   For screen angle tanθ = b/a the dot lattice is generated by the orthogonal
   vectors P/√(a²+b²)·(a,b) and P/√(a²+b²)·(−b,a). That lattice contains
   (P√(a²+b²), 0), so a square tile of side S = P√(a²+b²) repeats seamlessly and
   holds exactly a²+b² dots.

   Screens are anchored to canvas space, never to the object being drawn. A
   screen that rides along with its subject makes the texture crawl, which is
   the single most recognisable way this look goes wrong.                     */

const screens = {};

function buildScreen(name) {
  const { a, b } = SCREEN[name];
  const n = a * a + b * b;
  const S = Math.max(2, Math.round(PITCH * Math.sqrt(n)));
  const P = S / Math.sqrt(n);              // effective pitch after rounding
  const u = P / Math.sqrt(n);
  const v1 = [u * a, u * b], v2 = [-u * b, u * a];

  // Lattice points reduced into the tile, plus wrapped neighbours so dots that
  // straddle an edge are drawn on both sides.
  const pts = [];
  for (let m = -n; m <= n; m++) {
    for (let k = -n; k <= n; k++) {
      const x = m * v1[0] + k * v2[0], y = m * v1[1] + k * v2[1];
      const wx = ((x % S) + S) % S, wy = ((y % S) + S) % S;
      if (!pts.some(p => Math.abs(p[0] - wx) < 0.01 && Math.abs(p[1] - wy) < 0.01)) pts.push([wx, wy]);
    }
  }
  const wrapped = [];
  for (const [x, y] of pts) for (const dx of [-S, 0, S]) for (const dy of [-S, 0, S]) wrapped.push([x + dx, y + dy]);

  // Threshold tile: a pixel takes ink when coverage exceeds π·d²/P², which is
  // the coverage at which a dot of radius d would reach that pixel.
  const th = new Float32Array(S * S);
  for (let y = 0; y < S; y++) {
    for (let x = 0; x < S; x++) {
      let d2 = Infinity;
      for (const [px, py] of wrapped) {
        const dx = x + 0.5 - px, dy = y + 0.5 - py, q = dx * dx + dy * dy;
        if (q < d2) d2 = q;
      }
      th[y * S + x] = clamp(Math.PI * d2 / (P * P), 0, 1);
    }
  }
  return { S, P, pts, wrapped, th, patterns: new Map() };
}

function screenOf(name) {
  return screens[name] || (screens[name] = buildScreen(name));
}

/** Tiled dot pattern at a quantised coverage, for live elements. */
function dotPattern(ctx, name, coverage) {
  const sc = screenOf(name);
  const q = clamp(Math.round(coverage * 16), 0, 16);
  if (!sc.patterns.has(q)) {
    const t = cv(sc.S, sc.S), tx = t.getContext('2d');
    const c = q / 16;
    if (c >= 1) { tx.fillStyle = '#000'; tx.fillRect(0, 0, sc.S, sc.S); }
    else if (c > 0) {
      const r = sc.P * Math.sqrt(c / Math.PI);
      tx.fillStyle = '#000';
      for (const [x, y] of sc.wrapped) { tx.beginPath(); tx.arc(x, y, r, 0, Math.PI * 2); tx.fill(); }
    }
    sc.patterns.set(q, t);
  }
  const pat = ctx.createPattern(sc.patterns.get(q), 'repeat');
  pat.setTransform(new DOMMatrix());   // pin to canvas space so it cannot swim
  return pat;
}

/** Screen a greyscale coverage canvas into hard dots. Bake-time only. */
function screenCoverage(covCanvas, name) {
  const sc = screenOf(name);
  const w = covCanvas.width, h = covCanvas.height;
  const src = covCanvas.getContext('2d').getImageData(0, 0, w, h);
  const s = src.data;
  for (let y = 0; y < h; y++) {
    const row = (y % sc.S) * sc.S;
    for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4;
      const cover = s[i + 3] / 255;
      s[i + 3] = cover > sc.th[row + (x % sc.S)] ? 255 : 0;
    }
  }
  const out = cv(w, h);
  out.getContext('2d').putImageData(src, 0, 0);
  return out;
}

/* ── ink passes ───────────────────────────────────────────────────────────────
   Draw coverage into a scratch layer, screen it, tint it, then multiply it onto
   the paper at that plate's registration offset. Darks come from stacking
   plates; there is no black ink anywhere in the film.                         */

const scratch = cv(W, W), sx = scratch.getContext('2d');

/**
 * opts.coverage — dot-screen density, for tonal areas.
 * opts.alpha    — plate opacity, for fades.
 * These are separate because punching a screen through a thin stroke reads as a
 * broken line, not a lighter one; line work fades on alpha and width instead.
 */
function inkPass(ctx, name, opts, drawFn) {
  const coverage = opts.coverage === undefined ? 1 : opts.coverage;
  const alpha = opts.alpha === undefined ? 1 : opts.alpha;
  if (alpha <= 0.001) return;

  sx.setTransform(1, 0, 0, 1, 0, 0);
  sx.globalAlpha = 1;
  sx.globalCompositeOperation = 'source-over';
  sx.clearRect(0, 0, W, W);
  sx.save();
  drawFn(sx);
  sx.restore();

  if (coverage < 1) {                       // punch the dot screen out of the shape
    sx.save();
    sx.globalCompositeOperation = 'destination-in';
    sx.fillStyle = dotPattern(sx, name, coverage);
    sx.fillRect(0, 0, W, W);
    sx.restore();
  }
  sx.save();                                // tint
  sx.globalCompositeOperation = 'source-in';
  sx.fillStyle = INK[name];
  sx.fillRect(0, 0, W, W);
  sx.restore();

  const [ox, oy] = REG[name];
  ctx.save();
  ctx.globalCompositeOperation = 'multiply';
  ctx.globalAlpha = clamp(alpha, 0, 1);
  ctx.drawImage(scratch, ox, oy);
  ctx.restore();
}

/* ── paper ────────────────────────────────────────────────────────────────────
   Cloudy mottling rather than fine grain: the reference shows blotches a few
   hundred px across at low contrast. Baked once, never recomputed, because any
   per-frame regeneration flickers.                                           */

let paper = null;

function bakePaper() {
  const c = cv(W, W), x = c.getContext('2d');
  x.fillStyle = PAPER; x.fillRect(0, 0, W, W);

  const r = rngFor('paper');

  // Mottling is a warm wash with noisy alpha, not a neutral multiply: greyscale
  // noise multiplied over cream desaturates it and reads as smoke rather than
  // paper. Keep it subtle at full size and only obvious when zoomed.
  for (const [res, maxA] of [[30, 0.10], [72, 0.075], [165, 0.05]]) {
    const n = cv(res, res), nx = n.getContext('2d');
    const img = nx.createImageData(res, res);
    for (let i = 0; i < res * res; i++) {
      img.data[i * 4] = 0xB4; img.data[i * 4 + 1] = 0xA6; img.data[i * 4 + 2] = 0x8C;
      img.data[i * 4 + 3] = Math.pow(r(), 1.8) * 255 * maxA;
    }
    nx.putImageData(img, 0, 0);
    x.save();
    x.imageSmoothingEnabled = true;
    x.imageSmoothingQuality = 'high';
    x.drawImage(n, 0, 0, W, W);
    x.restore();
  }

  x.save();                                  // fibres
  x.strokeStyle = '#8a7f6a';
  for (let i = 0; i < 420; i++) {
    const px = r() * W, py = r() * W, len = 5 + r() * 22, ang = r() * Math.PI;
    x.globalAlpha = 0.008 + r() * 0.016;
    x.lineWidth = 0.5 + r() * 0.7;
    x.beginPath();
    x.moveTo(px, py);
    x.quadraticCurveTo(px + Math.cos(ang) * len * 0.5 + (r() - 0.5) * 5,
                       py + Math.sin(ang) * len * 0.5 + (r() - 0.5) * 5,
                       px + Math.cos(ang) * len, py + Math.sin(ang) * len);
    x.stroke();
  }
  x.restore();

  x.save();                                  // flecks
  for (let i = 0; i < 2200; i++) {
    x.globalAlpha = 0.012 + r() * 0.03;
    x.fillStyle = r() < 0.55 ? '#7d7362' : '#ffffff';
    x.beginPath();
    x.arc(r() * W, r() * W, 0.4 + r() * 1.0, 0, Math.PI * 2);
    x.fill();
  }
  x.restore();
  return c;
}

/* ── marks ────────────────────────────────────────────────────────────────── */

/** A ring that is never a true circle: low-frequency wobble on the radius. */
function ringPath(ctx, cx, cy, r, wob, amp) {
  ctx.beginPath();
  ringAt(ctx, cx, cy, r, wob, amp);
}

/** Ripple: grows past the frame corner in ~0.6s, thinning and fading. */
function drawRipple(ctx, cue, t) {
  const u = clamp((t - cue.start) / cue.dur, 0, 1);
  if (u <= 0 || u >= 1) return;
  const e = easeOutCubic(u);
  let cx = CX, cy = CY;
  if (cue.from) { const p = dotPos(t, cue.from); cx = p[0]; cy = p[1]; }
  const bold = cue.bold || 1;
  const r = lerp(DOT_R * 0.9, cue.maxR || CORNER * 1.15, e);
  const alpha = (u < 0.08 ? u / 0.08 : 1) * (1 - easeInQuad(clamp((u - 0.45) / 0.55, 0, 1)));
  const width = lerp(4.6 * bold, 1.15 * bold, e);
  const wob = wobbler(cue.seed);

  inkPass(ctx, cue.ink, { alpha }, (g) => {
    g.strokeStyle = '#000';
    g.lineWidth = width;
    g.lineJoin = 'round';
    ringPath(g, cx, cy, r, wob, 0.010);
    g.stroke();
  });
  drawTicks(ctx, cue, cx, cy, r, e, alpha);
}

/** Vibration ticks: 2-3 short parallel arcs flicking just outside the rim. */
function drawTicks(ctx, cue, cx, cy, r, e, alpha) {
  const tr = rngFor(cue.seed + ':tick');
  const spots = [];
  for (let i = 0, n = 1 + Math.floor(tr() * 2); i < n; i++) spots.push(tr() * Math.PI * 2);
  inkPass(ctx, cue.ink, { alpha: alpha * 0.8 }, (g) => {
    g.strokeStyle = '#000';
    g.lineCap = 'round';
    for (const th of spots) {
      for (let k = 0; k < 3; k++) {
        const rr = r * (1.035 + k * 0.028);
        const span = 0.05 - k * 0.011;
        g.lineWidth = lerp(2.8, 0.9, e) * (1 - k * 0.18);
        g.beginPath();
        g.arc(cx, cy, rr, th - span, th + span);
        g.stroke();
      }
    }
  });
}

/** A voice: one ink, with a second plate escaping as a registration crescent. */
function drawDotAt(ctx, x, y, mainInk, r, coreInk, fringeInk) {
  // Solid marks can composite as vectors. Keeping a 24 px seed off the full
  // canvas scratch plates avoids two 1080-square passes on every frame.
  const fi = fringeInk || 'pink', wob = wobbler('dot:' + mainInk, 2);
  const shape = (name, radius) => {
    const p = new Path2D(), [ox, oy] = REG[name];
    ringAt(p, x + ox, y + oy, Math.max(.001, radius), wob, .035, 48);
    return p;
  };
  const main = shape(mainInk, r), fringe = shape(fi, r), inverse = new Path2D();
  inverse.rect(x-r-10,y-r-10,r*2+20,r*2+20);inverse.addPath(main);
  ctx.save();ctx.globalCompositeOperation='multiply';
  ctx.save();ctx.clip(inverse,'evenodd');ctx.fillStyle=INK[fi];ctx.fill(fringe);ctx.restore();
  ctx.fillStyle=INK[mainInk];
  if(coreInk){
    const core=shape(mainInk,r*.46),rim=new Path2D();rim.addPath(main);rim.addPath(core);
    ctx.fill(rim,'evenodd');ctx.fillStyle=INK[coreInk];ctx.fill(core);
  }else ctx.fill(main);
  ctx.restore();
}

function drawDot(ctx, t, scale = 1) {
  drawDotAt(ctx, CX, CY, 'indigo', DOT_R * scale, null, 'blue');
}

/* ── scene drawing helpers ────────────────────────────────────────────────────
   Scenes draw coverage in 1080-space and alpha is tone, so 0.4 means a 40%
   dot screen. Shape helpers carry hand wobble; nothing here is a true circle
   or a straight line.                                                        */

function makeWob(rng, harmonics = 3) {
  const h = [];
  for (let i = 0; i < harmonics; i++) h.push([2 + i, rng() * 2 - 1, rng() * Math.PI * 2]);
  return (th) => h.reduce((s, [k, a, p]) => s + a * Math.sin(k * th + p), 0) / harmonics;
}

const tone = (g, a) => { g.globalAlpha = clamp(a, 0, 1); };

/** Append a wobbly ring to the current path. */
function ringAt(g, cx, cy, r, wob, amp = 0.02, steps = 0) {
  const n = steps || clamp(Math.round(r * 0.8), 40, 300);
  for (let i = 0; i <= n; i++) {
    const th = i / n * Math.PI * 2;
    const rr = r * (1 + wob(th) * amp);
    const x = cx + Math.cos(th) * rr, y = cy + Math.sin(th) * rr;
    i ? g.lineTo(x, y) : g.moveTo(x, y);
  }
  g.closePath();
}

function blob(g, cx, cy, r, rng, amp = 0.06) {
  g.beginPath();
  ringAt(g, cx, cy, r, makeWob(rng, 3), amp);
}

/** Hand-drawn polyline: wobbled control points, not a ruled edge. */
function hand(g, pts, rng, amp = 2.5) {
  g.beginPath();
  for (let i = 0; i < pts.length; i++) {
    const [x, y] = pts[i];
    const jx = x + (rng() - 0.5) * amp * 2, jy = y + (rng() - 0.5) * amp * 2;
    i ? g.lineTo(jx, jy) : g.moveTo(jx, jy);
  }
}

/** Concentric sound/light/water arcs — the motif that rhymes with the ripples. */
function arcsFan(g, cx, cy, r0, dr, n, a0, a1, lw, rng) {
  for (let i = 0; i < n; i++) {
    g.lineWidth = lw * (1 - i * 0.12);
    g.beginPath();
    const r = r0 + i * dr, j = rng ? (rng() - 0.5) * 0.05 : 0;
    g.arc(cx, cy, r, a0 + j, a1 + j);
    g.stroke();
  }
}

/* ── scene registry ───────────────────────────────────────────────────────── */

const SCENES = {};
const scene = (id, def) => { SCENES[id] = Object.assign({ id, live: null }, def); };

const baked = new Map();

/**
 * Bake a scene to one opaque bitmap: every plate screened, tinted, offset and
 * multiplied onto white, ready to multiply over paper.
 *
 * Baked at its display size, never scaled afterwards. Resampling a halftoned
 * bitmap beats the dot grid against the pixel grid and moirés; real print
 * screens at final size too.
 */
function bakeScene(id, size, swap) {
  const key = id + '@' + size + (swap ? ':' + swap : '');
  if (baked.has(key)) return baked.get(key);
  const sc = SCENES[id];
  const k = size / W;
  const out = cv(size, size), o = out.getContext('2d');
  o.fillStyle = '#fff';
  o.fillRect(0, 0, size, size);

  const cover = cv(size, size), g = cover.getContext('2d');
  for (const ink of sc.inks) {
    const plate = swap ? (SWAPS[swap][ink] || ink) : ink;
    g.setTransform(k, 0, 0, k, 0, 0);
    g.clearRect(0, 0, W, W);
    g.globalAlpha = 1;
    g.globalCompositeOperation = 'source-over';
    g.fillStyle = g.strokeStyle = '#000';
    g.lineCap = 'round';
    g.lineJoin = 'round';
    g.save();
    sc.plates(g, ink, rngFor(id + ':' + ink), rngFor(id + ':shape'));
    g.restore();
    starve(g, rngFor(id + ':' + ink + ':void'));

    const dots = screenCoverage(cover, plate);
    const tin = cv(size, size), tx = tin.getContext('2d');
    tx.drawImage(dots, 0, 0);
    tx.globalCompositeOperation = 'source-in';
    tx.fillStyle = INK[plate];
    tx.fillRect(0, 0, size, size);

    const [rx, ry] = REG[plate];
    o.save();
    o.globalCompositeOperation = 'multiply';
    o.drawImage(tin, rx, ry);
    o.restore();
  }
  baked.set(key, out);
  return out;
}

function starve(g, rng) {
  g.save();
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalCompositeOperation = 'destination-out';
  const w = g.canvas.width, n = Math.round(w * 1.1);
  for (let i = 0; i < n; i++) {
    g.globalAlpha = 0.2 + rng() * 0.55;
    g.beginPath();
    g.arc(rng() * w, rng() * w, 0.5 + rng() * 2.0, 0, Math.PI * 2);
    g.fill();
  }
  g.restore();
}


/* ── craft kit ────────────────────────────────────────────────────────────────
   Drawing vocabulary for scene plates. Copy this whole block into a new film,
   between starve() and the scenes.

   Shapes are Path2D values rather than marks on the context, so one shape can
   be filled on one plate, knocked out of another and hatched on a third. That
   is what plate discipline needs, and it removes the usual trap of rebuilding
   a shape per ink and having the knockout miss.

   Everything draws coverage in 1080-space: fill style is already '#000' and
   globalAlpha is tone, so 0.4 means a 40% dot screen.                        */

const TAU = Math.PI * 2;

/* — shape builders ——————————————————————————————————————————————— */

/** Catmull-Rom through pts, as a dense polyline. */
function curve(pts, closed, per) {
  per = per || 12;
  const n = pts.length, out = [];
  const at = (i) => pts[closed ? (i + n * 2) % n : clamp(i, 0, n - 1)];
  const last = closed ? n : n - 1;
  for (let i = 0; i < last; i++) {
    const p0 = at(i - 1), p1 = at(i), p2 = at(i + 1), p3 = at(i + 2);
    for (let k = 0; k < per; k++) {
      const u = k / per, u2 = u * u, u3 = u2 * u;
      out.push([
        0.5 * (2 * p1[0] + (p2[0] - p0[0]) * u + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * u2
               + (3 * p1[0] - p0[0] - 3 * p2[0] + p3[0]) * u3),
        0.5 * (2 * p1[1] + (p2[1] - p0[1]) * u + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * u2
               + (3 * p1[1] - p0[1] - 3 * p2[1] + p3[1]) * u3),
      ]);
    }
  }
  if (!closed) out.push(pts[n - 1].slice());
  return out;
}

/** Points around an ellipse, for feeding cut(). */
function ringPts(x, y, rx, ry, n, rot) {
  const out = [], c = Math.cos(rot || 0), s = Math.sin(rot || 0);
  for (let i = 0; i < n; i++) {
    const th = i / n * TAU, px = Math.cos(th) * rx, py = Math.sin(th) * ry;
    out.push([x + px * c - py * s, y + px * s + py * c]);
  }
  return out;
}

/**
 * Closed hand-cut contour through control points: the silhouette builder.
 * A shape made of arcs and ellipses reads as clip art however good the screen
 * is, because every edge has the same machine curvature.
 *   o.amp   edge waver in px — 2 is a drawn line, 8 is torn stock
 *   o.tear  0..1 chance per sample of a deeper bite inward
 */
function cut(pts, rng, o) {
  o = o || {};
  const amp = o.amp === undefined ? 3 : o.amp, tear = o.tear || 0;
  const c = curve(pts, true, o.per || 10), n = c.length;
  let area = 0;
  for (let i = 0; i < n; i++) {
    const a = c[i], b = c[(i + 1) % n];
    area += a[0] * b[1] - b[0] * a[1];
  }
  const sgn = area > 0 ? 1 : -1;            // keep the normal pointing outward

  /* Displace along the normal, then smooth: an unsmoothed tear lands on one
     sample and reads as damage rather than as a bay in the edge. */
  const w1 = makeWob(rng, 4), w2 = makeWob(rng, 9), d = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const th = i / n * TAU;
    d[i] = (w1(th) + w2(th * 3) * 0.3) * amp;
    if (tear && rng() < tear) d[i] -= amp * (1.4 + rng() * 1.6);
  }
  for (let pass = 0; pass < 2; pass++) {
    const s = Float32Array.from(d);
    for (let i = 0; i < n; i++) d[i] = (s[(i - 1 + n) % n] + s[i] * 2 + s[(i + 1) % n]) * 0.25;
  }

  const p = new Path2D();
  for (let i = 0; i < n; i++) {
    const a = c[(i - 1 + n) % n], b = c[(i + 1) % n];
    let tx = b[0] - a[0], ty = b[1] - a[1];
    const m = Math.hypot(tx, ty) || 1; tx /= m; ty /= m;
    const x = c[i][0] + sgn * ty * d[i], y = c[i][1] - sgn * tx * d[i];
    i ? p.lineTo(x, y) : p.moveTo(x, y);
  }
  p.closePath();
  return p;
}

/**
 * Variable-width ribbon along a path, as a fillable shape. Canvas has no
 * pressure, so a constant lineWidth is the default and it is what makes stems,
 * branches, whiskers and rigging read as wire. wfn(u) returns half-width.
 */
function nib(pts, wfn, o) {
  o = o || {};
  const c = o.raw ? pts : curve(pts, false, o.per || 10);
  const n = c.length, L = [], R = [];
  for (let i = 0; i < n; i++) {
    const a = c[Math.max(0, i - 1)], b = c[Math.min(n - 1, i + 1)];
    let tx = b[0] - a[0], ty = b[1] - a[1];
    const m = Math.hypot(tx, ty) || 1; tx /= m; ty /= m;
    const w = Math.max(0.01, wfn(i / (n - 1)));
    L.push([c[i][0] - ty * w, c[i][1] + tx * w]);
    R.push([c[i][0] + ty * w, c[i][1] - tx * w]);
  }
  const p = new Path2D();
  p.moveTo(L[0][0], L[0][1]);
  for (let i = 1; i < n; i++) p.lineTo(L[i][0], L[i][1]);
  for (let i = n - 1; i >= 0; i--) p.lineTo(R[i][0], R[i][1]);
  p.closePath();
  return p;
}

/** Width profiles for nib(). */
const wTip = (w) => (u) => w * (1 - u * u);                       // full, lifting to a point
const wSwell = (w, at, k) => (u) => w * Math.exp(-Math.pow((u - at) / (k || 0.35), 2));
const wLeaf = (w, skew) => (u) => w * Math.pow(Math.sin(Math.PI * Math.pow(u, skew || 0.55)), 1.15);

/**
 * Calligraphic width from a held nib: widest where the path runs across the
 * nib's axis, thinnest where it runs along it. This is where hand-drawn line
 * weight comes from, and it is what makes a contour read as drawn rather than
 * traced. Pass the same polyline you give nib(), with raw: true.
 */
function wNib(c, w0, ang, floor) {
  const n = c.length, f = floor === undefined ? 0.22 : floor;
  return (u) => {
    const i = clamp(Math.round(u * (n - 1)), 0, n - 1);
    const a = c[Math.max(0, i - 1)], b = c[Math.min(n - 1, i + 1)];
    const th = Math.atan2(b[1] - a[1], b[0] - a[0]);
    return w0 * (f + (1 - f) * Math.abs(Math.sin(th - ang)));
  };
}

/**
 * A horizon band closed to the bottom of the frame: hills, treeline, roofline,
 * wave. Stack several at falling tone and the air between them reads as depth.
 *   o.amp  height of the undulation   o.freq  how many bumps across the frame
 *   o.tilt fraction of W the far end drops   o.teeth adds a jagged octave
 */
function ridgeAt(y, o) {
  const amp = o.amp === undefined ? 60 : o.amp;
  const w = makeWob(o.rng, o.harm || 5), t = o.teeth ? makeWob(o.rng, 7) : null;
  return (u) => y + w(u * (o.freq || 5)) * amp + (o.tilt || 0) * (u - 0.5) * W
                + (t ? t(u * 37) * amp * 0.22 : 0);
}

/**
 * Mountain profile: overlapping triangular peaks with a jagged octave on top,
 * because a skyline built from smooth harmonics always reads as hills however
 * tall it is. Same u -> y contract as ridgeAt, so ridge() takes either.
 */
function peaksAt(y, o) {
  const amp = o.amp === undefined ? 90 : o.amp, n = o.n || 5, ps = [];
  for (let i = 0; i < n; i++) {
    ps.push({ c: (i + 0.5) / n + (o.rng() - 0.5) * 0.7 / n,
              h: amp * (0.4 + o.rng() * 0.6), w: (0.55 + o.rng() * 0.9) / n,
              lean: (o.rng() - 0.5) * 0.7 });
  }
  const jag = makeWob(o.rng, 8);
  return (u) => {
    let top = y;
    for (const p of ps) {
      const d = (u - p.c) / p.w;
      const yy = y - p.h * Math.max(0, 1 - Math.abs(d)) * (1 + p.lean * (d > 0 ? 1 : -1));
      if (yy < top) top = yy;
    }
    return top + jag(u * 26) * amp * 0.06;
  };
}

/** x across the frame -> the u that ridgeAt takes, for planting on a skyline. */
const ridgeU = (x) => (x + 60) / (W + 120);

function ridge(y, o) {
  o = o || {};
  const f = typeof y === 'function' ? y : ridgeAt(y, o);
  const n = o.n || 120, p = new Path2D();
  p.moveTo(-60, W + 60);
  for (let i = 0; i <= n; i++) p.lineTo(-60 + i / n * (W + 120), f(i / n));
  p.lineTo(W + 60, W + 60);
  p.closePath();
  return p;
}

/* — paint operations ————————————————————————————————————————————— */

/** Fill a shape at a tone. */
function print(g, path, a) { tone(g, a === undefined ? 1 : a); g.fill(path); }

/** Knock a shape out of the plate underneath it, at full coverage.
    A knockout drawn at a tone leaves the screen's gaps behind, so the plate
    below shows through the holes — always clear solid. */
function carve(g, path) {
  g.save();
  g.globalAlpha = 1;
  g.globalCompositeOperation = 'destination-out';
  g.fill(path);
  g.restore();
}

/**
 * Print a shape at an exact tone, clearing whatever the plate already holds
 * beneath it. Tones on one plate add where they overlap, so a stack of ridges
 * drawn back to front ends up solid at the bottom of the frame — which looks
 * like a colour band rather than land. Every plane in a depth stack goes
 * through here.
 */
function plane(g, path, a) { carve(g, path); print(g, path, a); }

/** Outline a shape. Line work fades on width and alpha, never on coverage. */
function keyline(g, path, w, a) {
  tone(g, a === undefined ? 1 : a);
  g.lineWidth = w === undefined ? 3 : w;
  g.stroke(path);
}

/**
 * Tone ramp inside a shape — a coverage gradient, which the screen turns into
 * a dot-size ramp. This is the signature riso gesture and neither film uses it.
 * Baked plates only: a live inkPass screens at one flat coverage, so a gradient
 * there prints smooth, which is the thing the brief forbids.
 *   o.stops  [[at, tone], ...]      o.x0,y0,x1,y1  linear
 *   o.x,y,r0,r  radial
 */
function shade(g, path, o) {
  g.save();
  if (path) g.clip(path);
  const grd = o.r !== undefined
    ? g.createRadialGradient(o.x, o.y, o.r0 || 0, o.x, o.y, o.r)
    : g.createLinearGradient(o.x0, o.y0, o.x1, o.y1);
  for (const [at, a] of o.stops) grd.addColorStop(clamp(at, 0, 1), 'rgba(0,0,0,' + clamp(a, 0, 1) + ')');
  if (o.cut) g.globalCompositeOperation = 'destination-out';
  g.globalAlpha = 1;
  g.fillStyle = grd;
  g.fillRect(-W, -W, W * 3, W * 3);
  g.restore();
}

/**
 * Parallel hatching clipped to a shape: tone made of line rather than dot.
 * Next to the screen it reads as engraving, and it is how a mid-value stops
 * being flat without adding another ink.
 *   o.gap px between lines   o.w width   o.ang radians   o.a tone
 *   o.fade(u) 0..1 thins across the run, for a shaded edge
 *   o.cut hatches into the knockout instead, which is dry-brush at gap 3-5
 */
function hatch(g, path, rng, o) {
  o = o || {};
  const gap = o.gap || 10, span = W * 1.6;
  const w = o.w || 2.2, a = o.a === undefined ? 1 : o.a;
  g.save();
  if (path) g.clip(path);
  if (o.cut) g.globalCompositeOperation = 'destination-out';
  g.translate(CX, CY); g.rotate(o.ang === undefined ? -0.5 : o.ang); g.translate(-CX, -CY);
  g.lineCap = 'round';
  const n = Math.ceil(span * 2 / gap);
  for (let i = 0; i < n; i++) {
    const u = i / (n - 1), f = o.fade ? clamp(o.fade(u), 0, 1) : 1;
    if (f <= 0.02) continue;
    g.globalAlpha = a * f;
    g.lineWidth = w * (0.72 + rng() * 0.5) * clamp(f, 0.3, 1);
    const y = CY - span + i * gap + (rng() - 0.5) * gap * 0.3;
    g.beginPath();
    for (let k = 0; k <= 7; k++) {
      const x = CX - span + span * 2 * k / 7, yy = y + (rng() - 0.5) * 2.4;
      k ? g.lineTo(x, yy) : g.moveTo(x, yy);
    }
    g.stroke();
  }
  g.restore();
}

/**
 * Stipple inside a shape — a gradient made of grain instead of dots, for
 * spray, mist, sand, snow, and the bloom where ink feathers at an edge.
 * o.density(x, y) returns 0..1 and is the whole point: without it this is noise.
 */
function spray(g, path, rng, o) {
  o = o || {};
  const n = o.n || 900, r0 = o.r0 || 0.8, r1 = o.r1 || 3.0;
  const b = o.box || [0, 0, W, W], a = o.a === undefined ? 1 : o.a;
  g.save();
  if (o.cut) g.globalCompositeOperation = 'destination-out';
  for (let i = 0; i < n; i++) {
    const x = b[0] + rng() * b[2], y = b[1] + rng() * b[3];
    const d = o.density ? o.density(x, y) : 1;
    const keep = rng() < d, rr = r0 + rng() * (r1 - r0), av = 0.45 + rng() * 0.55;
    if (!keep || (path && !g.isPointInPath(path, x, y))) continue;
    g.globalAlpha = a * av;
    g.beginPath();
    g.arc(x, y, rr, 0, TAU);
    g.fill();
  }
  g.restore();
}

/* There is no model() helper here on purpose. Shading a form by laying a second
   ink across its shade side is the obvious move and it is wrong: study 3 in that
   form printed an orange ball olive-brown. Model with shade(…, {cut: true}) on
   the subject's own plate instead, and spend a second ink only on the smallest
   darkest accent. */

/** Contact shadow. A subject that does not touch its ground reads as a decal. */
function bed(g, x, y, rx, ry, rng, a) {
  const t = a === undefined ? 0.55 : a;
  shade(g, cut(ringPts(x, y, rx, ry, 10), rng, { amp: rx * 0.06 }),
        { x: x, y: y, r0: 0, r: rx, stops: [[0, t], [0.5, t * 0.5], [1, 0]] });
}

/* ── motion kit ───────────────────────────────────────────────────────────────
   How a scene behaves, as against how it is drawn. Copy this block into a film
   after the craft kit; it depends on clamp, lerp, cv, W, TAU, INK, REG, paper,
   dotPattern and wobbler.

   Two constraints shape everything in it:
   - A frame is a pure function of t. State carried between frames breaks the
     contract and verify.mjs catches it; an rng drawn per frame does not break
     the contract, is not caught, and makes texture crawl. Vary in t, not in
     frame count — wander() is the primitive for it.
   - A live element screens at one flat coverage, so shade() cannot reach it.
     Spatial tone on something that moves is bandPass().                      */

/** Local 0..1 for an event at t0 lasting dur. Every timed thing starts here. */
const phase = (t, t0, dur) => clamp((t - t0) / dur, 0, 1);

/**
 * Quantise time onto a step grid. Interpolated motion reads as a tween; held
 * frames read as drawn animation, which is what the printed idiom wants — 1/12
 * is on twos, and cuts and scene changes belong on the 0.25/0.5 s grid.
 */
const hold = (t, step) => Math.floor(t / step + 1e-9) * step;

/* There is no easeInBack here on purpose. Anticipation staged as an easing
   curve on the travel is a shape sliding backwards; study 10 got it by giving
   the bird a crouch to hold and a branch to load, which is a pose and a phase,
   not a curve. Reach for a curve only once the pose exists. */
const easeOutQuad = (u) => 1 - (1 - u) * (1 - u);   // thrown: leaves fast, then coasts

/**
 * Mass arriving somewhere and ringing down. Anything with weight that stops
 * against something — a lid, a released branch, a landed bird, a float — rings
 * past its rest and comes back. easeOutCubic merely decelerates, which reads as
 * a machine parking, and is the wrong default for everything that has weight.
 *   o.bounces  half-cycles before rest: 1 a heavy lid, 2 a branch, 3 a whisker
 *   o.damp     higher is stiffer
 */
function settle(u, o) {
  if (u <= 0) return 0;
  if (u >= 1) return 1;
  o = o || {};
  const n = o.bounces === undefined ? 2 : o.bounces, k = o.damp === undefined ? 5 : o.damp;
  const f = (x) => 1 - Math.exp(-k * x) * Math.cos(n * Math.PI * x);
  return f(u) + (1 - f(1)) * u;                  // land exactly on 1
}

/**
 * Deterministic wander in t: one sine stack sampled at t, never a fresh rng
 * draw per frame. This is what lets a flame, a flag or a water surface vary
 * without crawling. Periodic with period 1/hz, so anything driven by it loops
 * seamlessly; give separate parts separate keys or they all breathe together.
 */
const wander = (key, hz, harmonics) => {
  const w = wobbler(key, harmonics || 3);
  return (t) => w(TAU * hz * t);
};

const scratch2 = cv(W, W), s2x = scratch2.getContext('2d');

/**
 * Spatial tone on a live element. inkPass screens a whole pass at one flat
 * coverage: a gradient drawn into it survives as dots of constant size at
 * varying opacity, which prints as smooth ink — the one thing this look cannot
 * afford. Bands give the dot ramp back. Each band is its own quantised
 * coverage, so the dot itself steps up across the form.
 *
 * bands are [{coverage, draw(g)}, …], lightest first, each one a region rather
 * than a gradient. A band clears what earlier bands left where it lands,
 * because two screens overlapping print denser than either — the same reason
 * plane() exists for baked plates. A band at coverage 0 is therefore a
 * knockout, which is how a live highlight gets back to bare paper.
 *
 * Four steps read as a ramp at 1080. dotPattern quantises to 1/16, so steps
 * closer than 0.06 apart are the same band drawn twice. Each band costs one
 * full-canvas pattern fill, so this is for the one element in the frame that is
 * both moving and modelled, not for everything that moves.
 */
function bandPass(ctx, name, opts, bands) {
  opts = opts || {};
  const alpha = opts.alpha === undefined ? 1 : opts.alpha;
  if (alpha <= 0.001) return;

  sx.setTransform(1, 0, 0, 1, 0, 0);
  sx.globalAlpha = 1;
  sx.globalCompositeOperation = 'source-over';
  sx.clearRect(0, 0, W, W);

  for (const b of bands) {
    // Path bands clear and screen in one scratch surface. The drawing callback
    // route remains for bands with arbitrary masks or drawing operations.
    if(b.path){
      const c=clamp(b.coverage===undefined?1:b.coverage,0,1);
      sx.save();if(b.clipPath)sx.clip(b.clipPath);
      sx.globalCompositeOperation='destination-out';sx.fillStyle='#000';sx.fill(b.path);
      if(c>.001){sx.globalCompositeOperation='source-over';sx.fillStyle=c<1?dotPattern(sx,name,c):'#000';sx.fill(b.path);}
      sx.restore();continue;
    }
    s2x.setTransform(1, 0, 0, 1, 0, 0);
    s2x.globalAlpha = 1;
    s2x.globalCompositeOperation = 'source-over';
    s2x.clearRect(0, 0, W, W);
    s2x.fillStyle = s2x.strokeStyle = '#000';
    s2x.lineCap = 'round';
    s2x.lineJoin = 'round';
    s2x.save();
    b.draw(s2x);
    s2x.restore();

    sx.save();                                   // this band owns its value
    sx.globalCompositeOperation = 'destination-out';
    sx.drawImage(scratch2, 0, 0);
    sx.restore();

    const c = clamp(b.coverage === undefined ? 1 : b.coverage, 0, 1);
    if (c <= 0.001) continue;
    if (c < 1) {
      s2x.save();
      s2x.globalCompositeOperation = 'destination-in';
      s2x.fillStyle = dotPattern(s2x, name, c);
      s2x.fillRect(0, 0, W, W);
      s2x.restore();
    }
    sx.drawImage(scratch2, 0, 0);
  }

  sx.save();
  sx.globalCompositeOperation = 'source-in';
  sx.fillStyle = INK[name];
  sx.fillRect(0, 0, W, W);
  sx.restore();

  const [ox, oy] = REG[name];
  ctx.save();
  ctx.globalCompositeOperation = 'multiply';
  ctx.globalAlpha = clamp(alpha, 0, 1);
  ctx.drawImage(scratch, ox, oy);
  ctx.restore();
}

/**
 * Put paper back under a live light. Every live pass multiplies, so a bright
 * moving element over a printed night can only get brighter by taking the night
 * away first; a pale ink screened straight over it prints mud.
 *
 * The opening is banded for the same reason ink is: a soft-edged mask fades the
 * night's dots in opacity instead of shrinking them, which is smooth ink by
 * another route. Bands here union rather than accumulate — dotPattern grows one
 * dot grid, so a lower coverage is a subset of a higher one — and name picks
 * which screen the opening is cut on. Use the screen of the ink about to print
 * over it, or the two grids beat.
 *
 * relight puts paper back over everything already in the frame, baked included.
 * Anything inside the opening that must survive is drawn after it.
 */
function relight(ctx, name, bands) {
  for (const b of bands) {
    const c = clamp(b.coverage === undefined ? 1 : b.coverage, 0, 1);
    if (c <= 0.001) continue;
    s2x.setTransform(1, 0, 0, 1, 0, 0);
    s2x.globalAlpha = 1;
    s2x.globalCompositeOperation = 'source-over';
    s2x.clearRect(0, 0, W, W);
    s2x.fillStyle = s2x.strokeStyle = '#000';
    s2x.save();
    b.draw(s2x);
    s2x.restore();
    if (c < 1) {
      s2x.globalCompositeOperation = 'destination-in';
      s2x.fillStyle = dotPattern(s2x, name, c);
      s2x.fillRect(0, 0, W, W);
    }
    s2x.globalCompositeOperation = 'source-in';
    s2x.drawImage(paper, 0, 0);
    ctx.save();
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.drawImage(scratch2, 0, 0);
    ctx.restore();
  }
}


/* Lumen's scene library. All contours shared by plates are built before ink branches. */
/* ── sound kit ────────────────────────────────────────────────────────────────
   Deterministic score synthesis for renderAudio(). Copy this block after the
   motion kit. Depends on rngFor, clamp, lerp and W. Every noise buffer is
   seeded by key, every envelope starts and ends at silence, and nothing reads
   a clock or Math.random, so a cold render is repeatable and audio.mjs --twice
   can prove it.

   Time arguments are film seconds. Instruments take the score `s` first, then
   `at`, then options. `hit` in options places the loudest moment on that time
   by starting the sound `attack` earlier; use it wherever the picture has a
   visible arrival. Levels are linear gains before the master; the mix is
   scaled once after render to a loudness target, so balance voices against
   each other rather than against full scale.

   Top-level names the block declares, so a film can spot a collision before

/* ── branching ────────────────────────────────────────────────────────────────
   One generator grows the neuron's dendrites and the release arbor: the
   ending is the first world grown large. Branches carry their own spawn time
   so growth can be replayed at any age; t0/dur are in seconds of growth.    */
function arbor(key,x,y,o){
  const rng=rngFor(key),out=[];
  const grow=(x0,y0,ang,len,w,depth,t0)=>{
    const n=6,raw=[[x0,y0]];let a=ang,px=x0,py=y0;const bend=(rng()-.5)*o.bend;
    for(let i=1;i<=n;i++){a+=bend/n+(rng()-.5)*o.jitter;px+=Math.cos(a)*len/n;py+=Math.sin(a)*len/n;raw.push([px,py]);}
    const pts=curve(raw,false,5),dur=o.dur*Math.pow(o.decay,depth);
    const br={pts,w,depth,t0,dur,len};out.push(br);
    if(depth<o.depth){
      const kids=depth?o.kids:o.kids0;
      for(let k=0;k<kids;k++){
        const at=o.atMin+rng()*(o.atMax-o.atMin),[bx,by,ba]=pointAt(pts,at);
        const side=(k+depth)%2?1:-1;
        grow(bx,by,ba+side*(o.turn+rng()*o.turnVar),len*(o.shrink+rng()*.15),w*o.thin,depth+1,t0+at*dur);
      }
    }
  };
  for(let i=0;i<o.n0;i++){
    const a=(o.a0||0)+i*TAU/o.n0+(rng()-.5)*(o.spread||0);
    if(o.skip&&o.skip(a))continue;
    grow(x,y,a,o.len*(.8+rng()*.4),o.w,0,(o.stagger||0)*rng());
  }
  return out;
}
/**
 * Branch ribbons grown to `age` seconds (Infinity for complete), about (cx,cy) at `scale`.
 * Returns [{path, thin, core, b, e, tip}] — three widths so a live pass can band them.
 */
function arborPaths(branches,age,scale=1,cx=540,cy=540,ease){
  const out=[];
  for(const b of branches){
    const u=age===Infinity?1:phase(age,b.t0,b.dur);if(u<=0)continue;
    const e=u>=1?1:(ease?ease(u):settle(u,{bounces:1,damp:5.5}));
    const pts=partial(b.pts,e).map(([x,y])=>[cx+(x-540)*scale,cy+(y-540)*scale]);
    if(pts.length<2)continue;
    const w=b.w*scale*Math.min(1,e*1.5);
    out.push({path:nib(pts,wTip(w),{raw:true}),thin:nib(pts,wTip(w*.6),{raw:true}),core:nib(pts,wTip(w*.3),{raw:true}),b,e,tip:pts[pts.length-1]});
  }
  return out;
}

  ctx.save();ctx.beginPath();ctx.arc(540,540,Math.max(.01,reveal),0,TAU);ctx.clip();
  paintWorld(ctx,c.scene,t-(c.motionStart??c.start),c.swap);ctx.restore();
}
function drawMemoryLens(ctx,c,t){
  const r=memoryRadius(t);
  inkPass(ctx,'blue',{alpha:.35*(1-phase(t,15.78,.22))},g=>{
    g.lineWidth=1.8;for(const rr of [r+9,r+18]){ringPath(g,540,540,rr,wobbler('recall'),.004);g.stroke();}
  });
}

/* III · memory. Feature glyphs spiral out in three inks, drain to blue, and are drawn into the dot. */
const FEATURES=Array.from({length:40},(_,i)=>{
  const r=rngFor('feature'+i);return{angle:i*2.399963,orbit:110+Math.sqrt(i/39)*360,size:13+r()*11,
    kind:i%4,ink:['blue','orange','violet'][i%3],spin:r()*TAU};
});
function featurePath(x,y,a,size,kind,key){
  const ca=Math.cos(a),sa=Math.sin(a),T=(u,v)=>[x+u*ca-v*sa,y+u*sa+v*ca];
  if(kind===0){const p=new Path2D();p.addPath(discPath(x,y,size*.5));p.addPath(discPath(x,y,size*.28));return p;}
  if(kind===1)return pathOf([T(-size*.5,size*.4),T(size*.55,0),T(-size*.5,-size*.4)],key,1);
  if(kind===2)return pathOf([T(-size*.45,-size*.45),T(size*.45,-size*.45),T(size*.45,size*.45),T(-size*.45,size*.45)],key,1);
  return nib([T(-size*.6,0),T(size*.6,0)],wSwell(size*.16,.5,.6));
}
const MEMORY_ABSORB={at:1.12,dur:.62};
function drawMemory(ctx,c,t){
  const s=t-c.start,enter=easeOutQuad(phase(s,0,.65)),absorb=easeInQuad(phase(s,MEMORY_ABSORB.at,MEMORY_ABSORB.dur));
  if(s<.28){
    ctx.save();ctx.beginPath();ctx.arc(540,540,146*(1-easeInOutCubic(s/.28)),0,TAU);ctx.clip();
    paintWorld(ctx,'neuron',.5+s);ctx.restore();
  }
  const drain=phase(s,.66,.4),groups={blue:[],orange:[],violet:[]},all=[];
  FEATURES.forEach((m,i)=>{
    const a=m.angle+s*(i%2?-.25:.25),r=m.orbit*enter*(1-absorb);
    const size=m.size*enter*(1-absorb*.8);
    if(size<.6||r<8)return;
    const x=540+Math.cos(a)*r,y=540+Math.sin(a)*r;
    const p=featurePath(x,y,m.spin+s*.6,size,m.kind,'feat'+i);
    groups[m.ink].push(p);all.push(p);
  });
  for(const ink of ['blue','orange','violet'])inkPass(ctx,ink,{coverage:.8,alpha:1-drain},g=>{g.fillStyle='#000';groups[ink].forEach(p=>g.fill(p,'evenodd'));});
  if(drain>0)inkPass(ctx,'blue',{coverage:.66,alpha:drain},g=>{g.fillStyle='#000';all.forEach(p=>g.fill(p,'evenodd'));});
}

/* IV · answer. The orange voice arrives from the upper right; the two voices' waves interfere. */
function voices(t){
  const move=easeInOutCubic(phase(t,18.1,2.1)),close=easeInOutCubic(phase(t,20.2,1.8));
  const result=[[lerp(540,428,move)+close*72,lerp(540,652,move)-close*86],
    [lerp(1190,700,move)-close*116,lerp(-90,326,move)+close*140]];
  const gather=easeInQuad(phase(t,21.65,.35));
  return result.map(([x,y])=>[lerp(x,540,gather),lerp(y,540,gather)]);
}
function dotPos(t,which){return voices(t)[which==='orange'?1:0];}
function drawAnswerRipples(ctx,t){
  const [[bx,by],[ox,oy]]=voices(Math.min(t,RELEASE.start));
  for(const event of ANSWER_PULSES){
    const u=phase(t,18+event.s,1.2);if(u<=0||u>=1)continue;
    const [x,y]=event.ink==='orange'?[ox,oy]:[bx,by];
    inkPass(ctx,event.ink,{alpha:(1-u)*.9},g=>{
      g.lineWidth=3.5*(1-u)+.5;
      ringPath(g,x,y,lerp(14,480,easeOutQuad(u)),wobbler('answer'+event.s),.01);g.stroke();
    });
  }
}
/** Nodal lines of two point sources: |PB| − |PO| = kλ, a family of hyperbolas about the pair. */
function interference(ctx,t,strength){
  if(strength<=.01)return;
  const [[bx,by],[ox,oy]]=voices(Math.min(t,RELEASE.start));
  const dx=ox-bx,dy=oy-by,d=Math.hypot(dx,dy);if(d<20)return;
  const cx=(bx+ox)/2,cy=(by+oy)/2,c=d/2,ca=dx/d,sa=dy/d;
  const lam=d/3,marks=[new Path2D(),new Path2D()],reach=Math.min(d*1.35,560);
  for(let k=-3;k<=3;k++){
    const a=k*lam/2;if(Math.abs(a)>=c*.97)continue;
    const b=Math.sqrt(c*c-a*a);
    for(let i=-26;i<=26;i++){
      const u=i*.11,px=a*Math.cosh(u),py=b*Math.sinh(u);
      const x=cx+px*ca-py*sa,y=cy+px*sa+py*ca;
      const far=Math.hypot(x-cx,y-cy);if(far>reach)continue;
      const w=1-Math.pow(far/reach,2);
      marks[Math.abs(k)%2].addPath(discPath(x,y,(2.8+2.4*w)*strength));
    }
  }
  directInk(ctx,'orange',marks[0],1,.85*strength);directInk(ctx,'violet',marks[1],1,.7*strength);
}
function drawAnswer(ctx,c,t){
  const s=t-18,[[bx,by],[ox,oy]]=voices(t);
  const wash=phase(s,0,2.3),radius=(170+wash*470)*(1-easeInOutCubic(phase(s,3.4,.6)));
  bandPass(ctx,'orange',{},[.0625,.125,.1875].map((coverage,i)=>({coverage,path:discPath(1130,-60,radius-i*96)})));
  drawAnswerRipples(ctx,t);
  interference(ctx,t,phase(s,1.2,1.6)*(1-phase(s,3.72,.28)));
  const tension=phase(s,3.1,.9);
  if(tension>.25)inkPass(ctx,'orange',{},g=>{
    const v=phase(tension,.25,.75);
    for(let i=0;i<11;i++){
      const a=i*TAU/11+v*.9,r=10+58*v;
      g.fill(nib([[540+Math.cos(a)*r,540+Math.sin(a)*r],[540+Math.cos(a)*(r+14*v),540+Math.sin(a)*(r+14*v)]],wTip(1.9)));
    }
  });
  drawDotAt(ctx,bx,by,'indigo',DOT_R,null,'blue');
  if(ox<1110&&oy>-30&&Math.hypot(ox-bx,oy-by)>3)drawDotAt(ctx,ox,oy,'orange',DOT_R+1,null,'yellow');
}

/* V · emergence. A thought branches out of the meeting point. */
const RELEASE={start:22,growth:.62,decay:.82,stagger:.05};
const ARBOR=arbor('emergence',540,540,{n0:9,len:470,w:27,depth:3,kids0:3,kids:2,bend:1.15,jitter:.22,turn:.78,turnVar:.45,
  shrink:.56,thin:.6,atMin:.3,atMax:.85,dur:RELEASE.growth,decay:RELEASE.decay,stagger:RELEASE.stagger,spread:.35});
const ARBOR_TIPS=ARBOR.filter(b=>b.depth===3);
const PULSES=[23,23.5];
function drawArbor(ctx,age,scale=1,x=540,y=540,alpha=1,glow=false){
  const grown=arborPaths(ARBOR,age,scale,x,y);if(!grown.length)return;
  if(glow){const gr=easeOutQuad(phase(age,.1,.9))*(1-phase(age,1.95,.45));
    if(gr>.01)bandPass(ctx,'yellow',{},[.0625,.125,.1875].map((coverage,i)=>({coverage,path:discPath(x,y,(520-i*150)*gr)})));}
  const all=unionPaths(grown.map(p=>p.path)),thin=unionPaths(grown.map(p=>p.thin)),core=unionPaths(grown.filter(p=>p.b.depth<2).map(p=>p.core));
  paperShape(ctx,all);
  bandPass(ctx,'violet',{alpha},[{coverage:.45,path:all},{coverage:.85,path:thin}]);
  directInk(ctx,'indigo',core,1,.9*alpha);
  const buds=[],cores=[];
  for(const p of grown){if(p.b.depth<3)continue;const bud=settle(phase(age,p.b.t0+p.b.dur*.9,.3),{bounces:1,damp:5});if(bud<=0)continue;
    buds.push(discPath(p.tip[0],p.tip[1],(11*bud)*scale));cores.push(discPath(p.tip[0],p.tip[1],(4.4*bud)*scale));}
  if(buds.length){const bu=unionPaths(buds);paperShape(ctx,bu);directInk(ctx,'orange',bu,1,.92*alpha);directInk(ctx,'yellow',unionPaths(cores),1,alpha);}
  const beads=[],beadCores=[];
  for(const t0 of PULSES){
    const t=RELEASE.start+age;if(t<t0||t>t0+.9)continue;
    for(const p of grown){const b=p.b,u=phase(t,t0+b.t0*.5,.34);if(u<=0||u>=1)continue;
      const head=u*p.e,r=(6.5-b.depth*1.1)*scale*Math.sin(Math.PI*Math.min(1,u*1.3+.2));
      const tail=segment(b.pts,Math.max(0,head-.3),head,6).map(([px,py])=>[x+(px-540)*scale,y+(py-540)*scale]);
      beads.push(nib(tail,wSwell(r,.85,.5),{raw:true}));beadCores.push(discPath(tail[5][0],tail[5][1],r*.5));}
  }
  if(beads.length){const bu=unionPaths(beads);paperShape(ctx,bu);directInk(ctx,'orange',bu,1,.85*alpha);directInk(ctx,'yellow',unionPaths(beadCores),1,alpha);}
}
function drawRelease(ctx,c,t){
  const age=t-RELEASE.start;
  if(age<.35)drawAnswerRipples(ctx,t);
  if(age<.32){
    inkPass(ctx,'orange',{alpha:1-phase(age,.08,.24)},g=>{
      const r=rngFor('sparks');
      for(let i=0;i<22;i++){const a=r()*TAU,sp=260+r()*420,v=Math.min(age,.4),d=sp*(1-Math.exp(-v*6));
        g.fill(nib([[540+Math.cos(a)*d*.72,540+Math.sin(a)*d*.72],[540+Math.cos(a)*d,540+Math.sin(a)*d]],wTip(2.2)));}
    });
  }
  drawArbor(ctx,age-.04,1,540,540,1,true);
  if(age<.3)drawDotAt(ctx,540,540,'indigo',DOT_R*(1-phase(age,.05,.25)),null,'blue');
}

/* The night: the arbor is one cell of many. */
scene('night',{
  inks:['blue','indigo'],
  plates(g,ink,rng){
    tone(g,ink==='indigo'?.95:.72);g.fillRect(0,0,W,W);
    if(ink==='blue')shade(g,null,{x:540,y:540,r:640,cut:true,stops:[[0,.55],[.5,.2],[1,0]]});
    g.save();g.globalCompositeOperation='destination-out';grainStars(g,rngFor('night:stars'),520);g.restore();
  }
});
const NET=Array.from({length:120},(_,i)=>{
  const r=rngFor('net'+i);return{a:i*2.399963+r()*.3,r:i?95+Math.sqrt(i/119)*980:0,size:3.6+r()*3.2,phase:r()};
});
const NET_EDGES=(()=>{
  const pos=NET.map(n=>[540+Math.cos(n.a)*n.r,540+Math.sin(n.a)*n.r]),edges=[],seen=new Set();
  NET.forEach((n,i)=>{
    const near=pos.map((p,j)=>[Math.hypot(p[0]-pos[i][0],p[1]-pos[i][1]),j]).filter(([d,j])=>j!==i).sort((a,b)=>a[0]-b[0]).slice(0,i?2:4);
    for(const [d,j] of near){const key=Math.min(i,j)+'-'+Math.max(i,j);if(seen.has(key))continue;seen.add(key);edges.push({i,j,phase:rngFor('edge'+key)(),hz:.55+rngFor('edgehz'+key)()*.4});}
  });
  return edges;
})();
function drawNetwork(ctx,c,t){
  const age=t-24,entry=easeInOutCubic(phase(age,0,.44)),exit=1-easeInOutCubic(phase(age,1.62,.38));
  const radius=(CORNER+20)*entry*exit;
  ctx.save();ctx.beginPath();ctx.arc(540,540,Math.max(.001,radius),0,TAU);ctx.clip();paintWorld(ctx,'night',0);
  const camera=lerp(2.3,.8,easeInOutCubic(phase(age,.05,1.25)));
  const pos=NET.map(n=>[540+Math.cos(n.a+age*.012)*n.r*camera,540+Math.sin(n.a+age*.012)*n.r*camera]);
  const visible=p=>p[0]>-40&&p[0]<1120&&p[1]>-40&&p[1]<1120;
  const appear=easeOutQuad(phase(age,.3,.7));
  const wires=[];
  for(const e of NET_EDGES){const a=pos[e.i],b=pos[e.j];if(!visible(a)&&!visible(b))continue;wires.push(nib([a,b],()=>.9,{per:2}));}
  if(wires.length&&appear>.01){const wu=unionPaths(wires);paperShape(ctx,wu);directInk(ctx,'blue',wu,1,.75*appear);}
  const dashes=[];
  for(const e of NET_EDGES){
    const a=pos[e.i],b=pos[e.j];if(!visible(a)&&!visible(b))continue;
    const v=fract(age*e.hz+e.phase),l=life(v,.22)*appear;if(l<.03)continue;
    const p0=Math.max(0,v-.09),p1=v;
    dashes.push(nib([[lerp(a[0],b[0],p0),lerp(a[1],b[1],p0)],[lerp(a[0],b[0],p1),lerp(a[1],b[1],p1)]],wSwell(2.4*l,.5,.6),{per:4}));
  }
  const lights=[],cores=[];
  NET.forEach((n,i)=>{if(!i)return;const p=pos[i];if(!visible(p))return;
    const size=n.size*(.86+.14*Math.sin(age*2.2+n.phase*TAU))*appear;
    lights.push(discPath(p[0],p[1],size));cores.push(discPath(p[0],p[1],size*.42));});
  const lit=unionPaths(lights.concat(dashes));paperShape(ctx,lit);
  if(dashes.length)directInk(ctx,'orange',unionPaths(dashes),1,.9);
  directInk(ctx,'orange',unionPaths(lights),1,.85);directInk(ctx,'yellow',unionPaths(cores));
  ctx.restore();
  const size=lerp(1,.075,easeInOutCubic(phase(age,0,1.15)))*exit;
  if(size>.002)drawArbor(ctx,2+age,size);
}

/* VI · title. */
const TITLE=letterStrokes('emergence',124,412,4,true),BYLINE=letterStrokes('many small things learning to listen',23,690,3);
let signatureCells=null;
function bakeSignature(){
  const c=cv(W,W),g=c.getContext('2d');g.fillStyle='#000';writeLetters(g,TITLE,1,5.6);writeLetters(g,BYLINE,1,1.4);
  const pixels=g.getImageData(0,0,W,W).data,r=rngFor('signature:dissolve');signatureCells=[];
  for(let y=380;y<740;y+=4)for(let x=60;x<1020;x+=4)if(pixels[(y*W+x)*4+3]>25)signatureCells.push([x,y,r()]);
}
function drawSignature(ctx,c,t){
  const age=t-26,fade=phase(age,1.68,.3);
  if(fade>0){
    if(!signatureCells)bakeSignature();
    for(const ink of ['orange','indigo'])inkPass(ctx,ink,{},g=>{
      for(const [x,y,delay] of signatureCells){const v=1-phase(fade,delay*.34,.66);if(v<.01)continue;
        g.beginPath();g.arc(x,y,2.55*v,0,TAU);g.fill();}
    });
  }else{
    for(const ink of ['orange','indigo'])inkPass(ctx,ink,{alpha:ink==='orange'?.72:1},g=>{
      writeLetters(g,TITLE,phase(age,.02,.95),5.6);writeLetters(g,BYLINE,phase(age,.8,.5),1.4);
    });
  }
  const r=DOT_R*(1-.75*phase(age,1.7,.3));
  if(age>.2){drawDotAt(ctx,516,635,'indigo',r,null,'blue');drawDotAt(ctx,564,635,'orange',r,null,'yellow');}
  const q=phase(age,.9,.65);
  if(q>0&&q<1)inkPass(ctx,'orange',{alpha:(1-q)*.6},g=>{
    g.lineWidth=1.2;ringPath(g,564,635,12+q*58,wobbler('sign:ring'),.01);g.stroke();
  });
}

/* ── score ────────────────────────────────────────────────────────────────────
   Two complete arrangements share the picture's event data. The four-note cell
   branches by rhythm and register; scene cuts do not change the instrument. */
const SCORE_NAMES={warm:'A · Gravity',pulse:'B · Orbit'};
const DEFAULT_SCORE='warm';
let selectedScore=new URLSearchParams(location.search).get('score')||DEFAULT_SCORE;
if(!Object.hasOwn(SCORE_NAMES,selectedScore))selectedScore=DEFAULT_SCORE;
const scorePromises=new Map();
function scoreEvents(){
  const cue=kind=>CUES.find(c=>c.kind===kind);
  return {call:cue('ripple').start,window:cue('window').start,montage:FLOW[0].start,
    recall:cue('recall').start,memory:cue('memory').start,
    absorb:cue('memory').start+MEMORY_ABSORB.at+MEMORY_ABSORB.dur,
    answer:cue('answer').start,reply:cue('answer').start+ANSWER_PULSES[0].s,
    contact:RELEASE.start,night:cue('network').start,title:cue('signature').start};
}
function scoreMarks(){const e=scoreEvents();return[e.montage,e.absorb,e.reply,e.contact,e.night].map(t=>+t.toFixed(3));}

function scoreBed(s,e,kind){
  const warm=kind==='warm';
  const chords=warm?[
    [.025,e.montage+1.2,['D3','A3','E4'],.018,1.2],
    [e.montage-.85,e.memory+.4,['B2','F#3','D4','A4'],.019,1.4],
    [e.recall-.8,e.reply+1,['G2','A3','B3','D4'],.016,1.4],
    [e.answer-.75,e.contact+1,['A2','E3','B3','D4'],.019,1.5],
    [e.contact-.15,e.title+.4,['D3','A3','B3','E4','F#4'],.021,.8],
    [e.night-.4,DUR-.12,['D3','A3','E4','F#4'],.013,1.3]
  ]:[
    [.025,e.montage+1,['D3','A3','C4','E4'],.015,1.2],
    [e.montage-.8,e.memory+.45,['G2','D3','A3','B3'],.019,1.3],
    [e.recall-.8,e.reply+1,['E3','A3','B3','D4'],.017,1.4],
    [e.answer-.7,e.contact+.85,['A2','E3','G3','B3'],.018,1.3],
    [e.contact-.1,e.title+.4,['D3','A3','C4','E4','B4'],.020,.8],
    [e.night-.35,DUR-.12,['D3','A3','C4','E4'],.012,1.1]
  ];
  for(const [at,end,notes,level,attack] of chords)pad(s,at,end,notes.map(note),{
    level,attack,release:Math.min(2.1,(end-at)*.46),cutoff:750,
    open:warm?400:650,spread:.42,send:.18,type:'triangle'});
  if(warm){
    const roots=[[e.window,e.montage+.9,'D2'],[e.montage-.25,e.recall+.7,'B1'],
      [e.recall-.2,e.reply+.5,'G2'],[e.answer-.2,e.contact+.7,'A2'],
      [e.contact,e.title+1,'D2']];
    for(const [at,end,n] of roots)organ(s,at,end,note(n),{level:.035,attack:.45,
      release:1,send:0,drawbars:[[1,1],[2,.3],[3,.08]]});
  }else{
    organ(s,e.memory-.4,e.reply+.8,note('A3'),{level:.014,attack:1.1,
      release:1.1,send:.12,drawbars:[[1,1],[2,.16]]});
  }
  // The memory cut sheds detail, not momentum: pedal, air and a fading pulse
  // cross 16 seconds together and yield only after the answering voice arrives.
  organ(s,e.recall-.8,e.reply+1.15,note('A2'),{level:.022,attack:1.2,
    release:1.5,send:.10,drawbars:[[1,1],[2,.35],[3,.08]]});
  wind(s,e.recall-1,e.reply+1.1,{level:.050,centre:470,sweep:150,gust:.12,
    whistle:0,pan:0,send:.18,rise:1.8,fall:1.6,key:'memory-air'});
  for(let i=0,at=e.recall;at<e.reply;at=e.recall+(++i)*BEAT*2){
    const fade=1-phase(at,e.recall-.5,e.reply-e.recall+1.5);
    lowPulse(s,at,note('A2'),.033*fade);
  }
}
function organLead(s,at,midi,o={}){
  const d=o.decay??2.9;
  // Soft organ pipes: low octave support, harmonic partials, no hard exciter.
  struck(s,at,midi,[[.5,.10,d],[1,1,d],[2,.29,d*.9],[3,.11,d*.75],
    [4,.045,d*.65]],{level:.070,attack:.075,strike:0,send:.32,...o});
}
function softPulse(s,at,midi,o={}){
  const d=o.release??2;
  struck(s,at,midi,[[1,1,d],[2,.23,d*.8],[3,.065,d*.6]],
    {level:.060,attack:.055,strike:0,send:.25,...o});
}
function lowPulse(s,at,midi,level=.060){
  struck(s,at,midi,[[1,1,1.55],[2,.24,1.2],[3,.06,.8]],
    {level,attack:.055,send:.015,pan:0,bus:'bed'});
}
function scoreForeground(s,e,kind){
  const warm=kind==='warm',tone=warm?organLead:softPulse;
  const cell=['D3','A3','E4',warm?'F#3':'F3'].map(note);
  const phrase=(at,offsets,notes,level,decay=2.8)=>offsets.forEach((dt,i)=>
    tone(s,at+dt,notes[i],{level:level*[1,.82,.72,.9][i%4],decay,
      pan:[-.20,.22,.25,-.14][i%4]}));
  phrase(e.call,[0,.75,1.5,2.5],cell,warm?.095:.067);
  if(warm){
    phrase(e.montage-2,[0,.75,1.5],cell.slice(0,3),.061);
    phrase(e.montage,[0,.75,1.5,2.5],cell,.102);
    phrase(e.montage+4,[0,1,1.75,2.75],cell,.090);
    phrase(e.recall,[0,.8,1.6,2.4],[cell[2],cell[1],cell[3],cell[0]],.058,2.9);

  }else{
    // A low, half-time ostinato keeps its grid while the picture folds inward.
    const pattern=[0,1,2,null,1,3,1,null];

      const k=pattern[i%8];if(k===null)continue;
      const full=t>=e.montage,rewind=t>=e.recall;
      const n=rewind?cell[3-k]:cell[k];
      const fade=1-.82*phase(t,e.recall,e.reply-e.recall);

        pan:k%2?.18:-.18,release:rewind?2.8:1.9});
      if(full&&i%2===0&&t<e.recall)lowPulse(s,t,note('G2'),.042);
    }
    phrase(e.montage,[0,1.5,3,5.5],cell,.038);
  }
  // The orange line is a complementary answer; both pans converge with the dots.
  const blue=warm?['D3','E3','F#3','A3']:['D3','E3','F3','A3'];
  const orange=warm?['F#3','A3','B3','A3']:['F3','A3','B3','A3'];
  ANSWER_PULSES.forEach((p,i)=>{
    const at=e.answer+p.s,isOrange=p.ink==='orange',j=Math.floor(i/2);
    const [x]=voices(at)[isOrange?1:0];
    tone(s,at,note((isOrange?orange:blue)[j]),{level:(warm?.064:.045)*(1+i*.025),
      decay:2.4,release:2.2,hit:at+.06,x:clamp(x,340,770),pan:null});
    if(!warm&&i%2===0)lowPulse(s,at,note('A2'),.041);
  });
}
function scoreEnding(s,e,kind){
  const warm=kind==='warm',tone=warm?organLead:softPulse;
  // One inhalation prepares contact. Its peak falls just before the dots join.
  breath(s,e.contact-1.45,1.65,{level:warm?.038:.044,from:280,to:1400,
    back:650,peakAt:.87,q:.55,send:.24,color:'pink',key:'joining'});
  // The first chord note meets the contact; the rest opens with the arbor.
  const arrival=warm?['D3','A3','E4','F#4']:['D3','A3','E4','B3'];
  const roots=ARBOR.filter(b=>b.depth===0).slice(0,4);
  arrival.forEach((n,i)=>{
    const at=e.contact+(i===0?0:.04+(roots[i]?.t0??0)+i*RELEASE.stagger);
    tone(s,at,note(n),{level:(warm?.068:.052)*[1,.68,.57,.48][i],
      decay:3.2,release:2.9,hit:at+.06,pan:[0,-.2,.22,.10][i]});
  });
  if(!warm){
    lowPulse(s,e.contact,note('D2'),.060);
    const bloom=['D3','A3','E4','B3'];
    for(let i=1;i<4;i++)softPulse(s,e.contact+i*BEAT,note(bloom[i]),{
      level:.028,release:2.5,pan:i%2?.18:-.18});
  }
  PULSES.forEach((at,i)=>tone(s,at,note(i?'B3':'A3'),
    {level:warm?.028:.026,decay:2.5,release:2.3,hit:at+.06,pan:i?.16:-.16}));
  // The network sheds the pulse and leaves the opening motif suspended.
  const end=warm?['D4','A3','E4','F#3']:['D4','A3','E4','B3'];
  [e.night,e.night+.75,e.title,e.title+.75].forEach((at,i)=>tone(s,at,note(end[i]),{
    level:(warm?.045:.038)*[1,.7,.74,.55][i],decay:Math.min(2,DUR-at-.08),
    release:Math.min(2,DUR-at-.08),hit:at+.06,pan:[-.12,.15,.08,0][i]}));
}

function buildScore(kind=selectedScore){
  if(!Object.hasOwn(SCORE_NAMES,kind))kind=DEFAULT_SCORE;
  if(!scorePromises.has(kind))scorePromises.set(kind,(async()=>{
    const e=scoreEvents(),s=Score({duration:DUR,key:'emergence:'+kind,
      room:{seconds:3.1,decay:.9,predelay:.032,wet:.012,returnLowpass:2800}});
    air(s,{level:.014,highpass:250,lowpass:7800,rise:.12,fall:1.15});
    scoreBed(s,e,kind);
    scoreForeground(s,e,kind);
    scoreEnding(s,e,kind);
    // Fade the room as well as the sources. A last note's reverb must not be cut at DUR.
    s.master.gain.setValueAtTime(1,DUR-1.1);
    s.master.gain.linearRampToValueAtTime(0,DUR-.025);
    return s.render({target:-16,ceiling:-1.8});
  })().catch(error=>{scorePromises.delete(kind);throw error;}));
  return scorePromises.get(kind);
}
async function renderAudio(){return wavBase64(await buildScore());}


/* ── timeline ───────────────────────────────────────────────────────────────── */
const ACTS=[{t:0,name:'I · question'},{t:6,name:'II · timeline'},{t:16,name:'III · memory'},
  {t:18,name:'IV · answer'},{t:22,name:'V · emergence'},{t:26,name:'VI · title'}];
const CUES=[
  {start:1.5,dur:1.2,kind:'window',scene:'neuron',radius:330,exit:true,rim:'violet'},
  {start:2.75,dur:1.1,kind:'window',scene:'valley',radius:305,exit:true,rim:'blue'},
  {start:3.85,dur:1.85,kind:'window',scene:'loom',radius:310,dive:.55,rim:'orange'},
  {start:5.15,dur:FLOW[0].start+FLOW[0].open-5.15,kind:'world',scene:'hall',iris:.42},
];
FLOW.forEach((shot,i)=>{
  const next=FLOW[i+1],end=next?next.start+next.open:14;
  CUES.push({...shot,dur:end-shot.start,kind:'world'});
});
const RECALL=[{id:'hall',swap:'dusk'},{id:'loom',swap:'ember'},{id:'valley',swap:'dusk'},{id:'neuron',swap:null}];
RECALL.forEach((m,i)=>CUES.push({start:14+i*.5,dur:i===3?.5:.85,kind:'recall',scene:m.id,
  open:i?.35:0,motionStart:i?14+i*.5:12.5,swap:m.swap}));
CUES.push({start:14,dur:2,kind:'memoryLens'});
CUES.push({start:16,dur:2,kind:'memory'},{start:18,dur:4,kind:'answer'},
  {start:22,dur:2,kind:'release'},{start:24,dur:2,kind:'network'},
  {start:26,dur:2.001,kind:'signature'});
for(const start of [.1,.85,1.5,2.7,3.7])CUES.push({start,dur:.95,kind:'ripple',ink:'blue',seed:'em'+start});
const DRAW={ripple:drawRipple,window:drawWindow,world:drawWorld,recall:drawRecollection,
  memoryLens:drawMemoryLens,memory:drawMemory,answer:drawAnswer,release:drawRelease,network:drawNetwork,signature:drawSignature};
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
canvas.width=canvas.height=W;
const DEBUG=new URLSearchParams(location.search).get('debug');
function render(t){
  t=clamp(t,0,DUR);ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;
  ctx.globalCompositeOperation='source-over';ctx.drawImage(paper,0,0);
  const q=new URLSearchParams(location.search),selected=q.get('scene');
  if(selected&&SCENES[selected]){paintWorld(ctx,selected,t,q.get('swap'));drawDot(ctx,t);return;}
  for(const cue of CUES) if(t>=cue.start&&t<cue.start+cue.dur)DRAW[cue.kind]?.(ctx,cue,t);
  if(t<18)drawDot(ctx,t);
}

let playing=false,playT=0,lastWall=0,rafId=0,audioEnabled=false,liveCtx=null,liveSrc=null,scoreBuffer=null,audioLoad=0;
const elHead=document.getElementById('play-head'),elScrub=document.getElementById('scrub'),
  elT=document.getElementById('t'),elPlay=document.getElementById('btn-play');
function stopSound(){if(liveSrc){liveSrc.onended=null;liveSrc.stop();liveSrc=null;}}
function startSound(){
  stopSound();if(!audioEnabled||!scoreBuffer||!playing||playT>=DUR)return;
  liveCtx=liveCtx||new AudioContext();liveCtx.resume();
  liveSrc=liveCtx.createBufferSource();liveSrc.buffer=scoreBuffer;liveSrc.connect(liveCtx.destination);
  liveSrc.start(0,playT);liveSrc.onended=()=>{liveSrc=null;};
}
function show(t){playT=clamp(t,0,DUR);render(playT);elHead.style.left=playT/DUR*100+'%';
  elT.textContent=playT.toFixed(2)+' / 28.00';elScrub.setAttribute('aria-valuenow',playT.toFixed(2));}
function advancePlayback(now){if(!playing)return;const next=playT+(now-lastWall)/1000;lastWall=now;show(next);
  if(next>=DUR)setPlaying(false);else rafId=requestAnimationFrame(advancePlayback);}
function setPlaying(v){cancelAnimationFrame(rafId);playing=v;elPlay.textContent=v?'pause':'play';
  if(v){if(playT>=DUR)show(0);lastWall=performance.now();startSound();rafId=requestAnimationFrame(advancePlayback);}else stopSound();}
elPlay.onclick=()=>setPlaying(!playing);
document.getElementById('btn-replay').onclick=()=>{setPlaying(false);show(0);setPlaying(true);};
elScrub.onclick=e=>{const r=elScrub.getBoundingClientRect();setPlaying(false);show((e.clientX-r.left)/r.width*DUR);};
addEventListener('keydown',e=>{if(e.target.matches('select,input,textarea'))return;
  if(e.code==='Space'&&e.target.tagName!=='BUTTON'){e.preventDefault();setPlaying(!playing);}
  if(e.code==='ArrowRight'||e.code==='ArrowLeft'){e.preventDefault();setPlaying(false);show(playT+(e.code==='ArrowRight'?1:-1)/30);}});
for(const a of ACTS){const d=document.createElement('div');d.className='act';d.style.left=a.t/DUR*100+'%';d.textContent=a.name;d.dataset.short=a.name.split(' · ')[0];elScrub.appendChild(d);}
const audioButton=document.getElementById('btn-audio'),scoreChoice=document.getElementById('score-choice');
scoreChoice.value=selectedScore;
async function refreshAudio(){
  const request=++audioLoad,kind=selectedScore;
  stopSound();scoreBuffer=null;
  if(!audioEnabled){audioButton.textContent='sound: off';return;}
  audioButton.textContent='mixing…';
  try{
    liveCtx=liveCtx||new AudioContext();await liveCtx.resume();
    const buffer=await buildScore(kind);
    if(request!==audioLoad||!audioEnabled||kind!==selectedScore)return;
    scoreBuffer=buffer;audioButton.textContent='sound: on';startSound();
  }catch(error){
    if(request!==audioLoad)return;
    audioEnabled=false;audioButton.textContent='sound: retry';console.error(error);
  }
}
audioButton.onclick=()=>{audioEnabled=!audioEnabled;refreshAudio();};
scoreChoice.onchange=()=>{selectedScore=scoreChoice.value;refreshAudio();};
document.getElementById('btn-rec').onclick=function(){
  if(typeof MediaRecorder==='undefined'){this.textContent='unavailable';return;}
  const mime=['video/mp4;codecs=avc1','video/webm;codecs=vp9','video/webm;codecs=vp8'].find(m=>MediaRecorder.isTypeSupported(m));
  if(!mime){this.textContent='no codec';return;}
  const stream=canvas.captureStream(30),rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:12e6}),chunks=[];
  rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
  rec.onstop=()=>{const a=document.createElement('a'),url=URL.createObjectURL(new Blob(chunks,{type:mime}));a.href=url;
    a.download='emergence'+(mime.startsWith('video/mp4')?'.mp4':'.webm');a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
    stream.getTracks().forEach(track=>track.stop());this.textContent='record';this.disabled=false;};
  this.textContent='recording…';this.disabled=true;setPlaying(false);show(0);rec.start();setPlaying(true);
  setTimeout(()=>{rec.stop();setPlaying(false);},DUR*1000+100);
};
paper=bakePaper();for(const name of Object.keys(INK))screenOf(name);
window.__riso={duration:DUR,ready:false,marks:scoreMarks(),get score(){return selectedScore;},seek(t){setPlaying(false);show(t);}};
if(typeof renderAudio==='function')window.__riso.renderAudio=renderAudio;
(async function boot(){
  const jobs=typeof bakeList==='function'?bakeList():[],el=document.getElementById('load');
  for(let i=0;i<jobs.length;i++){el.textContent='printing light · '+(i+1)+' / '+jobs.length;
    await new Promise(r=>setTimeout(r,0));const j=jobs[i];bakeScene(j.id,j.size||W,j.swap);}
  el.remove();show(Number(new URLSearchParams(location.search).get('t'))||0);window.__riso.ready=true;
})();
</script>
