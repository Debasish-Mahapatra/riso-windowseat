<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rivers in the Sky</title>
<style>html,body{margin:0;background:#222} canvas{display:block;width:1280px;height:720px}</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="kit.js"></script>
<script>
'use strict';
/* RIVERS IN THE SKY: watercolour style frame, 1920 x 1080.
   Every wash is a stack of recursively deformed polygons (Tyler Hobbs), drawn
   at low alpha on its own layer. The layer is then treated as pigment density:
   wet blur, edge darkening (density minus its blur), granulation and dry brush
   against a cold-press paper heightmap. It is converted to a Beer-Lambert glaze
   and multiplied onto the paper, so glazes mix subtractively. */

const W = 1920, H = 1080, N = W * H;
const PAPER = [248, 243, 232];
const HZ = 486;              // eye level (vanishing line)
const HOR = 493;             // forest horizon, dipped by the Earth's curvature
const FL = 1500, CX = 960;   // focal length (px), principal point
const CAM = 120;             // camera height above the canopy top (m)
const WDROP = 14;            // river surface below the canopy top (m), painter's cheat
let G2 = null;               // main context

/* ── fast seeded gradient noise (no allocation per call) ─────────────────── */
function gnoise(key) {
  const r = rngFor('gn:' + key), P = new Uint8Array(512), GX = new Float32Array(256), GY = new Float32Array(256);
  const p = new Uint8Array(256);
  for (let i = 0; i < 256; i++) p[i] = i;
  for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = p[i]; p[i] = p[j]; p[j] = t; }
  for (let i = 0; i < 512; i++) P[i] = p[i & 255];
  for (let i = 0; i < 256; i++) { const a = r() * TAU; GX[i] = Math.cos(a); GY[i] = Math.sin(a); }
  return function (x, y) {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, X = xi & 255, Y = yi & 255;
    const a = P[P[X] + Y], b = P[P[X + 1] + Y], c = P[P[X] + Y + 1], d = P[P[X + 1] + Y + 1];
    const u = xf * xf * xf * (xf * (xf * 6 - 15) + 10), v = yf * yf * yf * (yf * (yf * 6 - 15) + 10);
    const n00 = GX[a] * xf + GY[a] * yf, n10 = GX[b] * (xf - 1) + GY[b] * yf;
    const n01 = GX[c] * xf + GY[c] * (yf - 1), n11 = GX[d] * (xf - 1) + GY[d] * (yf - 1);
    const x1 = n00 + (n10 - n00) * u, x2 = n01 + (n11 - n01) * u;
    return (x1 + (x2 - x1) * v) * 1.4;
  };
}

/* A full-frame fbm field (unit-ish std 0.5), computed on a coarse grid and
   bilinearly upsampled. Washes sample it with their own offsets. */
function field(key, scale, oct, step) {
  const nz = gnoise(key), gw = Math.ceil(W / step) + 2, gh = Math.ceil(H / step) + 2, Gd = new Float32Array(gw * gh);
  for (let j = 0; j < gh; j++) for (let i = 0; i < gw; i++) {
    let s = 0, a = 1, f = 1 / scale, nm = 0;
    for (let o = 0; o < oct; o++) { s += a * nz(i * step * f + o * 17.13, j * step * f - o * 9.71); nm += a; a *= .5; f *= 2.03; }
    Gd[j * gw + i] = s / nm;
  }
  let m = 0, m2 = 0;
  for (let i = 0; i < Gd.length; i++) { m += Gd[i]; m2 += Gd[i] * Gd[i]; }
  m /= Gd.length; const sd = Math.sqrt(Math.max(1e-9, m2 / Gd.length - m * m));
  for (let i = 0; i < Gd.length; i++) Gd[i] = (Gd[i] - m) / sd * .5;
  const out = new Float32Array(N);
  for (let y = 0; y < H; y++) {
    const gy = y / step, j = gy | 0, fy = gy - j;
    for (let x = 0; x < W; x++) {
      const gx = x / step, i = gx | 0, fx = gx - i, k = j * gw + i;
      const a = Gd[k] + (Gd[k + 1] - Gd[k]) * fx, b = Gd[k + gw] + (Gd[k + gw + 1] - Gd[k + gw]) * fx;
      out[y * W + x] = a + (b - a) * fy;
    }
  }
  return out;
}

/* Cold-press paper: domain-warped rounded tooth (~5 px), finer grain, slow
   sizing unevenness and a scatter of raised or sunken fibres. 0 = valley. */
function buildPaper() {
  const n1 = gnoise('p1'), n2 = gnoise('p2'), n3 = gnoise('p3'), nw = gnoise('pw'), nl = gnoise('pl');
  const hm = new Float32Array(N);
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const wx = x + 2.6 * nw(x * .05, y * .05), wy = y + 2.6 * nw(x * .05 + 31.3, y * .05 + 7.7);
      const b = Math.tanh(1.15 * n1(wx / 5.2, wy / 5.2));
      hm[y * W + x] = .56 * b + .26 * n2(wx / 2.6, wy / 2.6) + .1 * n3(x / 1.25, y / 1.25) + .12 * nl(x / 110, y / 110);
    }
  }
  const fc = cv(W, H), fx = ctxOf(fc), r = rngFor('fibres');
  fx.fillStyle = 'rgb(128,128,128)'; fx.fillRect(0, 0, W, H); fx.lineCap = 'round';
  for (let i = 0; i < 3200; i++) {
    const x = r() * W, y = r() * H, a = r() * TAU, L = 5 + r() * 30, bend = (r() - .5) * 1.2;
    fx.strokeStyle = r() < .55 ? `rgba(255,255,255,${.3 + r() * .4})` : `rgba(0,0,0,${.25 + r() * .35})`;
    fx.lineWidth = .45 + r() * .8;
    fx.beginPath(); fx.moveTo(x, y);
    fx.quadraticCurveTo(x + Math.cos(a + bend) * L * .5, y + Math.sin(a + bend) * L * .5, x + Math.cos(a) * L, y + Math.sin(a) * L);
    fx.stroke();
  }
  const fd = fx.getImageData(0, 0, W, H).data;
  let s = 0, s2 = 0;
  for (let i = 0; i < N; i++) { s += hm[i]; s2 += hm[i] * hm[i]; }
  const mean = s / N, sd = Math.sqrt(s2 / N - mean * mean);
  for (let i = 0; i < N; i++) hm[i] = clamp(.5 + .19 * (hm[i] - mean) / sd + .16 * (fd[i * 4] - 128) / 128);
  return hm;
}

/* ── separable box blur (2 passes ≈ gaussian) on Float32 arrays ─────────── */
function blurPass(src, dst, w, h, r, horiz) {
  const inv = 1 / (2 * r + 1), L = horiz ? w : h, M = horiz ? h : w, st = horiz ? 1 : w, ls = horiz ? w : 1;
  for (let m = 0; m < M; m++) {
    const b0 = m * ls;
    let acc = 0;
    for (let k = -r - 1; k < r; k++) acc += src[b0 + (k < 0 ? 0 : k > L - 1 ? L - 1 : k) * st];
    for (let i = 0; i < L; i++) {
      const ia = i + r, ib = i - r - 1;
      acc += src[b0 + (ia > L - 1 ? L - 1 : ia) * st] - src[b0 + (ib < 0 ? 0 : ib) * st];
      dst[b0 + i * st] = acc * inv;
    }
  }
}
function blur(src, w, h, r, passes = 2) {
  r = Math.max(1, Math.round(r));
  const a = Float32Array.from(src), b = new Float32Array(src.length);
  for (let p = 0; p < passes; p++) { blurPass(a, b, w, h, r, true); blurPass(b, a, w, h, r, false); }
  return a;
}

/* ── pigments: optical density per channel, granulation ──────────────────── */
const PIG = {
  cer: rgb('#3b8fc4'), ult: rgb('#3d4fa3'), pay: rgb('#3b4656'), sap: rgb('#5a8a2e'), hook: rgb('#2f5f3c'),
  oli: rgb('#737a2c'), och: rgb('#c8993f'), sie: rgb('#a3552f'), rose: rgb('#c9457b'), cady: rgb('#f0c233'),
  cadr: rgb('#c9362b'), vio: rgb('#6d4f94'),
};
const GRANU = { cer: .45, ult: .85, pay: .3, sap: .12, hook: .18, oli: .3, och: .45, sie: .65, rose: .08, cady: .06, cadr: .1, vio: .5 };
function mix(m) {
  const K = [0, 0, 0]; let G = 0, s = 0;
  for (const k in m) {
    const c = PIG[k], w = m[k];
    for (let i = 0; i < 3; i++) K[i] += w * -Math.log(Math.max(c[i], 1) / 255);
    G += w * GRANU[k]; s += w;
  }
  return { K: K.map(v => v / s), G: G / s };
}

/* ── Hobbs deformation ───────────────────────────────────────────────────── */
function deform(P, V, depth, amt, r) {
  for (let d = 0; d < depth; d++) {
    const n = P.length, NP = new Array(n * 2), NV = new Float32Array(n * 2);
    for (let i = 0; i < n; i++) {
      const j = i + 1 < n ? i + 1 : 0, a = P[i], b = P[j], va = V[i], vb = V[j];
      const dx = b[0] - a[0], dy = b[1] - a[1], s = Math.sqrt(dx * dx + dy * dy) * amt * (va + vb) * .5;
      NP[2 * i] = a; NV[2 * i] = va;
      NP[2 * i + 1] = [(a[0] + b[0]) * .5 + gauss(r) * s, (a[1] + b[1]) * .5 + gauss(r) * s];
      NV[2 * i + 1] = (va + vb) * .5 * (.8 + .4 * r());
    }
    P = NP; V = NV;
  }
  return [P, V];
}
function polyArea(P) {
  let a = 0;
  for (let i = 0, n = P.length; i < n; i++) { const p = P[i], q = P[(i + 1) % n]; a += p[0] * q[1] - q[0] * p[1]; }
  return a / 2;
}
function perim(P) { let s = 0; for (let i = 0; i < P.length; i++) { const p = P[i], q = P[(i + 1) % P.length]; s += Math.hypot(q[0] - p[0], q[1] - p[1]); } return s; }
const VNZ = gnoise('vnz');
/* Base polygon: an initial deformation, resampled to edge length E, with a
   spatially coherent variance per vertex (so some edges stay crisp and some bleed). */
function base(pts, key, o = {}) {
  const r = rngFor('b:' + key);
  let P = pts;
  if (o.bdepth) P = deform(P, P.map(() => 1), o.bdepth, o.bamt ?? .22, r)[0];
  const E = Math.max(1.5, Math.min(o.E ?? 12, perim(P) / 10));
  P = resample(P, E, true);
  if (polyArea(P) < 0) P.reverse();
  const vmin = o.vmin ?? .45, vmax = o.vmax ?? 1.6, vf = o.vf ?? .015, ox = r() * 200, oy = r() * 200;
  const V = P.map(([x, y]) => vmin + (vmax - vmin) * clamp(.5 + VNZ(x * vf + ox, y * vf + oy)));
  return { P, V };
}
function bbOf(list, pad) {
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const P of list) for (const p of P) {
    if (p[0] < x0) x0 = p[0]; if (p[0] > x1) x1 = p[0]; if (p[1] < y0) y0 = p[1]; if (p[1] > y1) y1 = p[1];
  }
  x0 = Math.max(0, Math.floor(x0 - pad)); y0 = Math.max(0, Math.floor(y0 - pad));
  x1 = Math.min(W, Math.ceil(x1 + pad)); y1 = Math.min(H, Math.ceil(y1 + pad));
  if (x1 - x0 < 2 || y1 - y0 < 2) return null;
  return { x0, y0, w: x1 - x0, h: y1 - y0 };
}
const bbUnion = (a, b) => {
  if (!a) return b; if (!b) return a;
  const x0 = Math.min(a.x0, b.x0), y0 = Math.min(a.y0, b.y0);
  return { x0, y0, w: Math.max(a.x0 + a.w, b.x0 + b.w) - x0, h: Math.max(a.y0 + a.h, b.y0 + b.h) - y0 };
};

/* Stack the polygons: every layer is a fresh deformation at low alpha.
   o.pick: one base per layer (a graded wash) instead of all of them. */
const SCR = cv(W, H), SX = ctxOf(SCR);
function stack(bases, bb, o = {}) {
  const r = rngFor('s:' + o.key), L = o.layers ?? 32, a = o.alpha ?? .05, dep = o.depth ?? 3, amt = o.amt ?? .3;
  SX.save();
  SX.beginPath(); SX.rect(bb.x0, bb.y0, bb.w, bb.h); SX.clip();
  SX.clearRect(bb.x0, bb.y0, bb.w, bb.h);
  SX.fillStyle = `rgba(0,0,0,${a})`;
  for (let l = 0; l < L; l++) {
    SX.beginPath();
    if (o.pick) { const B = bases[l % bases.length]; trace(SX, deform(B.P, B.V, dep, amt, r)[0], true); }
    else for (const B of bases) trace(SX, deform(B.P, B.V, dep, amt, r)[0], true);
    SX.fill();
  }
  SX.restore();
  const d = SX.getImageData(bb.x0, bb.y0, bb.w, bb.h).data, n = bb.w * bb.h, out = new Float32Array(n);
  const inv = 1 / (255 * (1 - Math.pow(1 - a, o.norm ?? (o.pick ? Math.ceil(L / bases.length) : L))));
  for (let i = 0; i < n; i++) out[i] = d[i * 4 + 3] * inv;
  return out;
}

/* Density → finished wash. Order matters: wet blur, crisp cut, texture and
   masks, then edge darkening (so rims follow masks too), granulation, dry brush. */
function offs(r, lo, span, total) { const mn = -lo, mx = total - lo - span; return mx > mn ? Math.floor(mn + r() * (mx - mn)) : 0; }
function finish(d, bb, o) {
  const w = bb.w, h = bb.h, cnt = w * h, pig = o.pig;
  if (o.wet) d = blur(d, w, h, o.wet);
  if (o.cut) { const c0 = o.cut, c1 = o.cut * 2.5; for (let i = 0; i < cnt; i++) { const v = d[i]; d[i] = v * smooth(c0, c1, v); } }
  const r = rngFor('f:' + o.key), ox = offs(r, bb.x0, w, W), oy = offs(r, bb.y0, h, H);
  const t1 = o.tex ?? .2, t2 = o.tex2 ?? .12, t3 = o.tex3 ?? .05, fn = o.fn;
  for (let y = 0; y < h; y++) {
    const gy = bb.y0 + y, row = gy * W, srow = (gy + oy) * W + ox;
    for (let x = 0; x < w; x++) {
      const i = y * w + x;
      if (!(d[i] > 0)) { d[i] = 0; continue; }
      const gx = bb.x0 + x, si = srow + gx;
      let f = 1 + t1 * NF1[si] + t2 * NF2[si] + t3 * NF3[si];
      if (fn) f *= fn(gx, gy, row + gx, i);
      d[i] = f > 0 ? d[i] * f : 0;
    }
  }
  if (o.edge) {
    const b = blur(d, w, h, o.er ?? 3), e = o.edge;
    for (let i = 0; i < cnt; i++) { const rim = d[i] - b[i]; if (rim > 0) d[i] += e * rim; }
  }
  const Gs = (o.gran ?? 1) * pig.G * .8, dry = o.dry, dfn = o.dryFn, k = o.k ?? .5;
  for (let y = 0; y < h; y++) {
    const gy = bb.y0 + y, row = gy * W, srow = (gy + oy) * W + ox;
    for (let x = 0; x < w; x++) {
      const i = y * w + x; let v = d[i]; if (v <= 0) continue;
      const gi = row + bb.x0 + x, hm = HM[gi], hs = HMS[gi], si = srow + bb.x0 + x;
      // pigment settles in the valleys, patchily (where the wash was wettest)
      const patch = clamp(.55 + .9 * NF1[si] + .5 * NF2[si], .15, 1.4), gv = hs < .5 ? (.5 - hs) * 1.7 : (.5 - hs) * .6;
      v *= 1 + Gs * patch * gv;
      if (dry !== undefined) { const t = dfn ? dfn(bb.x0 + x, gy, v) : dry; v *= smooth(t - .045, t + .045, hm); }
      d[i] = v > 0 ? v * k : 0;
    }
  }
  if (!o.noPaint) composite(d, bb, pig);
  return d;
}

/* Beer-Lambert glaze: the layer holds transmittance exp(-K·d) (white where
   there is no paint) and is multiplied onto the painting. */
const LAY = cv(W, H), LX = ctxOf(LAY);
function composite(d, bb, pig) {
  const K = pig.K, w = bb.w, h = bb.h, id = LX.createImageData(w, h), p = id.data;
  const S = 1024, M = 4 * S, lr = new Uint8ClampedArray(M + 1), lg = new Uint8ClampedArray(M + 1), lb = new Uint8ClampedArray(M + 1);
  for (let i = 0; i <= M; i++) { const v = i / S; lr[i] = 255 * Math.exp(-K[0] * v); lg[i] = 255 * Math.exp(-K[1] * v); lb[i] = 255 * Math.exp(-K[2] * v); }
  for (let i = 0, j = 0, n = w * h; i < n; i++, j += 4) {
    const v = d[i], q = v >= 4 ? M : (v * S + .5) | 0;
    p[j] = lr[q]; p[j + 1] = lg[q]; p[j + 2] = lb[q]; p[j + 3] = 255;
  }
  LX.putImageData(id, bb.x0, bb.y0);
  G2.globalCompositeOperation = 'multiply';
  G2.drawImage(LAY, bb.x0, bb.y0, w, h, bb.x0, bb.y0, w, h);
  G2.globalCompositeOperation = 'source-over';
}

/* One call: polygons → bases → stack → finish. */
function wash(polys, o) {
  const bases = o.bases || polys.map((p, i) => base(p, o.key + ':' + i, o));
  const auto = Math.ceil(2.6 * (o.E ?? 12) * (o.amt ?? .3) * (o.vmax ?? 1.6) + 2 * (o.wet || 0) + 8);
  const bb = o.bb || bbOf(bases.map(b => b.P), Math.max(o.pad ?? 0, auto));
  if (!bb) return null;
  const n = stack(bases, bb, o);
  return { d: finish(n, bb, o), bb };
}

/* Lumpy ellipse (never a perfect circle). */
function blob(cx, cy, rx, ry, key, o = {}) {
  const r = rngFor('blob:' + key), n = o.n ?? 14, lump = o.lump ?? .12, rot = o.rot ?? 0;
  const k1 = 2 + Math.floor(r() * 3), k2 = 4 + Math.floor(r() * 3), p1 = r() * TAU, p2 = r() * TAU, c = Math.cos(rot), s = Math.sin(rot);
  const out = [];
  for (let i = 0; i < n; i++) {
    const t = i / n * TAU, m = 1 + lump * (Math.sin(k1 * t + p1) * .6 + Math.sin(k2 * t + p2) * .4) + (r() - .5) * lump * .6;
    const px = Math.cos(t) * rx * m, py = Math.sin(t) * ry * m;
    out.push([cx + px * c - py * s, cy + px * s + py * c]);
  }
  return out;
}
/* Crescent on an ellipse: outer arc t1→t2, inner edge pulled in by T·sin(). */
function crescent(cx, cy, rx, ry, t1, t2, T, key, o = {}) {
  const r = rngFor('cres:' + key), n = o.n ?? 16, lk = o.lk ?? 5, la = o.la ?? .18, ph = r() * TAU, out = [];
  const rad = o.rad || (() => 1);
  for (let i = 0; i <= n; i++) { const t = t1 + (t2 - t1) * i / n, m = rad(t); out.push([cx + Math.cos(t) * rx * m, cy + Math.sin(t) * ry * m]); }
  for (let i = n - 1; i > 0; i--) {
    const u = i / n, t = t1 + (t2 - t1) * u, m = rad(t);
    const th = T * Math.pow(Math.sin(Math.PI * u), o.pw ?? .7) * (1 + la * Math.sin(lk * t + ph));
    out.push([cx + Math.cos(t) * rx * m * (1 - th), cy + Math.sin(t) * ry * m * (1 - th)]);
  }
  return out;
}

/* Lift pigment back toward the paper (a damp brush or tissue). */
function lift(mask, bb, amount) {
  const img = G2.getImageData(bb.x0, bb.y0, bb.w, bb.h), p = img.data;
  for (let y = 0; y < bb.h; y++) for (let x = 0; x < bb.w; x++) {
    const i = y * bb.w + x, m = mask[i]; if (m <= 0) continue;
    const gi = (bb.y0 + y) * W + bb.x0 + x, a = Math.min(.95, m * amount * (.72 + .28 * HM[gi])), j = i * 4;
    p[j] += (PAPER[0] - p[j]) * a; p[j + 1] += (PAPER[1] - p[j + 1]) * a; p[j + 2] += (PAPER[2] - p[j + 2]) * a;
  }
  G2.putImageData(img, bb.x0, bb.y0);
}

/* Rasterise polygons to a coverage array in bb (solid, anti-aliased). */
function coverage(polys, bb, ctx = SX) {
  ctx.save(); ctx.beginPath(); ctx.rect(bb.x0, bb.y0, bb.w, bb.h); ctx.clip();
  ctx.clearRect(bb.x0, bb.y0, bb.w, bb.h);
  ctx.fillStyle = '#000'; ctx.beginPath();
  for (const P of polys) trace(ctx, P, true);
  ctx.fill(); ctx.restore();
  const d = ctx.getImageData(bb.x0, bb.y0, bb.w, bb.h).data, out = new Float32Array(bb.w * bb.h);
  for (let i = 0; i < out.length; i++) out[i] = d[i * 4 + 3] / 255;
  return out;
}

let HM, HMS, NF1, NF2, NF3;

/* ══ SCENE GEOMETRY ═══════════════════════════════════════════════════════
   Ground plane = canopy top. Camera 120 m above it, level, looking west.
   Screen x = CX + FL·X/Z, y = HZ + FL·(CAM − h)/Z. */
const proj = (X, Z, h = 0) => [CX + FL * X / Z, HZ + FL * (CAM - h) / Z];
const zOpen = y => FL * (CAM + WDROP) / (y - HZ);     // depth of the water plane on row y

/* The tributary: a sine-generated meander (Langbein & Leopold), θ(s) = θ0 + θm·sin(2πs/λ),
   with slowly wandering λ and θm so no two bends are alike. Units: metres. */
const RW = 44;
const RIV = (() => {
  const n1 = gnoise('rv1'), n2 = gnoise('rv2'), n3 = gnoise('rv3'), pts = [];
  let X = 230, Z = 300, s = 0, ph = 3.5;
  const ds = 4;
  while (Z < 34000 && s < 95000) {
    const lam = 520 * (1 + .24 * n1(s / 2600, .3)), thm = .92 * (1 + .18 * n2(s / 1900, .7)), head = -.26 + .08 * n3(s / 7000, .1);
    const th = head + thm * Math.sin(ph), kap = thm * Math.cos(ph) * TAU / lam;

let WALL;
function paintGaps() {

    const hw = FL * 9 / zOpenAt(y);
    for (let k = 1; k <= hw + 2; k++) {
      const j = (y - k) * W + x; if (y - k <= HOR) break;
      if (occ[j] > .6 || OPENV[j] > .5) break;

/* The far bank's forest edge faces the sun (behind us): lit green, trunks and

function paintWall() {

    rp.push(taper([[x - L / 2, y], [x, y + (rr() - .5) * th], [x + L / 2, y + (rr() - .5) * th]], u => (th * .6 + .4) * Math.pow(Math.sin(Math.PI * u), .5)));
  }
  if (rp.length) wash(rp, { key: 'ripples', E: 3, vmin: .5, vmax: 1.2, layers: 10, alpha: .12, depth: 2, amt: .2, tex: .3, dry: .5,
    dryFn: (gx, gy, v) => .6 - .15 * Math.min(1, v), fn: (gx, gy, gi) => WV[gi], gran: 1, k: .3, pig: mix({ och: .4, cer: .3, pay: .3 }) });
  // oxbows: still, greener water with a pale streak of sky
  water('oxbow', sub(OV), mix({ hook: .4, oli: .36, cer: .24 }), .42, { fn: (gx, gy, gi) => 1 - .65 * smooth(.55, .8, .5 + .5 * rn(gx / 25, gy / 3)) });
  // point bars: pale sand, granulating, darker where wet
  const wetEdge = blur(RIVC, W, H, 2, 1);
  water('sand', sub(SV), mix({ och: .68, sie: .22, rose: .1 }), .14, { fn: (gx, gy, gi) => (1 + .6 * smooth(.1, .45, wetEdge[gi])) * (.75 + .5 * smooth(-.3, .4, NF2[gi])), gran: 1.6, edge: .5, cut: 0, wet: 1.5 });
}

/* Cloud shadows on the forest: big, soft, cool; they break the canopy into masses. */
function paintCloudShadows() {
  const spots = [[380, 612, 520, 46, 'cs1'], [1540, 724, 440, 62, 'cs2'], [990, 556, 300, 20, 'cs3'], [70, 880, 330, 100, 'cs4'], [1180, 640, 260, 30, 'cs5'], [760, 700, 330, 44, 'cs6'], [1700, 580, 300, 22, 'cs7']];
  const polys = spots.map(([x, y, rx, ry, k]) => blob(x, y, rx, ry, k, { n: 16, lump: .22 }));
  wash(polys, { key: 'cloudshadow', E: 30, vmin: .6, vmax: 2, layers: 30, alpha: .05, depth: 3, amt: .32, wet: 24, tex: .3, tex2: .15,
    fn: (gx, gy, gi) => 1 - .5 * IPE[gi], gran: 1, k: .36, pig: mix({ ult: .5, vio: .22, cer: .28 }) });
}

/* Morning haze over the far forest, lifted out with a damp brush. */
function liftHaze() {
  const bb = { x0: 0, y0: HOR - 30, w: W, h: 90 }, m = new Float32Array(bb.w * bb.h), n = gnoise('haze');
  for (let y = 0; y < bb.h; y++) for (let x = 0; x < bb.w; x++) {
    const gy = bb.y0 + y, v = smooth(HOR - 26, HOR + 2, gy) * (1 - smooth(HOR + 8, HOR + 58, gy));
    m[y * bb.w + x] = v * (.6 + .4 * (.5 + .5 * n(x / 180, y / 30)));
  }
  lift(m, bb, .3);
}

/* ── transpiration: pale wisps lifted out of the canopy, rising toward the cloud bases ── */
function liftWisps() {
  // only under the big cloud it feeds: soft and broad, never vent-like columns
  const W8 = [[905, 600, 150, -26], [968, 624, 120, -18], [1060, 606, 140, -22], [1180, 616, 150, -28], [1260, 628, 110, -16]];
  const polys = [], r = rngFor('wisps');
  W8.forEach(([x, y, h, lean], k) => {
    const ph = r() * TAU, curl = 8 + r() * 12, np = 6 + Math.floor(h / 30);
    let u = 0;
    for (let i = 0; i < np; i++) {
      u += (.6 + r() * .8) / np; if (u > 1) break;
      if (r() < .22) continue;                                   // gaps: the wisp breaks up
      const px = x + lean * u * u + curl * Math.sin(u * 3.2 + ph) * u + (r() - .5) * 8 * u, py = y - h * u;
      const rr = 3 + 13 * u + 4 * r();
      polys.push(blob(px, py, rr * (.8 + r() * .7), rr * (.5 + r() * .5), 'wp' + k + '_' + i, { n: 10, lump: .35, rot: (r() - .5) * 1.2 }));
    }
    polys.push(blob(x + (r() - .5) * 6, y + 2, 7 + r() * 5, 3 + r() * 2, 'wb' + k, { n: 8, lump: .3 }));   // where it leaves the crowns
  });
  const bases = polys.map((P, i) => base(P, 'wisp' + i, { E: 3, vmin: .7, vmax: 2.2 })), bb = bbOf(bases.map(b => b.P), 40);
  const m = blur(stack(bases, bb, { key: 'wisps', layers: 16, alpha: .07, depth: 3, amt: .36 }), bb.w, bb.h, 11);
  for (let y = 0; y < bb.h; y++) for (let x = 0; x < bb.w; x++) {
    const gy = bb.y0 + y, i = y * bb.w + x;
    m[i] = Math.min(1, m[i] * 1.2) * (1 - .6 * smooth(HOR - 10, HOR - 60, gy));
  }
  lift(m, bb, .24);
}

/* ── fine brush: tapered strokes ──────────────────────────────────────────── */
function brushStroke(pts, w0, key, o = {}) {
  const r = rngFor('bs:' + key), n = gnoise('bsn:' + key), P = resample(pts, 1.2), ph = r() * 50;
  return taper(P, u => w0 * (o.press ?? 1) * (u < .08 ? .55 + .45 * u / .08 : 1) * (1 - (o.lift ?? .6) * smooth(.55, 1, u)) * (1 + .18 * n(u * 6 + ph, .5)));
}
function paintBranches() {
  const r = rngFor('branches'), polys = [];
  for (const t of TREES) {
    const g = t.g; if (!t.ipe) continue;
    const nb = t.ipe ? 5 : 2 + Math.floor(r() * 2), x0 = g.cx - g.rx * .12, y0 = g.cy + g.ry * .55;
    for (let k = 0; k < nb; k++) {
      const a = -Math.PI / 2 + (r() - .5) * 1.9, L = g.ry * (.45 + r() * .35), mx = x0 + Math.cos(a) * L * .5, my = y0 + Math.sin(a) * L * .5;
      const ex = x0 + Math.cos(a) * L, ey = y0 + Math.sin(a) * L;
      polys.push(brushStroke(bezier([x0, y0], [mx - 4, my + 3], [mx + 3, my - 2], [ex, ey], 14), clamp(g.rx / 42, .8, 1.8), 'br' + t.id + k));
      const fa = a + (r() < .5 ? -1 : 1) * (.5 + r() * .4), fl = L * (.3 + r() * .2);
      polys.push(brushStroke([[mx, my], [mx + Math.cos(fa) * fl * .5, my + Math.sin(fa) * fl * .5], [mx + Math.cos(fa) * fl, my + Math.sin(fa) * fl]], clamp(g.rx / 70, .6, 1.1), 'bf' + t.id + k));
    }
  }
  wash(polys, { key: 'branches', E: 2, vmin: .4, vmax: 1, layers: 8, alpha: .2, depth: 2, amt: .15, cut: .15, tex: .2, edge: 1.2, er: 1,
    fn: (gx, gy, gi) => 1 - OPENV[gi], gran: .8, k: .6, pig: mix({ pay: .5, sie: .3, hook: .2 }) });
}

/* ── two scarlet macaws, flying low over the near canopy (lifted, then painted) ── */
function paintMacaws() {
  // ~14 px span: a 1 m bird about 80 m above the canopy, 40 m below us
  const birds = [[334, 948, .22, 1.3, 'up'], [396, 924, .12, 1.22, 'down']];
  const parts = { red: [], yel: [], blu: [], cream: [] }, sil = [];
  const T2 = (pts, w) => taper(resample(pts, .5), w);
  for (const [x, y, head, sc, pose] of birds) {
    const c = Math.cos(head), s2 = -Math.sin(head);
    const at = (f, l) => [x + (c * f - s2 * l) * sc, y + (s2 * f + c * l) * sc];   // f forward, l to the left wing
    const body = [at(-2.5, 0), at(1.5, 0), at(4.5, 0)], tail = [at(-2.5, 0), at(-7, .4), at(-12, .9)];
    parts.red.push(T2(body, u => 1.05 * sc * Math.sin(Math.PI * (.2 + .65 * u)) + .2), T2(tail, u => .75 * sc * (1 - u) + .15));
    parts.blu.push(T2(tail.slice(1).map((p, i) => i ? p : [(tail[1][0] + tail[2][0]) / 2, (tail[1][1] + tail[2][1]) / 2]), u => .45 * sc * (1 - u) + .1));
    const span = pose === 'up' ? 7 : 5.2, sweep = pose === 'up' ? -3.8 : -4.8;
    for (const sd of [-1, 1]) {
      const w = [at(.6, sd * .6), at(.3 + sweep * .15, sd * span * .52), at(sweep, sd * span)];   // bent at the wrist, tips swept back
      parts.red.push(T2([w[0], w[1]], u => 1.1 * sc * (1 - .25 * u)));
      parts.yel.push(T2([w[1], [(w[1][0] * 2 + w[2][0]) / 3, (w[1][1] * 2 + w[2][1]) / 3]], u => .85 * sc));
      parts.blu.push(T2([[(w[1][0] * 2 + w[2][0]) / 3, (w[1][1] * 2 + w[2][1]) / 3], w[2]], u => .8 * sc * (1 - .8 * u) + .1));
      sil.push(T2(w, u => 1.2 * sc));
    }
    parts.cream.push(blob(at(4.6, 0)[0], at(4.6, 0)[1], .8 * sc, .7 * sc, 'mh' + x, { n: 7, lump: .1 }));
    sil.push(T2(body, u => 1.4 * sc), T2(tail, u => .9 * sc * (1 - u) + .3));
  }
  const sb = bbOf(sil, 6), cvg = coverage(sil, sb);
  lift(cvg, sb, .9);
  const paint = (polys, key, pig, k) => wash(polys, { key, E: .8, vmin: .3, vmax: .7, layers: 6, alpha: .25, depth: 1, amt: .08, cut: .1, tex: .15, edge: .8, er: 1, gran: .3, k, pig, pad: 8 });
  paint(parts.yel, 'mac-y', mix({ cady: .9, och: .1 }), .95);
  paint(parts.red, 'mac-r', mix({ cadr: .85, rose: .15 }), 1.2);
  paint(parts.blu, 'mac-b', mix({ ult: .55, cer: .45 }), 1.0);
  paint(parts.cream, 'mac-c', mix({ och: 1 }), .12);
}

/* ── title, lettered with a round brush in indigo ─────────────────────────── */
function paintTitle() {
  const L = lettering('RIVERS IN THE SKY', 96, 112, 38, { align: 'left', key: 'rits', wob: .32, weight: 1.55, track: 2.3 });
  const main = [], tails = [], r = rngFor('title'), pieces = [];
  const ext = (p, q, d) => { const l = Math.hypot(p[0] - q[0], p[1] - q[1]) || 1; return [p[0] + (p[0] - q[0]) / l * d, p[1] + (p[1] - q[1]) / l * d]; };
  for (const st of L.strokes) {
    if (st.length < 2) continue;
    // a brush lifts at a sharp corner: split there, and let the pieces overlap
    let cur = [st[0]];
    for (let i = 1; i < st.length; i++) {
      cur.push(st[i]);
      if (i < st.length - 1) {
        const a = Math.atan2(st[i][1] - st[i - 1][1], st[i][0] - st[i - 1][0]), b2 = Math.atan2(st[i + 1][1] - st[i][1], st[i + 1][0] - st[i][0]);
        let d = Math.abs(b2 - a); if (d > Math.PI) d = TAU - d;
        if (d > .85) { pieces.push(cur); cur = [st[i]]; }
      }
    }
    pieces.push(cur);
  }
  for (const [k, pc] of pieces.entries()) {
    if (pc.length < 2) continue;
    const closed = Math.hypot(pc[0][0] - pc[pc.length - 1][0], pc[0][1] - pc[pc.length - 1][1]) < 1;
    const st = closed ? pc : [ext(pc[0], pc[1], 1.7), ...pc, ext(pc[pc.length - 1], pc[pc.length - 2], 1.4)];
    let P = resample(st, 1.1); const n = P.length; if (n < 3) continue;
    const bow = (r() - .5) * 1.4;      // a hand-drawn stroke is never quite straight
    P = P.map((p, i) => { const q = P[Math.min(n - 1, i + 1)], o = P[Math.max(0, i - 1)], l = Math.hypot(q[0] - o[0], q[1] - o[1]) || 1;
      const b = bow * Math.sin(Math.PI * i / (n - 1)); return [p[0] - (q[1] - o[1]) / l * b, p[1] + (q[0] - o[0]) / l * b]; });
    const w0 = L.lw * .47 * (.88 + r() * .24), pn = gnoise('tp' + k);
    const dirW = P.map((p, i) => { const q = P[Math.min(n - 1, i + 1)], o = P[Math.max(0, i - 1)]; const a = Math.atan2(q[1] - o[1], q[0] - o[0]); return .8 + .3 * Math.abs(Math.sin(a)); });
    const wf = u => { const i = Math.min(n - 1, Math.round(u * (n - 1))); return w0 * dirW[i] * (u < .08 ? .9 + .42 * u / .08 : 1.32 - .5 * u) * (1 + .14 * pn(u * 5, .3)) * (u > .94 ? 1 - (u - .94) * 5 : 1); };
    if (r() < .3 && n > 14) {
      const cutAt = Math.floor(n * .8);
      main.push(taper(P.slice(0, cutAt + 1), u => wf(u * cutAt / (n - 1))));
      tails.push(taper(P.slice(cutAt - 1), u => wf((cutAt - 1 + u * (n - cutAt)) / (n - 1))));
    } else main.push(taper(P, wf));
  }
  const pig = mix({ pay: .62, ult: .3, vio: .08 });
  wash(main, { key: 'title', E: 2, vmin: .4, vmax: 1, layers: 9, alpha: .18, depth: 2, amt: .12, cut: .15, tex: .25, tex2: .1, edge: 1.5, er: 1.5, gran: 1, k: .92, pig, pad: 10 });
  wash(tails, { key: 'title-dry', E: 2, vmin: .4, vmax: 1, layers: 8, alpha: .18, depth: 2, amt: .14, cut: .12, tex: .2, dry: .38,
    dryFn: (gx, gy, v) => .5 - .22 * Math.min(1, v), gran: 1, k: .9, pig, pad: 10 });
}

/* The flying river's far leg, turning south along the foot of the Andes: the
   vapour veils the mountains' feet, so it is lifted out as a pale misty band. */
function liftRibbonFar() {
  const L = RIB.L.filter(p => p.x < 1180), polys = [];
  if (L.length < 3) return;
  polys.push(taper(L.map(p => [p.x, p.y + 2]), u => L[Math.min(L.length - 1, Math.round(u * (L.length - 1)))].w * .42));
  const r = rngFor('farlift');
  for (let k = 0; k < 6; k++) {     // streaks within it
    const o = (r() - .5) * .7, a = Math.floor(r() * L.length * .5), b = Math.min(L.length - 1, a + 8 + Math.floor(r() * L.length * .5));
    const pts = L.slice(a, b).map(p => [p.x, p.y + 2 + o * p.w * .5]);
    if (pts.length > 3) polys.push(taper(pts, u => 1.2 * Math.sin(Math.PI * u) + .4));
  }
  const bases = polys.map((P, i) => base(P, 'rfl' + i, { E: 6, vmin: .6, vmax: 1.8 })), bb = bbOf(bases.map(b => b.P), 30);
  const m = blur(stack(bases, bb, { key: 'rib-far', layers: 16, alpha: .07, depth: 3, amt: .3 }), bb.w, bb.h, 2);
  for (let y = 0; y < bb.h; y++) for (let x = 0; x < bb.w; x++) {
    const i = y * bb.w + x, gi = (bb.y0 + y) * W + bb.x0 + x;
    m[i] = Math.min(1, m[i]) * (1 - .9 * RIB.behind[gi]) * (1 - .8 * CR[gi]) * smooth(HOR + 4, HOR - 6, bb.y0 + y);
  }
  lift(m, bb, .36);
}

function toothShade() {
  const img = G2.getImageData(0, 0, W, H), p = img.data;
  for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) {
    const i = y * W + x, s = HM[i - W - 1] - HM[i + W + 1], v = 1 + s * .028 - (.5 - HM[i]) * .014, j = i * 4;
    p[j] *= v; p[j + 1] *= v; p[j + 2] *= v;
  }
  G2.putImageData(img, 0, 0);
}
/*@@PAINT2@@*/

function draw(g) {
  G2 = g;
  let t = performance.now();
  const tick = k => { const n = performance.now(); T[k] = Math.round(n - t); t = n; };
  NF1 = field('nf1', 260, 3, 8); NF2 = field('nf2', 70, 3, 4); NF3 = field('nf3', 18, 2, 2); tick('fields');
  HM = buildPaper(); HMS = blur(HM, W, H, 1, 1); tick('paper');
  g.fillStyle = css(PAPER); g.fillRect(0, 0, W, H);
  buildClouds(); buildBlooms(); buildRibbon(); buildSnow(); tick('masks');
  paintSky(); tick('sky');
  paintAndes(); tick('andes');
  paintClouds(); tick('clouds');
  paintRibbon(); liftRibbonFar(); tick('ribbon');
  buildGround(); tick('ground');
  paintFarBand(); paintCanopyBase(); tick('canopybase');
  paintTrees(); tick('treesMs');
  paintSlices(); tick('rows');
  paintGaps(); paintWall(); tick('gaps');
  paintRiver(); tick('river');
  paintCloudShadows(); tick('cloudshadow');
  liftHaze();
  liftWisps(); liftSparkle(); tick('wisps');
  paintMacaws();
  paintTitle(); tick('details');
  /*@@CALLS@@*/
  toothShade(); tick('tooth');
  window.__T = T;
}
stillFrame(W, H, draw);

</script>
