<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Snowman · linocut</title>
<style>html,body{margin:0;background:#222}canvas{display:block;width:1280px;height:720px}</style>
<canvas id="c"></canvas>
<script src="kit.js"></script>
<script>
'use strict';
/* SNOWMAN — linocut style frame. Two blocks, black and red, printed on cream
   paper. Every mark is either ink left standing on the block or a gouge cut
   away from it: the black plate is an alpha mask where 'ink' adds and 'cut'
   removes, then both plates get roller and paper texture and are printed
   with multiply, the red slightly out of register.
   Scene: 1994, a hill village at dusk under a full moon. A six-year-old on an
   upturned crate pushes the carrot nose into a snowman taller than his dad. */

const W = 1920, H = 1080, HZ = 580;               // eye level of a child-height camera
const PAPER = rgb('#eee6d2'), BLACK = rgb('#1d191a'), RED = rgb('#c23b2b');
const pxm = y => (y - HZ) / 1.2;                   // px per metre on the ground at screen y

/* ── marks ────────────────────────────────────────────────────────────────── */
function mode(c, m) {
  c.globalCompositeOperation = m === 'cut' ? 'destination-out' : 'source-over';
  c.fillStyle = '#000'; c.strokeStyle = '#000';
}
function shape(c, pts, m = 'ink') { mode(c, m); fillPts(c, pts); }
function disc(c, x, y, r, m = 'ink') { mode(c, m); c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill(); }
/** A carving-tool mark along a polyline. 'v' enters sharp and lifts out long,
 *  'u' is round-ended, 'even' keeps its width (keylines left standing). */
function gouge(c, pts, w, m = 'cut', prof = 'v') {
  const f = prof === 'v' ? s => w * Math.pow(clamp(s / .16), .6) * Math.pow(clamp((1 - s) / .34), .8)
    : prof === 'u' ? s => w * Math.pow(clamp(s / .04), .5) * Math.pow(clamp((1 - s) / .06), .5)
    : prof === 'in' ? s => w * Math.pow(clamp((1 - s) / .5), .7)
    : () => w;
  if (pts.length < 2) return;
  mode(c, m); fillPts(c, taper(pts, f));
  if (prof === 'u' || prof === 'even') { const a = pts[0], b = pts[pts.length - 1]; c.beginPath(); c.arc(a[0], a[1], w, 0, TAU); c.arc(b[0], b[1], w, 0, TAU); c.fill(); }
}
const line = (a, b, n = 12) => Array.from({ length: n + 1 }, (_, i) => [lerp(a[0], b[0], i / n), lerp(a[1], b[1], i / n)]);
function clipped(c, pts, fn) { c.save(); c.beginPath(); trace(c, pts); c.clip(); fn(); c.restore(); }
/** Midpoint-displaced line from a to b: a hand-cut ridge. */
function fractal(a, b, depth, amp, r) {
  if (!depth) return [a];
  const m = [(a[0] + b[0]) / 2 + gauss(r) * amp * .35, (a[1] + b[1]) / 2 + gauss(r) * amp];
  return [...fractal(a, m, depth - 1, amp * .55, r), ...fractal(m, b, depth - 1, amp * .55, r)];
}
/** Offset a closed outline outward by d px (for white separation halos). */
function grow(pts, d) {
  let cx = 0, cy = 0; pts.forEach(p => { cx += p[0]; cy += p[1]; }); cx /= pts.length; cy /= pts.length;
  return pts.map(([x, y]) => { const dx = x - cx, dy = y - cy, l = Math.hypot(dx, dy) || 1; return [x + dx / l * d, y + dy / l * d]; });
}
/** A limb as a closed tapered tube along joints. */
function limb(pts, w0, w1) { return taper(curve(pts, false, 8), s => lerp(w0, w1, s)); }

/* ── sky ──────────────────────────────────────────────────────────────────── */
const MOON = [1640, 150, 70];
const TITLE_BOX = [60, 50, 600, 175];
function sky(k) {
  mode(k, 'ink'); k.fillRect(0, 0, W, 660);
  const [mx, my, mr] = MOON, r = rngFor('sky:rings');
  // moonlight carved as broken rings, thinning outward
  for (let i = 0; i < 9; i++) {
    const rad = mr + 22 + i * 17, w = 3.4 * (1 - i / 10) + .5;
    let a = r() * TAU;
    const end = a + TAU;
    while (a < end) {
      const len = range(r, .25, 1.1) * (1 - i / 14), gap = range(r, .06, .22) + i * .03;
      const pts = [];
      for (let s = 0; s <= 16; s++) { const t = a + len * s / 16, rr = rad + Math.sin(t * 3 + i) * 2; pts.push([mx + Math.cos(t) * rr, my + Math.sin(t) * rr]); }
      if (r() > i * .06) gouge(k, pts, w);
      a += len + gap;
    }
  }
  disc(k, mx, my, mr, 'cut');
  // the moon's seas: a few marks left standing
  const rs = rngFor('moon:seas');
  for (let i = 0; i < 7; i++) {
    const a0 = range(rs, 2.2, 4.1), rr = mr * range(rs, .35, .8), l = range(rs, .25, .55);
    gouge(k, curve([0, .5, 1].map(u => [mx + Math.cos(a0 + u * l) * rr, my + Math.sin(a0 + u * l) * rr]), false, 6), range(rs, 1.4, 3), 'ink');
  }
  // stars: little cross cuts, kept off the moon's halo and the title
  const st = rngFor('sky:stars');
  for (let i = 0; i < 90; i++) {
    const x = st() * W, y = st() * 330, s = range(st, 2, 7);
    if (Math.hypot(x - mx, y - my) < mr + 170) continue;
    if (x > TITLE_BOX[0] - 20 && x < TITLE_BOX[2] + 20 && y > TITLE_BOX[1] - 20 && y < TITLE_BOX[3] + 20) continue;
    if (st() < .45) { disc(k, x, y, s * .28, 'cut'); continue; }
    gouge(k, line([x - s, y], [x + s, y], 4), s * .22, 'cut', 'v');
    gouge(k, line([x, y - s], [x, y + s], 4), s * .22, 'cut', 'v');
  }
}

/* ── mountains ────────────────────────────────────────────────────────────── */
const PEAKS = [[-80, 360], [130, 292], [340, 334], [560, 238], [770, 322], [1000, 180], [1190, 298], [1350, 252], [1560, 352], [1770, 324], [2010, 380]];
function mountains(k) {
  const r = rngFor('mtn');
  const valleys = [];
  for (let i = 0; i < PEAKS.length - 1; i++) {
    const a = PEAKS[i], b = PEAKS[i + 1];
    valleys.push([(a[0] + b[0]) / 2 + range(r, -40, 40), Math.max(a[1], b[1]) + range(r, 28, 70)]);
  }
  const segs = [];     // segs[2i] = peak i → valley i, segs[2i+1] = valley i → peak i+1
  for (let i = 0; i < valleys.length; i++) {
    const p = PEAKS[i], v = valleys[i], q = PEAKS[i + 1];
    segs.push(fractal(p, v, 5, Math.hypot(v[0] - p[0], v[1] - p[1]) * .07, r).concat([v]));
    segs.push(fractal(v, q, 5, Math.hypot(q[0] - v[0], q[1] - v[1]) * .07, r).concat([q]));
  }
  const ridge = segs.flat();
  shape(k, [...ridge, [2010, 700], [-80, 700]], 'cut');
  // each peak's west face lies in shadow, moonlight comes from the upper right
  for (let i = 1; i < PEAKS.length - 1; i++) {
    const P = PEAKS[i], VL = valleys[i - 1];
    const left = segs[2 * i - 1];                          // VL → P
    const B = [P[0] + range(r, -70, 30), 700], G = [VL[0] + range(r, -20, 20), 700];
    const spine = fractal(P, B, 5, 40, r).concat([B]);
    const gully = fractal(G, VL, 4, 18, r).concat([VL]);
    const face = [...left, ...spine.slice(1), ...gully.slice(0, -1)];
    shape(k, face, 'ink');
    // cut hatching down the face: strong under the ridge, fading into solid dark
    const d = [VL[0] - P[0], VL[1] - P[1]], dl = Math.hypot(...d), ux = d[0] / dl, uy = d[1] / dl;
    const nx = uy, ny = -ux;                                // points down into the face
    clipped(k, face, () => {
      gouge(k, left.map(([x, y]) => [x + nx * 3, y + ny * 3]), 2.2, 'cut', 'v');   // the corniced crest catching light
      for (let j = 1; j < 18; j++) {
        const off = 4 + j * 8.5 + range(r, -1.5, 1.5), w = 3.4 * Math.pow(1 - j / 18, 1.3);
        if (w < .45) break;
        let s = -range(r, 0, 60);
        while (s < dl + 40) {
          const len = range(r, 40, 160);
          const a = [P[0] + ux * s + nx * off, P[1] + uy * s + ny * off];
          const b = [a[0] + ux * len, a[1] + uy * len];
          gouge(k, line(a, b, 8).map(([x, y], q) => [x, y + Math.sin(q * .9 + j) * 1.2]), w);
          s += len + range(r, 10, 40);
        }
      }
    });
    for (let j = 0; j < 7; j++) {
      const t = range(r, .15, .85), sx = lerp(VL[0], P[0], t), sy = lerp(VL[1], P[1], t) + range(r, 60, 150), len = range(r, 30, 90);
      clipped(k, face, () => gouge(k, line([sx, sy], [sx - len * .15, sy + len], 6), range(r, 1.2, 2.4), 'cut', 'v'));
    }
    // the lit east face: a few rock marks left standing along the fall line
    const VR = valleys[i];
    for (let j = 0; j < 12; j++) {
      const t = range(r, .05, .7), sx = lerp(P[0], VR[0], t) + range(r, -10, 30), sy = lerp(P[1], VR[1], t) + range(r, 8, 40);
      const len = range(r, 18, 70);
      gouge(k, line([sx, sy], [sx + len * .38, sy + len], 6), range(r, 1, 2.6), 'ink', 'v');
    }
  }
}

/* ── the far forest band and the hill's edge ──────────────────────────────── */
const edgeY = x => 620 + 5 * Math.sin(x / 210) + 4 * Math.sin(x / 77 + 1);
function forestBand(k, rp) {
  const r = rngFor('band');
  mode(k, 'ink'); k.fillRect(0, 596, W, 40);
  for (const [row, base, h0, h1] of [[0, 588, 22, 36], [1, 603, 30, 50]]) {
    for (let x = -10; x < W + 10; x += range(r, 8, 15)) {
      const h = range(r, h0, h1), w = h * range(r, .28, .38), b = base + range(r, -3, 3), tx = x + range(r, -2, 2);
      const pts = [[tx, b - h]];
      for (let t = 1; t <= 4; t++) pts.push([tx + w * t / 4 + (t % 2 ? 2 : -1), b - h + h * t / 4 - (t % 2 ? 0 : h * .08)]);
      for (let t = 4; t >= 1; t--) pts.push([tx - w * t / 4 - (t % 2 ? 2 : -1), b - h + h * t / 4 - (t % 2 ? 0 : h * .08)]);
      shape(k, pts, 'ink');
      for (let t = 1; t <= 3; t++) {         // snow on the tiers
        const y = b - h + h * t / 4 - h * .06, hw = w * t / 4 * .7;
        if (r() < .7) gouge(k, [[tx - hw, y + 1.5], [tx, y - 1], [tx + hw * .8, y + 1]], 1.1, 'cut', 'v');
      }
    }
  }
  // a village across the valley: tiny roofs and lit windows
  for (let i = 0; i < 11; i++) {
    const x = 1420 + i * 32 + range(r, -8, 8), y = 606 + range(r, -6, 4), s = range(r, 5, 8);
    shape(k, [[x - s * 1.3, y], [x, y - s * 1.1], [x + s * 1.3, y]], 'cut');
    mode(rp, 'ink'); rp.fillRect(x - 2, y + 2, 3.4, 3.4);
  }
  // the near slope, carved clean below its edge
  const edge = [];
  for (let x = -10; x <= W + 10; x += 6) edge.push([x, edgeY(x)]);
  shape(k, [...edge, [W + 10, H + 10], [-10, H + 10]], 'cut');
}

/* ── deodars ──────────────────────────────────────────────────────────────── */
function deodar(k, x, base, h, key) {
  const r = rngFor('deodar:' + key), top = base - h, tw = h * .03;
  shape(k, [[x - tw, base + 2], [x - tw * .4, top + h * .12], [x + tw * .4, top + h * .12], [x + tw, base + 2]], 'ink');
  const tiers = Math.round(h / 40), snow = [];
  for (let j = 0; j <= tiers; j++) {
    const u = j / tiers, y = top + h * (.03 + .8 * u);
    const half = h * (.035 + .29 * Math.pow(u, .95)) * range(r, .8, 1.15), th = h * (.04 + .02 * u);
    const lean = range(r, -.08, .08) * half, droop = th * .9;
    const upper = curve([[x - half, y + droop], [x - half * .45 + lean, y - th * .35], [x + lean * .3, y - th], [x + half * .45 + lean, y - th * .35], [x + half, y + droop]], false, 6);
    const lower = [], nc = 2 * (3 + Math.round(half / 22));
    for (let s = 0; s <= nc; s++) {
      const t = s / nc, lx = lerp(x + half, x - half, t), dip = Math.sin(t * Math.PI);
      lower.push([lx + range(r, -2, 2), y + droop - dip * th * .3 + (s % 2 ? th * range(r, .45, 1) : 0)]);
    }
    shape(k, [...upper, ...lower], 'ink');
    snow.push(upper);
  }
  // snow lies along each tier's upper edge
  snow.forEach((up, j) => {
    const rr = rngFor('deodar-snow:' + key + j);
    const band = up.slice(3, up.length - 3), inner = band.map(([px, py], i) => [px, py + range(rr, 3, 7) + (i % 5 === 0 ? 3 : 0)]).reverse();
    shape(k, [...band.map(([px, py]) => [px, py - 1]), ...inner], 'cut');
  });
}

/* ── the house ────────────────────────────────────────────────────────────── */
const DOOR = [190, 514, 265, 680];
function house(k, rp) {
  const r = rngFor('house');
  const apex = [340, 236], eL = [34, 474], eR = [646, 474];
  // walls: kath-kuni timber and stone, dark
  shape(k, [[78, 470], [602, 470], [602, 684], [78, 684]], 'ink');
  // gable facade under the verges: planks
  shape(k, [apex, [598, 470], [82, 470]], 'ink');
  for (let y = 300; y < 470; y += 13) {
    const t = (y - apex[1]) / (470 - apex[1]), hw = 258 * t - 14;
    if (hw > 10) gouge(k, [[340 - hw, y], [340 + hw, y + 1]], 1.6, 'cut', 'v');
  }
  // round gable window, lit
  disc(k, 340, 395, 30, 'cut'); disc(rp, 340, 395, 30, 'ink');
  gouge(k, [[340, 365], [340, 425]], 3, 'ink', 'even'); gouge(k, [[310, 395], [370, 395]], 3, 'ink', 'even');
  mode(k, 'ink'); k.lineWidth = 7; k.beginPath(); k.arc(340, 395, 31, 0, TAU); k.stroke();
  // verges with carved pendants, and the snow riding the roof
  const roof = [eL, [eL[0] - 8, eL[1] - 14], [apex[0], apex[1] - 22], [eR[0] + 8, eR[1] - 14], eR, [eR[0] - 16, eR[1] + 2], [apex[0], apex[1] + 16], [eL[0] + 16, eL[1] + 2]];
  shape(k, roof, 'ink');
  for (let t = .06; t < .98; t += .07) {
    for (const [a, b] of [[apex, eL], [apex, eR]]) {
      const x = lerp(a[0], b[0], t), y = lerp(a[1], b[1], t) + 16;
      shape(k, [[x - 4, y - 2], [x + 4, y - 2], [x + 2, y + 8], [x, y + 12], [x - 2, y + 8]], 'ink');
    }
    for (const [a, b] of [[apex, eL], [apex, eR]]) disc(k, lerp(a[0], b[0], t), lerp(a[1], b[1], t) - 3, 2.2, 'cut');
  }
  const snowTop = [], snowBot = [];
  for (let s = 0; s <= 40; s++) {
    const t = s / 40, side = t < .5 ? eL : eR, u = t < .5 ? 1 - t * 2 : (t - .5) * 2;
    const x = lerp(apex[0], side[0] + (t < .5 ? -14 : 14), u), y = lerp(apex[1] - 22, side[1] - 14, u);
    snowTop.push([x, y - 20 - Math.abs(Math.sin(s * 1.7)) * 6 - range(r, 0, 4)]);
    snowBot.push([x, y + 2]);
  }
  shape(k, [...snowTop, [eR[0] + 24, eR[1] - 2], [eR[0] + 10, eR[1] + 4], ...snowBot.reverse(), [eL[0] - 10, eL[1] + 4], [eL[0] - 24, eL[1] - 2]], 'cut');
  // icicles under the eaves
  for (const [a, b] of [[apex, eL], [apex, eR]]) {
    for (let t = .55; t < 1; t += range(r, .03, .06)) {
      const x = lerp(a[0], b[0], t), y = lerp(a[1], b[1], t) + 30, l = range(r, 8, 30);
      shape(k, [[x - 3, y], [x + 3, y], [x + .5, y + l]], 'cut');
    }
  }
  // chimney and its smoke
  shape(k, [[492, 380], [492, 296], [532, 296], [532, 350]], 'ink');
  for (let y = 305; y < 360; y += 12) gouge(k, [[495, y], [529, y + 1]], 1.2, 'cut', 'u');
  shape(k, [[486, 298], [492, 286], [512, 282], [530, 286], [538, 298]], 'cut');
  const sm = [];
  for (let s = 0; s <= 40; s++) { const t = s / 40; sm.push([512 - t * 60 + Math.sin(t * 9) * 16 * t, 280 - t * 110]); }
  gouge(k, sm, 9, 'cut', 'in');
  gouge(k, sm.map(([x, y], i) => [x + 14 + Math.sin(i * .4) * 3, y + 10]).slice(4, 30), 3.2, 'cut', 'v');
  // balcony: rail and balusters cut out of the timber band
  gouge(k, [[88, 482], [592, 482]], 2.2, 'cut', 'even');
  gouge(k, [[88, 512], [592, 512]], 2.2, 'cut', 'even');
  for (let x = 96; x < 590; x += 11) gouge(k, [[x, 486], [x, 508]], 2.2, 'cut', 'u');
  // stone courses between timber bands on the ground storey
  for (const y of [556, 612]) { gouge(k, [[84, y], [596, y]], 1.4, 'cut', 'even'); gouge(k, [[84, y + 9], [596, y + 9]], 1.4, 'cut', 'even'); }
  for (const [y0, y1] of [[520, 552], [570, 608], [626, 684]]) {
    let x = 84 + range(r, 0, 20);
    for (let row = y0; row < y1 - 6; row += 17) {
      x = 84 + range(r, 0, 26);
      while (x < 590) {
        const w = range(r, 26, 52), hgt = Math.min(15, y1 - row - 2);
        gouge(k, [[x, row + 2], [x + w, row + 1.5], [x + w, row + hgt], [x, row + hgt], [x, row + 2]], .9, 'cut', 'even');
        x += w + 5;
      }
    }
  }
  // lit door with the father in it, waving
  const [dx0, dy0, dx1, dy1] = DOOR;
  shape(k, [[dx0, dy0], [dx1, dy0], [dx1, dy1], [dx0, dy1]], 'cut');
  mode(rp, 'ink'); rp.fillRect(dx0, dy0, dx1 - dx0, dy1 - dy0);
  mode(k, 'ink'); k.lineWidth = 9; k.strokeRect(dx0 - 4, dy0 - 4, dx1 - dx0 + 8, dy1 - dy0 + 8);
  for (let x = dx0 - 4; x < dx1 + 4; x += 9) gouge(k, [[x, dy0 - 10], [x + 4, dy0 - 10]], 1.8, 'cut', 'u');
  father(k, 227, 680);
  // window beside the door
  for (const [x0, y0, w, h] of [[330, 540, 86, 70], [470, 540, 60, 62]]) {
    shape(k, [[x0, y0], [x0 + w, y0], [x0 + w, y0 + h], [x0, y0 + h]], 'cut');
    mode(rp, 'ink'); rp.fillRect(x0, y0, w, h);
    mode(k, 'ink'); k.lineWidth = 8; k.strokeRect(x0 - 4, y0 - 4, w + 8, h + 8);
    gouge(k, [[x0 + w / 2, y0], [x0 + w / 2, y0 + h]], 2.6, 'ink', 'even');
    gouge(k, [[x0, y0 + h * .45], [x0 + w, y0 + h * .45]], 2.6, 'ink', 'even');
    shape(k, [[x0 - 10, y0 + h + 4], [x0 + w + 10, y0 + h + 4], [x0 + w + 6, y0 + h - 4], [x0 + w / 2, y0 + h - 7], [x0 - 6, y0 + h - 4]], 'cut');
  }
  // woodpile against the wall
  for (let row = 0; row < 4; row++) for (let i = 0; i < 6 - (row > 1 ? 1 : 0); i++) {
    const x = 486 + i * 19 + (row % 2) * 9, y = 672 - row * 17, rr = range(r, 7.5, 9.5);
    disc(k, x, y, rr + 2.2, 'ink'); disc(k, x, y, rr - .5, 'cut'); disc(k, x, y, rr * .45, 'ink'); disc(k, x, y, rr * .18, 'cut');
  }
  // drifts banked against the wall and the doorstep
  const drift = [[60, 690]];
  for (let x = 60; x <= 624; x += 12) {
    const nearDoor = x > dx0 - 20 && x < dx1 + 20;
    drift.push([x, (nearDoor ? 676 : 652 + Math.sin(x / 37) * 7 + Math.sin(x / 11) * 2.5)]);
  }
  drift.push([624, 690]);
  shape(k, drift, 'cut');
  gouge(k, [[dx0 - 16, 680], [dx1 + 16, 681]], 2.4, 'ink', 'v');
}
function father(k, x, base) {
  // backlit, so a plain dark cut-out: 1.75 m at the house's depth
  const s = pxm(base) * 1.75 / 100;       // units: percent of height
  const P = (u, v) => [x + u * s, base - v * s];
  shape(k, [P(-7, 0), P(-8, 44), P(-12, 50), P(-12, 78), P(-8, 83), P(8, 83), P(12, 78), P(12, 50), P(8, 44), P(7, 0), P(2, 0), P(0, 40), P(-2, 0)], 'ink');
  shape(k, ellipsePts(x, base - 90 * s, 6.5 * s, 7.5 * s, 20), 'ink');
  shape(k, limb([P(10, 79), P(20, 88), P(22, 106)], 3.4 * s, 2.8 * s), 'ink');   // waving arm
  shape(k, ellipsePts(x + 22 * s, base - 108 * s, 3.2 * s, 3.8 * s, 12), 'ink');
  shape(k, limb([P(-10, 79), P(-13, 64), P(-12, 51)], 3.4 * s, 2.8 * s), 'ink');
}

/* ── fence ────────────────────────────────────────────────────────────────── */
function fence(k) {
  const r = rngFor('fence');
  const posts = [[1486, 780], [1606, 744], [1712, 716], [1800, 697], [1876, 682], [1944, 670]].map(([x, y]) => ({ x, y, h: 1.15 * pxm(y), w: .11 * pxm(y) }));
  for (let i = 0; i < posts.length - 1; i++) {
    const a = posts[i], b = posts[i + 1];

/* ── printing ─────────────────────────────────────────────────────────────── */
