<script>
'use strict';
/* ═══ THE SCARF · style frame ══════════════════════════════════════════════════
   A felt-and-yarn diorama photographed flat: felt cut-outs with fibre texture,
   embroidery (running, back, blanket, cross stitch, French knots), yarn hair
   and a stockinette scarf whose 76 rows are the warming stripes, 1950–2025. */

/* ── 1. Data ──────────────────────────────────────────────────────────────────
   APPROXIMATE annual global-mean temperature anomalies (°C, relative to
   1951–1980), GISTEMP-like, typed FROM MEMORY for this pitch frame only.
   They are NOT the dataset: replace them with the real NASA GISTEMP v4 annual
   means before the film is made. One knitted row per year. */
const YEAR0 = 1950;
const ANOM = [
  -0.17, -0.07, 0.01, 0.08, -0.13, -0.14, -0.19, 0.05, 0.06, 0.03,   // 1950s
  -0.03, 0.06, 0.03, 0.05, -0.20, -0.11, -0.06, -0.02, -0.08, 0.05,  // 1960s
  0.03, -0.08, 0.01, 0.16, -0.07, -0.01, -0.10, 0.18, 0.07, 0.16,    // 1970s
  0.26, 0.32, 0.14, 0.31, 0.16, 0.12, 0.18, 0.32, 0.39, 0.27,        // 1980s
  0.45, 0.40, 0.22, 0.23, 0.31, 0.45, 0.33, 0.46, 0.61, 0.38,        // 1990s
  0.39, 0.54, 0.63, 0.62, 0.53, 0.68, 0.64, 0.66, 0.54, 0.65,        // 2000s
  0.72, 0.61, 0.65, 0.68, 0.75, 0.90, 1.01, 0.92, 0.85, 0.98,        // 2010s
  1.01, 0.85, 0.89, 1.17, 1.28, 1.19,                                // 2020–2025
];
/* Warming-stripes convention (Ed Hawkins): subtract the 1971–2000 mean
   (≈ 0.234 for the values above), map onto 16 steps over −0.75…+0.75 °C,
   clamped. 8 blues dark→light, then 8 reds light→dark. */
const BASELINE = ANOM.slice(1971 - YEAR0, 2001 - YEAR0).reduce((s, a) => s + a, 0) / 30;
const STRIPE_HEX = ['#08306b', '#08519c', '#2171b5', '#4292c6', '#6baed6', '#9ecae1', '#c6dbef', '#deebf7',
  '#fee0d2', '#fcbba1', '#fc9272', '#fb6a4a', '#ef3b2c', '#cb181d', '#a50f15', '#67000d'];
const STRIPE_RGB = STRIPE_HEX.map(rgb);
const ROW_CI = ANOM.map(a => clamp(Math.floor((a - BASELINE + 0.75) / 1.5 * 16), 0, 15));
const NROWS = ANOM.length; // 76

/* ── 2. Geometry helpers ──────────────────────────────────────────────────── */
const vadd = (a, b) => [a[0] + b[0], a[1] + b[1]];
const vsub = (a, b) => [a[0] - b[0], a[1] - b[1]];
const vmul = (a, s) => [a[0] * s, a[1] * s];
const vlen = a => Math.hypot(a[0], a[1]);
const vnorm = a => { const l = Math.hypot(a[0], a[1]) || 1; return [a[0] / l, a[1] / l]; };
const vlerp = (a, b, u) => [a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u];
const blob = (ctrl, per = 8) => curve(ctrl, true, per);
const open = (ctrl, per = 8) => curve(ctrl, false, per);
function rotPts(pts, cx, cy, a) {
  const c = Math.cos(a), s = Math.sin(a);
  return pts.map(([x, y]) => [cx + (x - cx) * c - (y - cy) * s, cy + (x - cx) * s + (y - cy) * c]);
}
const rotP = (p, cx, cy, a) => rotPts([p], cx, cy, a)[0];
function rrect(x, y, w, h, r) {
  const q = [];
  const arc = (cx, cy, a0) => { for (let i = 0; i <= 6; i++) { const a = a0 + i / 6 * Math.PI / 2; q.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); } };
  arc(x + w - r, y + r, -Math.PI / 2); arc(x + w - r, y + h - r, 0); arc(x + r, y + h - r, Math.PI / 2); arc(x + r, y + r, Math.PI);
  return q;
}
function pathOf(pts, closed = true) {
  const p = new Path2D(); p.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) p.lineTo(pts[i][0], pts[i][1]);
  if (closed) p.closePath();
  return p;
}
function bboxOf(pts) {
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const [x, y] of pts) { if (x < x0) x0 = x; if (y < y0) y0 = y; if (x > x1) x1 = x; if (y > y1) y1 = y; }
  return [x0, y0, x1, y1];
}
function areaOf(pts) { let s = 0; for (let i = 0; i < pts.length; i++) { const a = pts[i], b = pts[(i + 1) % pts.length]; s += a[0] * b[1] - b[0] * a[1]; } return s / 2; }
function polyLen(pts) { let s = 0; for (let i = 1; i < pts.length; i++) s += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); return s; }
/** Point at arc fraction u along an open polyline. */
function along(pts, u) {
  const L = polyLen(pts) * clamp(u); let s = 0;
  for (let i = 1; i < pts.length; i++) {
    const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
    if (s + d >= L) return vlerp(pts[i - 1], pts[i], d ? (L - s) / d : 0);
    s += d;

  return pts[pts.length - 1].slice();
}
const dark = (c, u) => mixc(c, [18, 8, 4], u);
const light = (c, u) => mixc(c, [255, 250, 240], u);
const col3 = c => Array.isArray(c) ? c : rgb(c);

/* ── 3. Felt textures (built once, tiled) ─────────────────────────────────── */
const TEXN = 1024;
let TEX = null;
function buildTextures() {
  const N = TEXN, r = rngFor('tex:fibres');
  // Fibres: short curved hairs, light and dark, wrapped so the tile repeats.
  const fib = cv(N, N), g = ctxOf(fib);
  g.lineCap = 'round';
  const batches = [['255,250,240', .5, .85, 15000], ['255,250,240', .28, .6, 20000],
    ['20,10,5', .42, .85, 15000], ['20,10,5', .24, .6, 20000], ['255,250,240', .65, 1.1, 2500]];
  for (const [c, a, w, n] of batches) {
    g.strokeStyle = `rgba(${c},${a})`; g.lineWidth = w; g.beginPath();
    for (let i = 0; i < n; i++) {
      const x = r() * N, y = r() * N, an = r() * TAU, len = 2.5 + r() * r() * (w > 1 ? 16 : 10), bend = (r() - .5) * 1.1;
      const dx = Math.cos(an) * len / 2, dy = Math.sin(an) * len / 2, mx = -dy * bend, my = dx * bend;
      for (const ox of [0, -N, N]) for (const oy of [0, -N, N]) {
        const X = x + ox, Y = y + oy;
        if (X + len < 0 || X - len > N || Y + len < 0 || Y - len > N) continue;
        g.moveTo(X - dx, Y - dy); g.quadraticCurveTo(X + mx, Y + my, X + dx, Y + dy);
      }
    }
    g.stroke();
  }
  // Mottle: tileable low-frequency density variation (felt is never even).
  const M = 128, nz = makeNoise('tex:mottle'), F = 7;
  const small = cv(M * 3, M * 3), sg = ctxOf(small), id = sg.createImageData(M, M);
  const tn = (x, y, P) => { const u = x / P, v = y / P; return nz(x, y) * (1 - u) * (1 - v) + nz(x - P, y) * u * (1 - v) + nz(x, y - P) * (1 - u) * v + nz(x - P, y - P) * u * v; };
  for (let y = 0; y < M; y++) for (let x = 0; x < M; x++) {
    const X = x / M * F, Y = y / M * F;
    const v = tn(X, Y, F) * .65 + tn(X * 2 % (F * 2), Y * 2 % (F * 2), F * 2) * .35;
    const k = (y * M + x) * 4, a = Math.min(1, Math.abs(v) * 1.6);
    const c = v > 0 ? 255 : 0; id.data[k] = c; id.data[k + 1] = c * .97; id.data[k + 2] = c * .92; id.data[k + 3] = a * 255;
  }
  for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) sg.putImageData(id, i * M, j * M);
  const mot = cv(N, N), mg = ctxOf(mot);
  mg.imageSmoothingEnabled = true; mg.imageSmoothingQuality = 'high';
  mg.drawImage(small, M - 1, M - 1, M + 2, M + 2, -N / M, -N / M, N + 2 * N / M, N + 2 * N / M);
  // Grain: per-pixel photographic noise.
  const G = 256, grain = cv(G, G), gg = ctxOf(grain), gd = gg.createImageData(G, G), rg = rngFor('tex:grain');
  for (let i = 0; i < G * G; i++) { const v = rg(); const c = v > .5 ? 255 : 0; gd.data[i * 4] = gd.data[i * 4 + 1] = gd.data[i * 4 + 2] = c; gd.data[i * 4 + 3] = Math.abs(v - .5) * 2 * 60; }
  gg.putImageData(gd, 0, 0);
  TEX = { fib, mot, grain };
}
const PATS = new WeakMap();
function pats(g) {
  let p = PATS.get(g);
  if (!p) { p = { fib: g.createPattern(TEX.fib, 'repeat'), mot: g.createPattern(TEX.mot, 'repeat'), grain: g.createPattern(TEX.grain, 'repeat') }; PATS.set(g, p); }
  return p;
}
/** Fill the clip region with tiled texture at a seeded offset. */
function texFill(g, which, bb, alpha, key, op) {
  const r = rngFor('tex:' + key), ox = Math.floor(r() * TEXN), oy = Math.floor(r() * TEXN);
  g.save(); g.globalAlpha = alpha; if (op) g.globalCompositeOperation = op; g.translate(ox, oy); g.fillStyle = pats(g)[which];
  g.fillRect(bb[0] - ox - 4, bb[1] - oy - 4, bb[2] - bb[0] + 8, bb[3] - bb[1] + 8);
  g.restore();
}

/* ── 4. Felt ──────────────────────────────────────────────────────────────── */
/** A scissor-cut outline: evenly resampled, gently irregular. */
function cutEdge(pts, key, amp = 1.3) {
  const R = resample(pts, 3.5, true), w = wobble(R, amp, key, .045), r = rngFor('cut:' + key);
  return w.map(([x, y]) => [x + (r() - .5) * .5, y + (r() - .5) * .5]);
}
function dropShadow(g, path, dx = 3, dy = 5, blur = 5, a = .32) {
  g.save(); g.filter = `blur(${blur}px)`; g.fillStyle = `rgba(40,22,10,${a})`; g.translate(dx, dy); g.fill(path); g.restore();
}
/** Stray fibres escaping a felt edge. */
function strayFibres(g, P, base, key, dens = 1) {
  const r = rngFor('stray:' + key), n = P.length, sgn = areaOf(P) > 0 ? 1 : -1;
  const per = Math.round(polyLen(P) / 26 * dens);
  g.save(); g.lineCap = 'round';
  for (let i = 0; i < per; i++) {
    const k = Math.floor(r() * n), p = P[k], q = P[(k + 1) % n];
    const t = vnorm(vsub(q, p)), out = [t[1] * sgn, -t[0] * sgn];
    const L = 3 + r() * r() * 11, s = (r() - .5) * 1.4;
    const a = vadd(p, vmul(out, -1.5)), e = vadd(vadd(p, vmul(out, L * .8)), vmul(t, L * s));
    const m = vadd(vlerp(a, e, .5), vmul(t, (r() - .5) * 4));
    g.strokeStyle = css(r() < .5 ? light(base, .18) : dark(base, .12), .75); g.lineWidth = .55 + r() * .4;
    g.beginPath(); g.moveTo(a[0], a[1]); g.quadraticCurveTo(m[0], m[1], e[0], e[1]); g.stroke();
  }

}
/** A felt cut-out: drop shadow, colour, mottle, fibres, puffy edges, strays.
 *  o: shadow/sx/sy/sb/sa, wob, raw, fib, mot, ew/eb/ea (edge shading), hl,
 *     inner(g, bb) for printed/dyed detail drawn under the fibres, stray. */
function felt(g, pts, color, key, o = {}) {
  const base = col3(color), P = o.raw ? pts : cutEdge(pts, key, o.wob ?? 1.3), path = pathOf(P), bb = bboxOf(P);
  if (o.shadow !== false) dropShadow(g, path, o.sx ?? 3, o.sy ?? 5, o.sb ?? 5, o.sa ?? .32);
  g.save();
  g.fillStyle = css(base); g.fill(path); g.clip(path);
  if (o.inner) o.inner(g, bb, base);
  texFill(g, 'mot', bb, o.mot ?? .22, 'm' + key);
  texFill(g, 'fib', bb, o.fib ?? 1, 'f' + key, 'soft-light');
  texFill(g, 'fib', bb, (o.fib ?? 1) * .16, 'f' + key);
  if (o.hl !== 0) {
    const w = bb[2] - bb[0], h = bb[3] - bb[1], R = Math.max(w, h) * .75;
    const gr = g.createRadialGradient(bb[0] + w * .32, bb[1] + h * .28, 0, bb[0] + w * .32, bb[1] + h * .28, R);
    gr.addColorStop(0, `rgba(255,248,230,${o.hl ?? .12})`); gr.addColorStop(1, 'rgba(255,248,230,0)');

  }
  g.filter = `blur(${o.eb ?? 5}px)`;
  g.strokeStyle = css(dark(base, .55), o.ea ?? .5); g.lineWidth = o.ew ?? 9; g.stroke(path);
  g.restore();
  if (o.stray !== 0) strayFibres(g, P, base, key, o.stray ?? 1);
  return { P, path, bb, base };
}

/* ── 5. Embroidery ────────────────────────────────────────────────────────── */
/** One stitch of twisted floss from a to b. */
function stitch(g, a, b, color, w = 1.6, o = {}) {
  const c = col3(color), dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy) || 1, tx = dx / L, ty = dy / L;
  g.lineCap = 'round';
  g.strokeStyle = `rgba(30,15,5,${o.sa ?? .38})`; g.lineWidth = w + .9;
  g.beginPath(); g.moveTo(a[0] + .5, a[1] + .9); g.lineTo(b[0] + .5, b[1] + .9); g.stroke();
  g.strokeStyle = css(dark(c, .12)); g.lineWidth = w;
  g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke();
  const n = Math.max(1, Math.round(L / (w * 1.25))), h = w * .42;
  g.strokeStyle = css(light(c, .5), .8); g.lineWidth = Math.max(.45, w * .34); g.beginPath();
  for (let i = 0; i < n; i++) {
    const u = (i + .5) / n, cx = a[0] + dx * u, cy = a[1] + dy * u;
    g.moveTo(cx - tx * h * .7 + ty * h, cy - ty * h * .7 - tx * h); g.lineTo(cx + tx * h * .7 - ty * h, cy + ty * h * .7 + tx * h);
  }

}
/** Running stitch (len on, gap off) or backstitch (gap ≈ 0) along a polyline. */
function running(g, pts, color, o = {}) {
  const len = o.len ?? 7, gap = o.gap ?? 5, w = o.w ?? 1.6, R = resample(pts, 1, !!o.closed), r = rngFor('run:' + (o.key || '') + pts.length);
  if (o.closed) R.push(R[0]);
  let i = Math.round(o.phase ?? 0);
  while (i < R.length - 2) {
    const j = Math.min(R.length - 1, i + Math.max(2, Math.round(len + (r() - .5) * 1.4)));
    stitch(g, R[i], R[j], color, w, o);
    i = j + Math.max(0, Math.round(gap + (r() - .5) * 1.2));

}
const backstitch = (g, pts, color, o = {}) => running(g, pts, color, { len: 6, gap: 0.6, ...o });
/** French knot: a tight bump of wrapped floss. */
function knot(g, x, y, r, color, key = '') {
  const c = col3(color), rr = rngFor('knot:' + key + x.toFixed(1) + y.toFixed(1));
  g.save();
  g.fillStyle = 'rgba(30,15,5,.45)'; g.beginPath(); g.arc(x + r * .3, y + r * .45, r * 1.1, 0, TAU); g.fill();
  g.fillStyle = css(dark(c, .25)); g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
  g.lineCap = 'round'; g.lineWidth = r * .42;
  for (let k = 0; k < 3; k++) {
    const a0 = rr() * TAU; g.strokeStyle = css(k === 2 ? light(c, .15) : c);
    g.beginPath(); g.ellipse(x, y, r * .72, r * .42, a0, 0, Math.PI * 1.25); g.stroke();
  }
  g.strokeStyle = css(light(c, .6), .85); g.lineWidth = r * .24;
  g.beginPath(); g.arc(x - r * .1, y - r * .1, r * .55, Math.PI * 1.05, Math.PI * 1.6); g.stroke();
  g.restore();
}
/** Blanket stitch around a closed outline (legs point inward). */
function blanket(g, pts, color, o = {}) {
  const sp = o.sp ?? 10, d = o.d ?? 7, w = o.w ?? 1.5, R = resample(pts, sp, true), n = R.length, sgn = areaOf(pts) > 0 ? 1 : -1;
  for (let i = 0; i < n; i++) {
    const p = R[i], q = R[(i + 1) % n], t = vnorm(vsub(q, p)), inn = [-t[1] * sgn, t[0] * sgn];
    stitch(g, vadd(p, vmul(inn, -1)), vadd(p, vmul(inn, d)), color, w, o);
    stitch(g, vadd(p, vmul(inn, -1)), vadd(q, vmul(inn, -1)), color, w, o);

/** One cross stitch centred at (x, y) in a cell of size s. */
function xstitch(g, x, y, s, color, w) {
  const h = s * .4; w = w ?? s * .3;
  stitch(g, [x - h, y + h], [x + h, y - h], color, w, { sa: .3 });
  stitch(g, [x - h, y - h], [x + h, y + h], color, w, { sa: .3 });

/* ── 6. Yarn ──────────────────────────────────────────────────────────────── */
/** A soft yarn strand (hair): shadow, body, highlight. */
function strand(g, pts, color, w, o = {}) {
  const c = col3(color), P = pts.length > 2 ? open(pts, 6) : pts;
  g.save(); g.lineCap = 'round'; g.lineJoin = 'round';
  if (o.shadow !== false) {
    g.strokeStyle = css(dark(c, .6), o.sa ?? .45); g.lineWidth = w + 1.3;
    g.beginPath(); trace(g, P.map(([x, y]) => [x + .7, y + 1.1]), false); g.stroke();
  }
  g.strokeStyle = css(c); g.lineWidth = w; g.beginPath(); trace(g, P, false); g.stroke();
  g.strokeStyle = css(light(c, o.hi ?? .38), .6); g.lineWidth = Math.max(.5, w * .32);

/** Plied yarn (the working yarn, fringe): body with a twist and fuzz. */
function plied(g, pts, color, w, key) {
  const c = col3(color), P = resample(pts.length > 2 ? open(pts, 10) : pts, 1), r = rngFor('ply:' + key);
  g.save(); g.lineCap = 'round'; g.lineJoin = 'round';
  g.strokeStyle = 'rgba(30,12,6,.35)'; g.lineWidth = w + 1.5; g.beginPath(); trace(g, P.map(([x, y]) => [x + 1.2, y + 2]), false); g.stroke();
  g.strokeStyle = css(c); g.lineWidth = w; g.beginPath(); trace(g, P, false); g.stroke();
  const step = Math.max(2, w * .9);
  for (let s = step / 2; s < P.length - 1; s += step) {
    const i = Math.floor(s), a = P[Math.max(0, i - 1)], b = P[Math.min(P.length - 1, i + 1)], t = vnorm(vsub(b, a)), nn = [-t[1], t[0]], p = P[i], h = w * .5;

    g.beginPath(); g.moveTo(p[0] + nn[0] * h - t[0] * h * .8, p[1] + nn[1] * h - t[1] * h * .8); g.lineTo(p[0] - nn[0] * h + t[0] * h * .8, p[1] - nn[1] * h + t[1] * h * .8); g.stroke();
    g.strokeStyle = css(light(c, .35), .55); g.lineWidth = Math.max(.5, w * .2);
    const q = vadd(p, vmul(t, step * .45));
    g.beginPath(); g.moveTo(q[0] + nn[0] * h * .6 - t[0] * h * .5, q[1] + nn[1] * h * .6 - t[1] * h * .5); g.lineTo(q[0] - nn[0] * h * .2 + t[0] * h * .3, q[1] - nn[1] * h * .2 + t[1] * h * .3); g.stroke();
  }
  g.strokeStyle = css(light(c, .3), .45); g.lineWidth = .6;
  for (let s = 0; s < P.length; s += 5) {
    if (r() > .5) continue;
    const p = P[Math.floor(s)], an = r() * TAU, L = 2 + r() * 5;
    g.beginPath(); g.moveTo(p[0], p[1]); g.lineTo(p[0] + Math.cos(an) * (w * .5 + L), p[1] + Math.sin(an) * (w * .5 + L)); g.stroke();

/* ── 7. The knitted scarf ─────────────────────────────────────────────────────
   The scarf is a ribbon: a centre path plus a half-width. at(u, v) maps arc
   length u (px) and the across-coordinate v ∈ [−1, 1] (+1 = upper edge) into
   the picture, so every stitch is placed and turned in the ribbon's own frame
   and the knit follows the sags. Rows run across the ribbon, one per year;
   stitches are stockinette Vs pointing back toward the cast-on edge. */
function makeRibbon(ctrl, halfW, fold) {
  const P = resample(open(ctrl, 40), 1), n = P.length, T = new Array(n), N = new Array(n);
  for (let i = 0; i < n; i++) {
    const a = P[Math.max(0, i - 5)], b = P[Math.min(n - 1, i + 5)], t = vnorm(vsub(b, a));
    T[i] = t; N[i] = [t[1], -t[0]];
  }

  const idx = u => { const x = clamp(u, 0, L), i = Math.min(L - 1, Math.floor(x)); return [i, x - i]; };
  /* fold(u) → [vk, c, c2]: above v = vk the cloth lies on the lap, seen from

  const rb = {

    nrm(u) { const [i, f] = idx(u); return vnorm(vlerp(N[i], N[i + 1], f)); },
    tan(u) { const [i, f] = idx(u); return vnorm(vlerp(T[i], T[i + 1], f)); },
    at(u, v) { const p = rb.pos(u), m = rb.nrm(u), w = halfW(u) * fv(u, v); return [p[0] + m[0] * w, p[1] + m[1] * w]; },

/* One leg of a knit V, pre-rendered per yarn colour: a plump plied loop with a

const LEG_W = 96, LEG_H = 48, LEG_FX = .76, LEG_FY = .64;
function buildLeg(col, key) {
  const c = cv(LEG_W, LEG_H), g = ctxOf(c), r = rngFor('leg:' + key);
  const cx = LEG_W / 2, cy = LEG_H / 2, a = LEG_W * LEG_FX / 2, b = LEG_H * LEG_FY / 2;
  const body = new Path2D();
  for (let i = 0; i <= 56; i++) {
    const th = i / 56 * TAU, cs = Math.cos(th), sn = Math.sin(th);
    const x = cx + a * Math.sign(cs) * Math.pow(Math.abs(cs), .92), y = cy + b * sn * (1 + .1 * cs);
    i ? body.lineTo(x, y) : body.moveTo(x, y);
  }

  const lum = (.3 * col[0] + .59 * col[1] + .11 * col[2]) / 255;
  // halo of loose fibres
  g.lineCap = 'round';
  for (let i = 0; i < 90; i++) {
    const th = r() * TAU, ex = cx + Math.cos(th) * a * .9, ey = cy + Math.sin(th) * b * .92;
    const an = Math.atan2(Math.sin(th) * a, Math.cos(th) * b) + (r() - .5) * 1.9, L = 5 + r() * r() * 16;
    g.strokeStyle = css(light(col, .12 + r() * .25), .3 + r() * .3); g.lineWidth = 1.1 + r() * .9;
    g.beginPath(); g.moveTo(ex, ey);
    g.quadraticCurveTo(ex + Math.cos(an) * L * .5 + (r() - .5) * 5, ey + Math.sin(an) * L * .5 + (r() - .5) * 5, ex + Math.cos(an) * L, ey + Math.sin(an) * L);
    g.stroke();

  gr.addColorStop(0, css(light(col, lum > .75 ? .35 : .2)));

  ge.addColorStop(.8, css(dark(col, .6), 0)); ge.addColorStop(1, css(dark(col, .75), .75));
  g.fillStyle = ge; g.fillRect(0, 0, LEG_W, LEG_H);
  // plies: diagonal twist bands
  const nP = 6, ph = r(), sl = b * 1.25;
  for (let k = -2; k < nP + 2; k++) {
    const x = cx - a + (k + ph) * (2 * a / nP);
    g.strokeStyle = css(dark(col, .55), .55); g.lineWidth = 2.2;
    g.beginPath(); g.moveTo(x - sl, cy + b * 1.1); g.quadraticCurveTo(x - sl * .1, cy + b * .2, x + sl * .9, cy - b * 1.1); g.stroke();
    g.strokeStyle = css(light(col, lum > .75 ? .6 : .42), .42); g.lineWidth = 2.6;
    const x2 = x + a / nP * .9;
    g.beginPath(); g.moveTo(x2 - sl * .7, cy + b * .5); g.quadraticCurveTo(x2 - sl * .1, cy - b * .1, x2 + sl * .5, cy - b * .85); g.stroke();
  }
  // sheen along the upper third
  g.strokeStyle = css(light(col, .55), lum > .75 ? .25 : .28); g.lineWidth = b * .45;
  g.beginPath(); g.moveTo(cx - a * .6, cy - b * .38); g.quadraticCurveTo(cx, cy - b * .62, cx + a * .6, cy - b * .38); g.stroke();
  // fibre texture inside
  for (let i = 0; i < 60; i++) {
    const x = cx + (r() - .5) * 2 * a, y = cy + (r() - .5) * 2 * b, an = r() * TAU, L = 3 + r() * 7;
    g.strokeStyle = r() < .55 ? css(light(col, .35), .35) : css(dark(col, .4), .3); g.lineWidth = .9;

  for (let i = 0; i < 16; i++) {
    const th = r() * TAU, ex = cx + Math.cos(th) * a * .8, ey = cy + Math.sin(th) * b * .8, an = th + (r() - .5), L = 6 + r() * 9;
    g.strokeStyle = css(light(col, .3), .45); g.lineWidth = 1;

}
let LEGS = null;
function buildLegs() {
  LEGS = {};
  for (const ci of new Set(ROW_CI)) { LEGS[ci] = []; for (let v = 0; v < 4; v++) LEGS[ci].push(buildLeg(STRIPE_RGB[ci], ci + ':' + v)); }
}
/** Draw a leg sprite so the leg spans a→b (length × stretch) with width w px. */
function drawLeg(g, spr, a, b, w, stretch = 1.2) {
  const d = vsub(b, a), len = vlen(d) * stretch, an = Math.atan2(d[1], d[0]), m = vlerp(a, b, .5);
  g.setTransform(Math.cos(an), Math.sin(an), -Math.sin(an), Math.cos(an), m[0], m[1]);
  g.drawImage(spr, -len / 2 / LEG_FX, -w / 2 / LEG_FY, len / LEG_FX, w / LEG_FY);
  g.setTransform(1, 0, 0, 1, 0, 0);

/** The knitted fabric: valleys, then the rows of Vs from cast-on to needle. */
function drawKnit(g, rb, K) {
  const { u0, rh, nc } = K, dv = 2 / nc, r = rngFor('knit:jitter');
  // valleys: the fabric seen between the loops
  for (let k = 0; k < NROWS; k++) {
    const ua = u0 + k * rh - .6, ub = u0 + (k + 1) * rh + .6, c = STRIPE_RGB[ROW_CI[k]];
    const q = [];
    for (let u = ua; u < ub; u += 2) q.push(rb.at(u, .97));
    q.push(rb.at(ub, .97));
    for (let u = ub; u > ua; u -= 2) q.push(rb.at(u, -.97));
    q.push(rb.at(ua, -.97));
    fillPts(g, q, css(dark(c, .66)));
  }
  // cast-on edge: a firm little chain along u = 0
  const c0 = STRIPE_RGB[ROW_CI[0]];
  for (let j = 0; j <= nc; j++) {
    const v = -1 + j * dv;
    drawLeg(g, LEGS[ROW_CI[0]][j % 4], rb.at(u0 * .45, v - dv * .45), rb.at(u0 * .45, v + dv * .45), u0 * 1.05, 1.05);
  }
  // stitches
  for (let k = 0; k < NROWS; k++) {
    const spr = LEGS[ROW_CI[k]], uc = u0 + (k + .5) * rh;
    for (let j = 0; j < nc; j++) {
      const vj = -1 + (j + .5) * dv;
      const sides = r() < .5 ? [-1, 1] : [1, -1];
      for (const s of sides) {
        const A = rb.at(uc - .5 * rh + (r() - .5) * .8, vj + s * .07 * dv + (r() - .5) * .03 * dv);
        const B = rb.at(uc + .55 * rh + (r() - .5) * .8, vj + s * .5 * dv + (r() - .5) * .04 * dv);
        const comp = vlen(vsub(rb.at(uc, vj + dv / 2), rb.at(uc, vj - dv / 2))) / (rb.W(uc) * dv);
        const w = rb.W(uc) * dv * .64 * comp * (1 + (r() - .5) * .1);
        drawLeg(g, spr[Math.floor(r() * 4)], A, B, w, 1.13 * (1 + (r() - .5) * .08));
      }
    }
  }
}
/** Loose fibres over the whole fabric: the fuzzy halo of real wool. */
function knitFuzz(g, rb, K, dens = 1) {
  const r = rngFor('knit:fuzz'), n = Math.round(rb.L * 30 * dens);
  g.save(); g.lineCap = 'round';
  for (let i = 0; i < n; i++) {
    const u = r() * rb.L, v = (r() * 2 - 1) * 1.08, p = rb.at(u, v);
    const k = clamp(Math.floor((u - K.u0) / K.rh), 0, NROWS - 1), c = STRIPE_RGB[ROW_CI[k]];
    const an = r() * TAU, L = 2 + r() * r() * 9, bend = (r() - .5) * 3;
    g.strokeStyle = css(light(c, .15 + r() * .3), .22 + r() * .3); g.lineWidth = .45 + r() * .4;
    g.beginPath(); g.moveTo(p[0], p[1]);
    g.quadraticCurveTo(p[0] + Math.cos(an) * L * .5 - Math.sin(an) * bend, p[1] + Math.sin(an) * L * .5 + Math.cos(an) * bend, p[0] + Math.cos(an) * L, p[1] + Math.sin(an) * L);

}
/** Folds, sags and the turn of the cloth: fn(u, v) → [multiply, add-light]. */
function shadeRibbon(g, rb, fn, clip, W, H) {
  const sc = cv(W, H), s = ctxOf(sc), hc = cv(W, H), h = ctxOf(hc);
  s.fillStyle = '#fff'; s.fillRect(0, 0, W, H); h.fillStyle = '#000'; h.fillRect(0, 0, W, H);
  const du = 3, nv = 16;
  for (let u = 0; u < rb.L; u += du) for (let j = 0; j < nv; j++) {
    const va = -1.12 + j * 2.24 / nv, vb = va + 2.24 / nv;
    const q = [rb.at(u - .6, va - .02), rb.at(u + du + .6, va - .02), rb.at(u + du + .6, vb + .02), rb.at(u - .6, vb + .02)];
    const [m, a] = fn(u + du / 2, (va + vb) / 2);
    const gm = Math.round(clamp(m) * 255); s.fillStyle = `rgb(${gm},${gm},${gm})`; fillPts(s, q);
    if (a > .004) { const ga = Math.round(clamp(a) * 255); h.fillStyle = `rgb(${ga},${ga},${ga})`; fillPts(h, q); }

/* ── 8. Needles, loops, fringe ────────────────────────────────────────────── */
/** A tapered wooden knitting needle with a knob, knob → tip. */
function needle(g, knob, tip, D, key) {
  const ax = vnorm(vsub(tip, knob)), nn = [-ax[1], ax[0]], L = vlen(vsub(tip, knob)), r = rngFor('needle:' + key);
  const half = s => s < .84 ? D / 2 * (1 - .1 * s) : D / 2 * .916 * Math.pow(Math.max(0, (1 - s) / .16), .55) + .6;
  const left = [], right = [];
  for (let i = 0; i <= 60; i++) { const s = i / 60, p = vadd(knob, vmul(ax, s * L)), h = half(s); left.push(vadd(p, vmul(nn, h))); right.push(vadd(p, vmul(nn, -h))); }
  const outline = left.concat(right.reverse()), path = pathOf(outline);
  dropShadow(g, path, 3, 6, 3.5, .45);
  const wood = [196, 148, 92];
  const gr = g.createLinearGradient(knob[0] + nn[0] * D / 2, knob[1] + nn[1] * D / 2, knob[0] - nn[0] * D / 2, knob[1] - nn[1] * D / 2);
  const up = nn[1] < 0; // which side faces the light
  const stops = [[0, dark(wood, .35)], [.3, light(wood, .35)], [.55, wood], [1, dark(wood, .45)]];
  for (const [s, c] of stops) gr.addColorStop(up ? s : 1 - s, css(c));
  g.save(); g.fillStyle = gr; g.fill(path); g.clip(path);
  g.lineWidth = .7;
  for (let i = 0; i < 5; i++) {
    const off = (r() - .5) * D * .7, s0 = r() * .3, s1 = s0 + .3 + r() * .5;
    g.strokeStyle = css(dark(wood, .3), .45); g.beginPath();
    for (let s = s0; s < Math.min(1, s1); s += .02) { const p = vadd(vadd(knob, vmul(ax, s * L)), vmul(nn, off + Math.sin(s * 40 + i) * .4)); s === s0 ? g.moveTo(p[0], p[1]) : g.lineTo(p[0], p[1]); }
    g.stroke();
  }
  g.restore();
  // knob
  const kc = vadd(knob, vmul(ax, -D * .55)), kr = D * 1.05;
  g.save(); g.filter = 'blur(3px)'; g.fillStyle = 'rgba(40,20,10,.4)'; g.beginPath(); g.arc(kc[0] + 3, kc[1] + 5, kr, 0, TAU); g.fill(); g.restore();
  const kg = g.createRadialGradient(kc[0] - kr * .35, kc[1] - kr * .4, kr * .1, kc[0], kc[1], kr);
  kg.addColorStop(0, css(light([170, 110, 60], .45))); kg.addColorStop(.5, css([160, 100, 52])); kg.addColorStop(1, css(dark([150, 92, 48], .45)));
  g.fillStyle = kg; g.beginPath(); g.arc(kc[0], kc[1], kr, 0, TAU); g.fill();
  return { ax, nn, L, half };
}
/** The live row: each loop's front strand wraps over the needle. */
function liveLoops(g, rb, K) {
  const { nc } = K, dv = 2 / nc, c = STRIPE_RGB[ROW_CI[NROWS - 1]], t = rb.tan(rb.L), r = rngFor('loops');
  for (let j = 0; j < nc; j++) {
    const vj = -1 + (j + .5) * dv;
    const a = rb.at(rb.L - K.rh * .45, vj - dv * .18), m = vadd(rb.at(rb.L, vj + dv * .05), vmul(t, K.rh * .75));
    const e = vadd(rb.at(rb.L, vj + dv * .32), vmul(t, K.rh * .05));
    const w = rb.W(rb.L) * dv * .5 * (1 + (r() - .5) * .1);
    const P = [a, vlerp(a, m, .55), m, e];
    g.save(); g.lineCap = 'round';
    g.strokeStyle = 'rgba(30,5,5,.45)'; g.lineWidth = w + 2; g.beginPath(); trace(g, open(P, 8).map(([x, y]) => [x + 1.2, y + 2]), false); g.stroke();
    g.strokeStyle = css(dark(c, .15)); g.lineWidth = w; g.beginPath(); trace(g, open(P, 8), false); g.stroke();
    g.strokeStyle = css(light(c, .35), .6); g.lineWidth = w * .3; g.setLineDash([w * .5, w * .45]);
    g.beginPath(); trace(g, open(P, 8).map(([x, y]) => [x - w * .12, y - w * .18]), false); g.stroke();
    g.restore();

/** Tassels knotted through the cast-on edge; they hang with gravity. */
function fringe(g, rb, K, key) {
  const c = STRIPE_RGB[ROW_CI[0]], r = rngFor('fringe:' + key), t0 = rb.tan(0), n0 = rb.nrm(0), nt = 7;
  for (let i = 0; i < nt; i++) {
    const v = -.84 + i * 1.68 / (nt - 1), base = rb.at(1.5, v);
    const len = 44 + r() * 16;
    for (let s = 0; s < 3; s++) {
      const p0 = vadd(base, vmul(n0, (s - 1) * 3));
      const p1 = vadd(p0, vadd(vmul(t0, -len * .28), [(r() - .5) * 4, len * .22]));
      const p2 = vadd(p0, vadd(vmul(t0, -len * .36), [(r() - .5) * 8, len * .95]));
      plied(g, [p0, p1, p2], c, 3.6, key + i + ':' + s);
    }
    knot(g, base[0], base[1], 4.2, dark(c, .1), 'fr' + i);

}

function drawHoop(g) {
  const cx = 1596, cy = 226, R = 132, rin = R - 12;
  knot(g, cx, cy - R - 20, 4.5, [120, 110, 100], 'hnail');
  // Aida cloth
  const cloth = ellipsePts(cx, cy, rin + 2, rin + 2, 120);
  felt(g, cloth, [244, 237, 222], 'aida', {
    wob: .4, shadow: false, ew: 16, eb: 9, ea: .2, fib: .35, stray: 0,
    inner: (gg, bb) => {
      gg.fillStyle = 'rgba(120,100,70,.28)';
      for (let yy = bb[1]; yy < bb[3]; yy += 6) for (let xx = bb[0]; xx < bb[2]; xx += 6) { gg.fillRect(xx + 2.5, yy + 2.5, 1.3, 1.3); }
      gg.strokeStyle = 'rgba(255,255,255,.35)'; gg.lineWidth = 1;
      for (let yy = bb[1]; yy < bb[3]; yy += 6) { gg.beginPath(); gg.moveTo(bb[0], yy); gg.lineTo(bb[2], yy); gg.stroke(); }
    },
  });
  // cross-stitched title from the kit's lettering strokes, snapped to the cloth grid
  const s = 6, gx0 = Math.floor((cx - 200) / s) * s, gy0 = Math.floor((cy - 200) / s) * s;
  const cells = (strokes) => {
    const set = new Map();
    for (const st of strokes) for (const [px, py] of resample(st, .5)) {
      const i = Math.floor((px - gx0) / s), j = Math.floor((py - gy0) / s); set.set(i + ',' + j, [i, j]);
    }

  };
  const T1 = lettering('THE', cx, cy - 58, 30, { key: 'hoopTHE', wob: 0 }), T2 = lettering('SCARF', cx, cy - 6, 50, { key: 'hoopSCARF', wob: 0 });
  for (const [i, j] of cells(T1.strokes)) xstitch(g, gx0 + (i + .5) * s, gy0 + (j + .5) * s, s, C.navy, 1.9);
  for (const [i, j] of cells(T2.strokes)) xstitch(g, gx0 + (i + .5) * s, gy0 + (j + .5) * s, s, C.navy, 1.9);
  // a little band of warming stripes: one column per four years
  const cols = 19, bx = cx - cols * s / 2;
  for (let c = 0; c < cols; c++) {
    let acc = 0, n = 0; for (let k = c * 4; k < Math.min(NROWS, c * 4 + 4); k++) { acc += ROW_CI[k]; n++; }
    const ci = Math.round(acc / n);
    for (let rr = 0; rr < 3; rr++) xstitch(g, Math.round(bx / s) * s + (c + .5) * s, gy0 + (Math.floor((cy + 46 - gy0) / s) + rr + .5) * s, s, STRIPE_RGB[ci], 1.9);
  }
  // wooden rings and the brass clasp
  const ring = (r0, r1, key, colr) => {
    const outer = ellipsePts(cx, cy, r1, r1, 140), inner = ellipsePts(cx, cy, r0, r0, 140).reverse();
    const P = outer.concat([outer[0]], [inner[inner.length - 1]], inner);
    const path = new Path2D(); path.addPath(pathOf(outer)); path.addPath(pathOf(ellipsePts(cx, cy, r0, r0, 140)));
    g.save(); g.filter = 'blur(5px)'; g.fillStyle = 'rgba(40,22,10,.4)'; g.translate(3, 6); g.fill(path, 'evenodd'); g.restore();
    const gr = g.createLinearGradient(cx - r1, cy - r1, cx + r1, cy + r1);
    gr.addColorStop(0, css(light(colr, .3))); gr.addColorStop(.5, css(colr)); gr.addColorStop(1, css(dark(colr, .3)));
    g.save(); g.fillStyle = gr; g.fill(path, 'evenodd'); g.clip(path, 'evenodd');
    g.strokeStyle = css(dark(colr, .3), .5); g.lineWidth = .8;
    for (let k = 0; k < 4; k++) { g.beginPath(); g.arc(cx, cy, r0 + (r1 - r0) * (k + .5) / 4, k, k + 4.5); g.stroke(); }
    g.restore();
    void P; void key;
  };
  ring(rin - 1, rin + 6, 'in', [206, 164, 110]);
  ring(rin + 6, R, 'out', [198, 152, 98]);
  felt(g, rrect(cx - 16, cy - R - 12, 32, 18, 4), [176, 150, 90], 'clasp', { sy: 4, ew: 5, ea: .5, wob: .3 });
  knot(g, cx, cy - R - 3, 4, [210, 190, 130], 'screw');
}

/* ── 13. The scarf across three laps ───────────────────────────────────────── */
function buildScarf() {
  const N1 = GD.N1, d1 = vnorm(vsub(N1.tip, N1.knob)), L1 = vlen(vsub(N1.tip, N1.knob));
  const lo = vadd(N1.knob, vmul(d1, L1 * .13)), hi = vadd(N1.knob, vmul(d1, L1 * .6));
  const end = vlerp(lo, hi, .5), endW = vlen(vsub(hi, lo)) / 2, tEnd = -d1[1] > 0 ? [-d1[1], d1[0]] : [d1[1], -d1[0]];
  // centre line: level across each lap, sagging into the gaps between the women
  const ctrl = [[510, 662], [578, 664], [650, 667], [716, 677], [784, 686], [852, 676], [912, 666], [1000, 664], [1066, 675], [1128, 690],
    [1190, 690], [1244, 684], vsub(end, vmul(tEnd, 70)), vsub(end, vmul(tEnd, 32)), end];
  const nz = makeNoise('scarf:tension');
  let rb = null;
  const H0 = 70, LAPY = [671, 698], VK = -.72;
  const sagAt = u => smooth(LAPY[0], LAPY[1], rb.pos(u)[1]);
  const liftAt = u => smooth(rb.L - 190, rb.L - 90, u);
  const halfW = u => {
    if (!rb) return H0;
    const w = H0 * (1 - .06 * sagAt(u)) * (1 + .03 * nz(u * .045, 3.1));
    return lerp(w, endW, smooth(rb.L - 170, rb.L - 4, u));
  };
  // on a lap the scarf lies on the thighs (seen from above, foreshortened)
  // and only its front edge curls down over the knees
  const fold = u => {
    if (!rb) return [VK, 1, 1];
    const onLap = (1 - sagAt(u)) * (1 - liftAt(u));
    return [VK, lerp(.7, .64, onLap) + .26 * liftAt(u), lerp(.9, .8, onLap) + .1 * liftAt(u)];
  };
  rb = makeRibbon(ctrl, halfW, fold);
  const K = { u0: 7, nc: 9 };
  K.rh = (rb.L - K.u0) / NROWS;
  const creases = [];
  for (let u = 20; u < rb.L - 60; u += 2) {
    const y0 = rb.pos(u - 2)[1], y1 = rb.pos(u)[1];
    if ((y0 < 720) !== (y1 < 720)) creases.push({ u, slant: y1 > y0 ? 10 : -10 });
  }
  const shade = (u, v) => {
    const sag = sagAt(u), onLap = (1 - sag) * (1 - liftAt(u)), vk = VK;
    let m = 1, a = 0;
    a += .06 * onLap * smooth(vk + .1, vk + .5, v);                   // lap face catches the window light
    a += .1 * onLap * Math.exp(-(((v - vk - .05) / .12) ** 2));       // ridge where it rolls over the knees
    m *= 1 - .2 * onLap * smooth(vk, -1.02, v);                       // then turns down, away from the light
    m *= 1 - .15 * (1 - onLap) * smooth(-.25, -1, v);                // hanging part darkens downward
    m *= 1 - .12 * smooth(-.8, -1.04, v);                             // lower edge curls under
    m *= 1 - .1 * smooth(.82, 1.04, v);                               // back edge
    m *= 1 - .2 * sag * (.5 + .5 * smooth(.6, -1, v));                // the sags sit in shadow
    for (const c of creases) {
      const d = u - (c.u + c.slant * v);
      m *= 1 - .2 * Math.exp(-((d / 7) ** 2));
      a += .05 * Math.exp(-(((d - 11) / 6) ** 2));
    }
    a += .03 * liftAt(u) * smooth(-.2, .8, v);
    return [m, a];
  };
  return { rb, K, shade };
}
function drawScarf(g, S, W, H) {
  const { rb, K, shade } = S;
  const out = ribbonOutline(rb, 1.02);
  dropShadow(g, pathOf(out), 6, 12, 10, .55);
  dropShadow(g, pathOf(out), 2, 4, 3, .3);
  drawKnit(g, rb, K);
  knitFuzz(g, rb, K, 1);
  shadeRibbon(g, rb, shade, pathOf(ribbonOutline(rb, 1.06)), W, H);
}

/* ── 14. The granddaughter's hands, the needles and the working yarn ──────── */
function drawNeedlework(g, S) {
  const { rb, K } = S, { N1, N2 } = GD, sk = GD.skin, red = STRIPE_RGB[ROW_CI[NROWS - 1]];
  needle(g, N2.knob, N2.tip, 9, 'n2');
  hand(g, { at: [1238, 598], ang: .72, L: 56, W: 40, fl: .45, skin: sk, ts: -1, ta: 1.2, tl: .5, key: 'gdFistL' });
  needle(g, N1.knob, N1.tip, 9, 'n1');
  liveLoops(g, rb, K);
  const y0 = vadd(rb.at(rb.L, .8), vmul(rb.tan(rb.L), 8)), [bx, by, br] = BASKET.ball;
  plied(g, [y0, [1300, 552], [1340, 566], [1400, 600], [1436, 660], [1462, 750], [1490, 826], [bx - 4, by - br + 4]], red, 5.5, 'workyarn');
  hand(g, { at: [1414, 600], ang: 2.3, L: 56, W: 40, fl: .45, skin: sk, ts: 1, ta: 1.3, tl: .5, key: 'gdFistR' });
}

/* ── 15. Light, lens and grain: a diorama photographed flat ────────────────── */
function finish(g, W, H) {
  g.save(); g.globalCompositeOperation = 'soft-light';
  const gr = g.createRadialGradient(250, 210, 40, 250, 210, 1800);
  gr.addColorStop(0, 'rgba(255,214,140,.7)'); gr.addColorStop(.45, 'rgba(255,214,140,.12)'); gr.addColorStop(1, 'rgba(40,24,40,.35)');
  g.fillStyle = gr; g.fillRect(0, 0, W, H); g.restore();
  g.save();
  const vg = g.createRadialGradient(W * .5, H * .52, H * .42, W * .5, H * .52, H * 1.08);
  vg.addColorStop(0, 'rgba(20,10,5,0)'); vg.addColorStop(1, 'rgba(20,10,5,.42)');
  g.fillStyle = vg; g.fillRect(0, 0, W, H); g.restore();
  g.save(); g.globalCompositeOperation = 'overlay'; g.globalAlpha = .55; g.fillStyle = pats(g).grain; g.fillRect(0, 0, W, H); g.restore();
}

/* ── 16. The frame ─────────────────────────────────────────────────────────── */
function draw(g, W, H) {
  g0 = g;
  buildTextures(); buildLegs();
  drawWallAndFloor(g, W, H);
  drawWindow(g); drawCalendar(g); drawPhoto(g); drawHoop(g); drawFanTable(g);
  drawSofaBack(g); drawThrowCushions(g);
  GM.back(g); MO.back(g); GD.back(g);
  drawSofaFront(g);
  GM.body(g); MO.body(g); GD.body(g);
  const S = buildScarf();
  drawScarf(g, S, W, H);
  fringe(g, S.rb, S.K, 'blue');
  GM.arms(g); MO.arms(g); GD.arms(g);
  GM.over(g);
  drawBasketBack(g); drawBasketFront(g);
  drawNeedlework(g, S);
  finish(g, W, H);
}
stillFrame(1920, 1080, draw);
