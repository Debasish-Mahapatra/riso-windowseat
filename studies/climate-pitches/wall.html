<script>
'use strict';
/* PAINT IT BACK · style frame.
   A Warli painting in rice paste on a red mud-and-dung wall; rain has just begun
   to run down the right third. Pipeline: every motif is painted as white coverage
   into a paint layer → a wet mask is built from vertical runs → the wall is made
   per pixel → the paint is textured, dissolved, smeared and dripped where wet →
   hairline cracks and fine rain streaks go on top. */

const FW = 1920, FH = 1080;
const PAINT = rgb('#f1eadb');

/* ── helpers ─────────────────────────────────────────────────────────────── */
const dirv = a => [Math.sin(a), Math.cos(a)];          // angle 0 points down, +π/2 points to +x
const addv = (a, b, k = 1) => [a[0] + b[0] * k, a[1] + b[1] * k];
const midv = (a, b, u = 0.5) => [lerp(a[0], b[0], u), lerp(a[1], b[1], u)];
function hash2(x, y, s = 0) {
  let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(s | 0, 1442695041);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function polyLen(p) { let L = 0; for (let i = 1; i < p.length; i++) L += Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]); return L; }

/* separable box blur on a Float32Array; returns a new array */
function blurPass(src, dst, w, h, r, horiz) {
  const inv = 1 / (2 * r + 1);
  if (horiz) {
    for (let y = 0; y < h; y++) {
      const o = y * w; let acc = 0;
      for (let k = -r; k <= r; k++) acc += src[o + clamp(k, 0, w - 1)];
      for (let x = 0; x < w; x++) {
        dst[o + x] = acc * inv;
        acc += src[o + Math.min(w - 1, x + r + 1)] - src[o + Math.max(0, x - r)];
      }
    }
  } else {
    for (let x = 0; x < w; x++) {
      let acc = 0;
      for (let k = -r; k <= r; k++) acc += src[clamp(k, 0, h - 1) * w + x];
      for (let y = 0; y < h; y++) {
        dst[y * w + x] = acc * inv;
        acc += src[Math.min(h - 1, y + r + 1) * w + x] - src[Math.max(0, y - r) * w + x];
      }
    }
  }
}
function blurF(src, w, h, rx, ry, passes = 1) {
  let a = Float32Array.from(src), b = new Float32Array(src.length);
  for (let p = 0; p < passes; p++) {
    if (rx > 0) { blurPass(a, b, w, h, rx, true); [a, b] = [b, a]; }
    if (ry > 0) { blurPass(a, b, w, h, ry, false); [a, b] = [b, a]; }
  }
  return a;
}
/* two-bone IK in the figure's local frame (angle 0 = down). bend ±1 picks the elbow side. */
function ik2(s, t, a, b, bend) {
  const dx = t[0] - s[0], dy = t[1] - s[1], d = Math.hypot(dx, dy) || 1e-6;
  const dd = clamp(d, Math.abs(a - b) + 1e-4, a + b - 1e-4);
  const base = Math.atan2(dx, dy);
  const A = Math.acos(clamp((a * a + dd * dd - b * b) / (2 * a * dd), -1, 1));
  const a1 = base + bend * A;
  return [[s[0] + a * Math.sin(a1), s[1] + a * Math.cos(a1)], [s[0] + dx / d * dd, s[1] + dy / d * dd]];
}

/* ── the painter: a chewed bamboo stick loaded with rice paste ─────────────────
   Everything is painted as white coverage into PG (alpha = paste). Colour, grain,
   translucency and the rain are applied later, per pixel. */
let PG = null;
const PR = rngFor('paint:hand');
const PN = makeNoise('paint:hand');
/* paste load: the stick is dipped, runs thinner stroke by stroke, and is dipped again */
let STROKE = 0;
const load = () => { STROKE++; return 0.84 + 0.16 * clamp(PN(STROKE * 0.035, 77.7) * 1.4 + 0.55); };
function handPath(pts, step, amp, seed) {
  const p = resample(pts, step);
  return p.map(([x, y], i) => [x + amp * PN(seed + i * step * 0.05, 1.7), y + amp * PN(seed + i * step * 0.05, 8.3)]);
}
/** A painted line. w = full width in px. o: alpha, dry (drag at the end), start (loaded
 *  blob), end (end width factor), vary (width wobble), trem (hand tremor px), g. */
function pLine(pts, w, o = {}) {
  const g = o.g || PG;
  if (!pts || pts.length < 2) return;
  const seed = PR() * 900;
  const p = handPath(pts, o.step || 1.1, o.trem ?? 0.32, seed);
  if (p.length < 2) return;
  const L = polyLen(p), hw = w / 2, a = (o.alpha ?? 0.95) * load(), vary = o.vary ?? 0.2;
  const dry = o.dry ?? (L > 34 && w > 1.6), stB = o.start ?? 1.12, enT = dry ? 0.5 : (o.end ?? 0.72);
  const wf = s => {
    const v = 1 + vary * 1.8 * PN(seed + s * L * 0.045, 5.5);
    const st = lerp(stB, 1, smooth(0, Math.min(0.3, 5 / L), s));
    const en = lerp(1, enT, smooth(dry ? 0.58 : 0.7, 1, s));
    return Math.max(0.32, hw * v * st * en);
  };
  g.fillStyle = `rgba(255,255,255,${a})`;
  g.beginPath(); trace(g, taper(p, wf), true); g.fill();
  g.beginPath(); g.arc(p[0][0], p[0][1], wf(0) * 0.97, 0, TAU); g.fill();
  if (!dry) { const e = p[p.length - 1]; g.beginPath(); g.arc(e[0], e[1], wf(1) * 0.94, 0, TAU); g.fill(); }
  else dryEnd(g, p, L, hw, a);
}
/* the stick running out of paste: bristle tails and thin gaps at the end of a stroke */
function dryEnd(g, p, L, hw, a) {
  const n = p.length, seg = p.slice(Math.floor(n * 0.6));
  if (seg.length < 3) return;
  const e = p[n - 1], e2 = p[Math.max(0, n - 5)];
  let dx = e[0] - e2[0], dy = e[1] - e2[1]; const d = Math.hypot(dx, dy) || 1; dx /= d; dy /= d;
  const nx = -dy, ny = dx, k = 3 + (PR() * 2 | 0);
  for (let j = 0; j < k; j++) {
    const off = ((j + 0.5) / k - 0.5) * hw * 1.5 + (PR() - 0.5) * hw * 0.3;
    const ext = PR() * Math.min(8, L * 0.1);
    const pts = seg.map(([x, y], i) => { const u = i / (seg.length - 1); return [x + nx * off * u, y + ny * off * u]; });
    pts.push([e[0] + dx * ext + nx * off, e[1] + dy * ext + ny * off]);
    const bw = Math.max(0.3, hw * range(PR, 0.2, 0.34));
    g.fillStyle = `rgba(255,255,255,${a * range(PR, 0.4, 0.75)})`;
    g.beginPath(); trace(g, taper(pts, s => bw * (1 - 0.65 * smooth(0.55, 1, s))), true); g.fill();
  }
  g.save(); g.globalCompositeOperation = 'destination-out';
  for (let j = 0; j < 2; j++) {
    const off = (PR() - 0.5) * hw * 0.9, from = Math.floor(seg.length * range(PR, 0.25, 0.65));
    const pts = seg.slice(from).map(([x, y]) => [x + nx * off, y + ny * off]);
    if (pts.length < 2) continue;
    g.fillStyle = `rgba(0,0,0,${range(PR, 0.3, 0.65)})`;
    g.beginPath(); trace(g, taper(pts, s => 0.3 + 0.3 * s), true); g.fill();
  }
  g.restore();
}
/** A painted fill: slightly irregular edge, a denser rim where the outline went first. */
function pFill(poly, o = {}) {
  const g = o.g || PG, seed = PR() * 900, step = o.step ?? 1.4, amp = o.wob ?? 0.55;
  let p = resample(poly, step, true);
  p = p.map(([x, y], i) => [x + amp * PN(seed + i * step * 0.09, 3.3), y + amp * PN(seed + i * step * 0.09, 9.9)]);
  g.fillStyle = `rgba(255,255,255,${(o.alpha ?? 0.93) * load()})`;
  g.beginPath(); trace(g, p, true); g.fill();
  if (o.edge !== 0) {
    g.strokeStyle = `rgba(255,255,255,${o.edge ?? 0.45})`; g.lineWidth = o.edgeW ?? 1.1; g.lineJoin = 'round';
    g.beginPath(); trace(g, p, true); g.stroke();
  }
}
function pDot(x, y, r, o = {}) {
  const e = 1 + (PR() - 0.5) * 0.16, rot = PR() * TAU;
  pFill(ellipsePts(x, y, r * e, r / e, Math.max(10, Math.round(r * 5)), rot), { step: Math.max(0.6, r * 0.4), wob: o.wob ?? Math.min(0.5, r * 0.12), edge: 0, alpha: o.alpha, g: o.g });
}
function pRing(x, y, rx, ry, w, o = {}) {
  const pts = ellipsePts(x, y, rx, ry, 64, o.rot || 0); pts.push(pts[0], pts[1]);
  pLine(pts, w, Object.assign({ dry: false }, o));
}
/** Scratch paint away (eyes, bands on pots, scales). */
function pCut(pts, w, a = 0.9) {
  PG.save(); PG.globalCompositeOperation = 'destination-out';
  PG.strokeStyle = `rgba(0,0,0,${a})`; PG.lineWidth = w; PG.lineCap = 'round'; PG.lineJoin = 'round';
  PG.beginPath(); trace(PG, pts, false); PG.stroke(); PG.restore();
}
function pHole(x, y, r, a = 0.95) {
  PG.save(); PG.globalCompositeOperation = 'destination-out'; PG.fillStyle = `rgba(0,0,0,${a})`;
  PG.beginPath(); PG.arc(x, y, r, 0, TAU); PG.fill(); PG.restore();
}
</script>
<script>
/* ── the Warli figure ─────────────────────────────────────────────────────────
   Two triangles tip to tip (an inverted torso over upright hips), a round head on
   a short neck, stick limbs bent at elbows and knees. Units are fractions of the
   figure's height; the pose is joint angles, so the film can animate it.
   Angles: 0 = hanging straight down, positive swings OUTWARD from that side.
   pose = { face: ±1, woman, bun, lean, seat, headX, thick,
            la/ra: [shoulder, elbow], ll/rl: [hip, knee],
            lhT/rhT/lfT/rfT: world targets for hands/feet (two-bone IK),
            elbL/elbR: ±1 which way an IK elbow folds } */
const RIG = {
  headR: 0.08, headY: 0.915, shY: 0.79, waistY: 0.565, hipY: 0.385,
  shW: 0.165, hipW: 0.138, uArm: 0.19, fArm: 0.18, thigh: 0.205, shin: 0.2,
  limb: 0.041, foot: 0.06,
};
function warliPerson(g, x, y, size, angle, pose = {}) {
  const S = size, f = pose.face ?? 1, woman = !!pose.woman, bun = pose.bun ?? woman;
  const r = rngFor('fig:' + (pose.key ?? `${x.toFixed(1)},${y.toFixed(1)}`));
  const J = (k = 1) => (r() - 0.5) * 0.02 * k;
  const seat = pose.seat || 0, lean = pose.lean || 0;
  const ca = Math.cos(angle), sa = Math.sin(angle);
  const toW = ([lx, ly]) => { const X = lx * f * S, Y = ly * S; return [x + X * ca - Y * sa, y + X * sa + Y * ca]; };
  const toL = ([wx, wy]) => { const dx = wx - x, dy = wy - y; return [(dx * ca + dy * sa) / S * f, (-dx * sa + dy * ca) / S]; };
  const waistY = RIG.waistY - seat, shY = RIG.shY - seat, hipY = RIG.hipY - seat - (woman ? 0.022 : 0);
  const hipW = RIG.hipW * (woman ? 1.12 : 1) * (1 + J(4)), shW = RIG.shW * (1 + J(4));
  const waist = [J(0.6), -waistY];
  const cl = Math.cos(lean), sl = Math.sin(lean);
  const up = ([lx, ly]) => { const dx = lx - waist[0], dy = ly - waist[1]; return [waist[0] + dx * cl - dy * sl, waist[1] + dx * sl + dy * cl]; };
  const shL = up([-shW, -shY + J()]), shR = up([shW, -shY + J()]);
  const tipU = up([waist[0], waist[1] + 0.013]);         // the torso's apex dips just past the waist
  const tipD = [waist[0], waist[1] - 0.013];             // the hips' apex rises just past it
  const hipL = [-hipW, -hipY + J(0.5)], hipR = [hipW, -hipY + J(0.5)];
  const hx = (pose.headX ?? 0) + J(0.5), head0 = [hx, -(RIG.headY - seat)], headC = up(head0);
  const neckA = up([0, -shY - 0.004]), neckB = up([hx * 0.7, head0[1] + RIG.headR * 0.8]);
  const limb = (root, spec, side, A, B, tgt, bend) => {
    if (tgt) { const [e, h] = ik2(root, toL(tgt), A, B, bend); return [root, e, h]; }
    const a1 = side * spec[0], a2 = a1 + side * spec[1];
    const e = addv(root, dirv(a1), A);
    return [root, e, addv(e, dirv(a2), B)];
  };
  const lw = RIG.limb * S * (pose.thick ?? 1), P = pts => pts.map(toW);
  const legs = [limb([-hipW * 0.8, -hipY], pose.ll || [0.2, -0.22], -1, RIG.thigh, RIG.shin, pose.lfT, 1),
                limb([hipW * 0.8, -hipY], pose.rl || [0.2, -0.22], 1, RIG.thigh, RIG.shin, pose.rfT, -1)];
  const arms = [limb(shL, pose.la || [0.35, -0.25], -1, RIG.uArm, RIG.fArm, pose.lhT, pose.elbL ?? 1),
                limb(shR, pose.ra || [0.35, -0.25], 1, RIG.uArm, RIG.fArm, pose.rhT, -(pose.elbR ?? 1))];
  if (!pose.noDraw) {
    for (const L of legs) {
      pLine(P(L), lw * 1.05, { dry: false, end: 0.85, g });
      const ft = L[2], fd = pose.footDir ?? 0;
      pLine(P([ft, [ft[0] + RIG.foot * Math.cos(fd), ft[1] + 0.006 + RIG.foot * Math.sin(fd)]]), lw * 0.95, { dry: false, end: 0.7, g, trem: 0.1 });
    }
    pFill(P([tipD, hipL, hipR]), { g });
    pFill(P([shL, shR, tipU]), { g });
    for (const A of arms) pLine(P(A), lw, { dry: false, end: 0.82, g });
    pLine(P([neckA, neckB]), lw * 0.9, { dry: false, g, trem: 0.1 });
    const hc = toW(headC); pDot(hc[0], hc[1], RIG.headR * S, { g });
    if (bun) { const b = toW(up([hx - 0.074, head0[1] - 0.03])); pDot(b[0], b[1], 0.034 * S, { g }); }
    for (const A of arms) { const h = toW(A[2]); pDot(h[0], h[1], lw * 0.66, { g }); }
  }
  return { S, toW, toL, head: toW(headC), headR: RIG.headR * S, top: toW(up([hx, head0[1] - RIG.headR])),
           hands: arms.map(A => toW(A[2])), elbows: arms.map(A => toW(A[1])), shoulders: [toW(shL), toW(shR)],
           feet: legs.map(L => toW(L[2])), waist: toW(waist) };
}
/* a stride, phase in [0,1): the walk cycle the film would loop */
function stride(ph, k = 1) {
  const s = Math.sin(ph * TAU);
  return { ll: [0.06 + 0.3 * k * s, 0.12 + 0.22 * k * Math.max(0, s)], rl: [0.06 - 0.3 * k * s, 0.12 + 0.22 * k * Math.max(0, -s)],
           la: [0.28 - 0.3 * k * s, 0.2], ra: [0.28 + 0.3 * k * s, -0.2] };
}
/** matka on the head: returns the geometry first so the raised arm can reach it */
function potGeom(x, y, S, k = 1) {
  const top = y - (RIG.headY + RIG.headR) * S;
  const rx = 0.12 * S * k, ry = 0.098 * S * k, cy = top - ry * 0.9 - 0.006 * S;
  return { x, cy, rx, ry, top };
}
function drawPot(pg, stack) {
  const { x, cy, rx, ry } = pg;
  pFill(ellipsePts(x, cy, rx, ry, 30), { edge: 0.3 });
  const nw = rx * 0.42, t = cy - ry * 0.92, rim = t - ry * 0.42;
  pFill([[x - nw, t + 1], [x + nw, t + 1], [x + nw * 1.3, rim], [x - nw * 1.3, rim]], { edge: 0.3 });
  pCut([[x - rx * 0.78, cy + ry * 0.12], [x + rx * 0.78, cy + ry * 0.12]], 0.9, 0.75);
  if (stack) {
    const r2 = rx * 0.68, q2 = ry * 0.66, c2 = rim - q2 * 0.85;
    pFill(ellipsePts(x, c2, r2, q2, 24), { edge: 0.3 });
    const n2 = r2 * 0.45, t2 = c2 - q2 * 0.9, rim2 = t2 - q2 * 0.45;
    pFill([[x - n2, t2 + 1], [x + n2, t2 + 1], [x + n2 * 1.3, rim2], [x - n2 * 1.3, rim2]], { edge: 0.3 });
  }
}
function womanWithPot(x, y, S, face, ph, key, stack = true) {
  const pg = potGeom(x, y, S), st = stride(ph, 0.85);
  const pose = Object.assign({ face, woman: true, key }, st);
  // the arm on the far side steadies the pot; the near arm swings
  pose.lhT = [x - face * pg.rx * 0.95, pg.cy + pg.ry * 0.15]; pose.elbL = -1;
  warliPerson(PG, x, y, S, 0, pose);
  drawPot(pg, stack);
}
</script>
<script>
/* ── motifs: sky, homes, trees, birds ─────────────────────────────────────── */
function sun(cx, cy, R) {
  pDot(cx, cy, R, { wob: 0.9 });
  pCut(ellipsePts(cx, cy, R * 0.62, R * 0.62, 40).concat([[cx + R * 0.62, cy]]), 1.6, 0.8);
  pRing(cx, cy, R * 1.3, R * 1.3, 2.8);
  const n = 18, r = rngFor('sun:rays');
  for (let i = 0; i < n; i++) {
    const a = i / n * TAU + 0.12, half = TAU / n * 0.27, r0 = R * 1.52, r1 = R * (2.08 + (r() - 0.5) * 0.12);
    pFill([[cx + Math.cos(a - half) * r0, cy + Math.sin(a - half) * r0], [cx + Math.cos(a + half) * r0, cy + Math.sin(a + half) * r0],
           [cx + Math.cos(a) * r1, cy + Math.sin(a) * r1]], { wob: 0.45 });
    const b = a + TAU / n / 2; pDot(cx + Math.cos(b) * R * 1.68, cy + Math.sin(b) * R * 1.68, 1.7);
  }
}
/* square-walled hut: thatch lines fanning from the ridge, a doorway, a row of dots */
function hutSquare(x, y, w, hw, hr, key) {
  const r = rngFor('hut:' + key), L = x - w / 2, R = x + w / 2, T = y - hw, ov = w * 0.13;
  pLine([[L - 5, y], [R + 5, y + 1]], 3.4, {});
  pLine([[L, y], [L + 0.6, T + 1]], 3.1, { dry: false });
  pLine([[R, y], [R - 0.6, T + 1]], 3.1, { dry: false });
  const A = [x + (r() - 0.5) * 3, T - hr], E1 = [L - ov, T + 3], E2 = [R + ov, T + 2];
  pLine([E1, A], 3.4, { dry: false }); pLine([A, E2], 3.4, { dry: false }); pLine([E1, E2], 3.2, { dry: false });
  const n = 10;
  for (let i = 1; i < n; i++) { const p = midv(E1, E2, i / n + (r() - 0.5) * 0.02); pLine([midv(A, p, 0.14), midv(A, p, 0.95)], 1.7, { dry: false, end: 0.5 }); }
  pLine([A, [A[0] + 1, A[1] - 13]], 2.4, { dry: false }); pDot(A[0] + 1, A[1] - 15, 2.6);
  const dw = w * 0.27, dh = hw * 0.74, dx = x + w * 0.14;
  pLine([[dx - dw / 2, y], [dx - dw / 2, y - dh], [dx + dw / 2, y - dh], [dx + dw / 2, y]], 2.5, { dry: false });
  for (let i = 0; i < 7; i++) pDot(lerp(L + 8, R - 8, i / 6), T + 9, 1.8);
  const wx = x - w * 0.24;   // a small window of crossed sticks
  pLine([[wx - 8, y - hw * 0.55], [wx + 8, y - hw * 0.55]], 1.8, { dry: false });
  pLine([[wx, y - hw * 0.55 - 8], [wx, y - hw * 0.55 + 8]], 1.8, { dry: false });
  return { door: [dx, y], A };
}
/* round-walled hut: a circle of wall under a cone of thatch */
function hutRound(x, y, R, hr, key) {
  const r = rngFor('hutr:' + key), cy = y - R;
  const wall = []; for (let i = 0; i <= 40; i++) { const a = lerp(-0.25, Math.PI + 0.25, i / 40); wall.push([x + Math.cos(a) * R, cy + Math.sin(a) * R * 1.02]); }
  pLine(wall, 3.1, { dry: false });
  const eL = [x - R * 1.28, cy - R * 0.2], eR = [x + R * 1.28, cy - R * 0.18], A = [x + (r() - 0.5) * 3, cy - R * 0.2 - hr];
  pLine([eL, A], 3.4, { dry: false }); pLine([A, eR], 3.4, { dry: false });
  pLine(curve([eL, [x, cy - R * 0.02], eR], false, 10), 3.1, { dry: false });
  for (let i = 1; i < 9; i++) { const u = i / 9, p = [lerp(eL[0], eR[0], u), cy - R * 0.2 + Math.sin(u * Math.PI) * R * 0.17]; pLine([midv(A, p, 0.16), midv(A, p, 0.94)], 1.6, { dry: false, end: 0.5 }); }
  pLine([A, [A[0], A[1] - 12]], 2.3, { dry: false }); pDot(A[0], A[1] - 14, 2.4);
  const dw = R * 0.52, dt = cy + R * 0.12;
  pLine([[x - dw / 2, y], [x - dw / 2, dt + dw / 2]].concat(curve([[x - dw / 2, dt + dw / 2], [x, dt], [x + dw / 2, dt + dw / 2]], false, 8)).concat([[x + dw / 2, y]]), 2.4, { dry: false });
  for (let i = 0; i < 5; i++) { const a = lerp(0.35, Math.PI - 0.35, i / 4); pDot(x - Math.cos(a) * R * 0.72, cy + Math.sin(a) * R * 0.1 - R * 0.02, 1.7); }
  return { A };
}
function leaf(p, ang, L, W) {
  const d = [Math.sin(ang), -Math.cos(ang)], n = [-d[1], d[0]];
  const m = addv(p, d, L * 0.42);

/* where the rain has reached: vertical runs from the top, a damp head, first drops */
function makeWet(W, H) {

/* paste texture: slightly ragged edges, thick and thin, pinholes where the wall is rough */
