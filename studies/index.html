    inkPass(ctx, 'indigo', { coverage: 1 }, birds);
    inkPass(ctx, 'orange', { coverage: 0.6 }, birds);
  },
});

const FBASE = 830;
const NIGHT = (() => { const p = new Path2D(); p.rect(-10, -10, W + 20, FBASE + 140); return p; })();   // underlaps the bed's wavy top edge
const FIREBED = cut([[-70, 902], [170, 874], [420, 898], [660, 870], [900, 894], [1150, 872],
                     [1150, 1160], [-70, 1160]], rngFor('flame:bed'), { amp: 9, per: 12, tear: 0.05 });

/* The flame's shape is a function of t and nothing else. Three sine stacks at
   different rates lick the contour; the hand-cut wobble comes from a key, not
   from a draw, so the edge does not boil between frames. Period is exactly 1 s,
   so the study loops. */
const fwob = [wander('flame:a', 1), wander('flame:b', 2), wander('flame:c', 3)];
function flame(cx, h, w, t, s) {
  const [a, b, c] = fwob, H = h * s, W2 = w * s;
  const tipx = cx + W2 * (0.12 + 0.34 * a(t + 0.27));
  const tipy = FBASE - H * (0.98 + 0.07 * b(t));
  return cut([
    [cx - W2 * (0.96 + 0.1 * a(t)), FBASE],
    [cx - W2 * (0.82 + 0.22 * b(t)), FBASE - H * 0.3],
    [cx - W2 * (0.36 + 0.26 * c(t)), FBASE - H * 0.64],
    [tipx, tipy], [tipx, tipy],                  // doubled: the tip keeps its point
    [cx + W2 * (0.42 + 0.24 * c(t + 0.5)), FBASE - H * 0.58],
    [cx + W2 * (0.86 + 0.16 * b(t + 0.2)), FBASE - H * 0.26],
    [cx + W2 * (1.02 + 0.1 * a(t + 0.6)), FBASE],
  ], rngFor('flame:cut'), { amp: H * 0.018, per: 8 });
}

/* The one thing the craft kit could not reach. inkPass screens a whole pass at
   one flat coverage, so every animated element in both films is a flat screen:
   the fire in an earlier film is an orange shape, not a fire. Left is that. Right is
   the same flame at the same instant, put down as four bands at quantised
   coverages — the dot grows step by step from the edge in, and the core is a
   band at coverage 0, which is bare paper. The night under it is opened first
   with relight(), because orange screened over indigo prints brown; the logs
   are drawn after the opening, since relight puts paper back over everything
   baked where it lands. */
scene('flame', {
  inks: ['indigo', 'orange'],
  plates(g, ink, rng, sr) {
    if (ink === 'indigo') {
      print(g, NIGHT, 0.58);
      shade(g, NIGHT, { x0: 0, y0: 0, x1: 0, y1: FBASE, stops: [[0, 0], [1, 0.12]], cut: true });
      plane(g, FIREBED, 0.88);
      hatch(g, FIREBED, rng, { gap: 10, w: 2, ang: 0.24, a: 1, cut: true, fade: (v) => clamp(1.3 - v * 2.4, 0, 1) });
    }
    if (ink === 'orange') print(g, FIREBED, 0.55);
  },
  live(ctx, u) {
    const logs = (g) => {
      for (const cx of [270, 810]) {
        g.fill(nib([[cx - 150, 900], [cx - 20, 856], [cx + 128, 872]], wSwell(19, 0.45, 0.9), { per: 10 }));
        g.fill(nib([[cx - 108, 878], [cx + 30, 900], [cx + 156, 858]], wSwell(15, 0.5, 0.9), { per: 10 }));
      }
    };
    /* The bed is the nearest plane, so it occludes the light rather than taking
       it: knocking it out of every opening and every glow band stops relight
       putting paper back over it and stops yellow printing on top of it. */
    const disc = (cx, r) => (g) => {
      g.beginPath(); g.ellipse(cx, FBASE - 150, r, r * 0.94, 0, 0, TAU); g.fill();
      g.globalCompositeOperation = 'destination-out';
      g.fill(FIREBED);
    };

    /* right: open the night, step the glow out, step the flame in */
    relight(ctx, 'orange', [
      { coverage: 0.26, draw: disc(810, 262) },
      { coverage: 0.52, draw: disc(810, 206) },
      { coverage: 0.8, draw: disc(810, 152) },
      { coverage: 1, draw: disc(810, 104) },
    ]);
    bandPass(ctx, 'yellow', {}, [
      { coverage: 0.12, draw: disc(810, 248) },
      { coverage: 0.22, draw: disc(810, 192) },
      { coverage: 0.36, draw: disc(810, 140) },
      { coverage: 0.54, draw: disc(810, 92) },
    ]);
    bandPass(ctx, 'orange', {}, [
      { coverage: 0.3, draw: (g) => g.fill(flame(810, 360, 96, u, 1)) },
      { coverage: 0.58, draw: (g) => g.fill(flame(810, 360, 96, u, 0.74)) },
      { coverage: 0.88, draw: (g) => g.fill(flame(810, 360, 96, u, 0.5)) },
      { coverage: 0, draw: (g) => g.fill(flame(810, 360, 96, u, 0.26)) },
    ]);

    /* left: one flat pass for the glow, one for the flame, over an unopened night */
    inkPass(ctx, 'yellow', { coverage: 0.26 }, disc(270, 248));
    inkPass(ctx, 'orange', { coverage: 0.72 }, (g) => g.fill(flame(270, 360, 96, u, 1)));

    inkPass(ctx, 'indigo', { coverage: 0.96 }, logs);
  },
});

/* ── sheet ────────────────────────────────────────────────────────────────── */

const STUDIES = [
  ['silhouette', 'assembled primitives | one cut contour'],
  ['stroke', 'constant lineWidth | tapered nib ribbon'],
  ['ramp',   'flat screen | coverage gradient as a dot ramp'],
  ['form',   'flat silhouette | modelled, bedded, overprint core'],
  ['texture', 'one flat screen | ramp, hatch, spray, dry pass'],
  ['depth',  'subject on flat ground | four planes, haze, occluder'],
  ['kettle', 'exemplar — the moment it whistles, dot as the source'],
  ['wave',   'exemplar — a barrel is an opening, dot at the far end'],
  ['telescope', 'exemplar — scale, not detail; dot as the galaxy core'],
  ['weight', 'motion — one curve for everything | the curve each mass implies'],
  ['launch', 'motion — it just leaves | anticipation, and what it leaves swinging'],
  ['flame', 'live element — one flat coverage | stepped bands, on an opened ground'],
];

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
canvas.width = canvas.height = W;
canvas.style.width = canvas.style.height = CSS + 'px';

const capName = document.getElementById('cap-name');
const capNote = document.getElementById('cap-note');

function render(t) {
  const i = clamp(Math.floor(t + 1e-6), 0, STUDIES.length - 1);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(paper, 0, 0);
  ctx.globalCompositeOperation = 'multiply';
  ctx.drawImage(bakeScene(STUDIES[i][0], W), 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  const sc = SCENES[STUDIES[i][0]];
  if (sc.live) { ctx.save(); sc.live(ctx, clamp(t - i, 0, 1)); ctx.restore(); }
  capName.textContent = i + '  ' + STUDIES[i][0];
  capNote.textContent = STUDIES[i][1];
}

let at = 0;
addEventListener('keydown', (e) => {
  if (e.code === 'ArrowRight') render(at = clamp(at + 1, 0, STUDIES.length - 1));
  if (e.code === 'ArrowLeft') render(at = clamp(at - 1, 0, STUDIES.length - 1));
});

paper = bakePaper();
for (const name of Object.keys(INK)) screenOf(name);

window.__riso = { duration: STUDIES.length, ready: false, seek: render };

(async function boot() {
  const el = document.getElementById('load');
  for (let i = 0; i < STUDIES.length; i++) {
    el.textContent = 'baking plates… ' + (i + 1) + '/' + STUDIES.length;
    await new Promise(r => setTimeout(r, 0));
    bakeScene(STUDIES[i][0], W);
  }
  el.remove();
  render(at = Number(new URLSearchParams(location.search).get('t')) || 0);
  window.__riso.ready = true;
})();
</script>
